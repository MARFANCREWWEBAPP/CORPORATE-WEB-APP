            <div class="feature-pills"><span>Calendario centralizado</span><span>Presupuestos versionados</span><span>Seguimiento comercial</span><span>Histórico completo</span></div>
          </div>
          <div class="login-legal">MARQUEE PRODUCCIONES Y AUDIOVISUALES, S.L.</div>
        </section>
        <section class="login-panel">
          <div class="login-card">
            <img class="login-mobile-logo" src="${LOGO_DARK}" alt="Marquee Audiovisuales">
            <h2>Bienvenido</h2>
            <p>Accede al entorno de prueba y comprueba la experiencia de cada tipo de usuario.</p>
            <div class="demo-profiles">
              ${Object.entries(profiles).map(([key, p]) => `<button type="button" class="demo-profile ${app.loginProfile === key ? "active" : ""}" data-action="select-login-profile" data-profile="${key}">${icon(p.icon)}<span>${p.label}</span></button>`).join("")}
            </div>
            <form id="login-form" class="stack">
              <div><label class="label" for="login-email">Email</label><input class="field" id="login-email" name="email" type="email" autocomplete="email" value="${escapeHtml(selected.email)}" required></div>
              <div><div class="row"><label class="label" for="login-password" style="margin-bottom:7px">Contraseña</label><span class="spacer"></span><span class="small muted">Demo: ${DEMO_PASSWORD}</span></div><input class="field" id="login-password" name="password" type="password" autocomplete="current-password" value="${DEMO_PASSWORD}" required></div>
              <label class="check-row"><input type="checkbox" checked> Recordar sesión</label>
              <button class="btn btn-primary" type="submit">Iniciar sesión ${icon("arrowRight", "icon-sm")}</button>
            </form>
            <div id="login-error" class="login-error"></div>
            <div class="login-note"><strong>Versión de prueba autónoma.</strong> Los cambios se guardan en este navegador. Puedes crear eventos, cambiar estados, adjuntar archivos, comentar y probar los tres perfiles.</div>
          </div>
        </section>
      </div>`;
    document.body.classList.remove("no-scroll");
    document.getElementById("overlay-root").innerHTML = "";
    document.getElementById("modal-root").innerHTML = "";
  }

  function unreadCount(user) {
    return app.data.notifications.filter(n => n.recipientId === user.id && !n.readAt).length;
  }

  function renderShell() {
    const user = currentUser();
    if (!user) return renderLogin();
    app.page = safePage(app.page, user);
    const nav = navItemsFor(user);
    const unread = unreadCount(user);
    document.getElementById("app").innerHTML = `
      <div class="app-shell">
        <div id="mobile-overlay" class="mobile-overlay" data-action="close-mobile-menu"></div>
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-brand"><img class="sidebar-logo" src="${LOGO_WHITE}" alt="Marquee Audiovisuales"><div class="sidebar-subtitle">Gestión de eventos corporativos</div></div>
          <div class="nav-scroll">
            <div class="nav-label">Navegación</div>
            ${nav.map(([page, label, iconName]) => `<button class="nav-item ${app.page === page ? "active" : ""}" data-action="navigate" data-page="${page}">${icon(iconName)}<span>${label}</span>${page === "notifications" && unread ? `<span class="nav-count">${unread}</span>` : ""}</button>`).join("")}
          </div>
          <div class="sidebar-footer">
            <div class="user-chip"><div class="avatar">${initials(user)}</div><div style="min-width:0"><div class="user-name">${escapeHtml(user.firstName)} ${escapeHtml(user.lastName)}</div><div class="user-email">${escapeHtml(user.email)}</div></div></div>
            <div class="side-actions"><button class="side-action" data-action="logout">${icon("logout", "icon-sm")} Salir</button><button class="side-action" data-action="reset-demo">${icon("refresh", "icon-sm")} Reiniciar</button></div>
          </div>
        </aside>
        <div class="main-column">
          <header class="topbar">
            <button class="topbar-action mobile-menu" data-action="open-mobile-menu" aria-label="Abrir menú">${icon("menu")}</button>
            <form id="global-search-form" class="global-search"><span>${icon("search")}</span><input class="field" name="q" placeholder="Buscar evento, cliente, agencia, contacto..." value="${escapeHtml(app.eventFilters.q)}"></form>
            <span class="spacer"></span>
            <button class="topbar-action" data-action="navigate" data-page="notifications" aria-label="Notificaciones">${icon("bell")}${unread ? `<span class="notification-dot">${unread > 9 ? "9+" : unread}</span>` : ""}</button>
            <button class="btn btn-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}<span class="new-event-text">${user.role === "VENUE_USER" ? "Nueva petición" : "Nuevo evento"}</span></button>
          </header>
          <main class="main-content" id="page-content">${renderPage()}</main>
        </div>
      </div>`;
    renderOverlay();
    renderModal();
    document.body.classList.toggle("no-scroll", Boolean(app.selectedEventId || app.modal));
  }

  function renderPage() {
    switch (app.page) {
      case "dashboard": return renderDashboard();
      case "events": return renderEvents();
      case "new-event": return renderNewEvent();
      case "calendar": return renderCalendar();
      case "venues": return renderVenues();
      case "my-venue": return renderMyVenue();
      case "budgets": return renderBudgets();
      case "notifications": return renderNotifications();
      case "statistics": return renderStatistics();
      case "users": return renderUsers();
      case "settings": return renderSettings();
      default: return renderDashboard();
    }
  }

  function pageHead(title, description, actions = "") {
    return `<div class="page-head"><div><h1>${escapeHtml(title)}</h1><p>${escapeHtml(description)}</p></div><div class="page-actions">${actions}</div></div>`;
  }

  function navigate(page, options = {}) {
    const user = currentUser();
    if (!user) return;
    app.page = safePage(page, user);
    if (options.q !== undefined) app.eventFilters.q = options.q;
    history.replaceState(null, "", `#${app.page}`);
    closeMobileMenu();
    renderShell();
  }

  function openMobileMenu() {
    document.getElementById("sidebar")?.classList.add("open");
    document.getElementById("mobile-overlay")?.classList.add("show");
  }

  function closeMobileMenu() {
    document.getElementById("sidebar")?.classList.remove("open");
    document.getElementById("mobile-overlay")?.classList.remove("show");
  }

  function daysFromToday(iso) {
    const one = parseDate(iso).setHours(0, 0, 0, 0);
    const two = new Date().setHours(0, 0, 0, 0);
    return Math.round((one - two) / 86400000);
  }

  function eventTime(event) {
    if (!event.estimatedStartTime && !event.estimatedEndTime) return "Horario pendiente";
    if (event.estimatedStartTime && event.estimatedEndTime) return `${event.estimatedStartTime} – ${event.estimatedEndTime}`;
    return event.estimatedStartTime || event.estimatedEndTime;
  }

  function latestBudget(event, user = currentUser()) {
    return [...visibleBudgets(event, user)].sort((a, b) => b.version - a.version)[0] || null;
  }

  function metricCard(label, value, iconName, page, filterKey = "", filterValue = "", foot = "") {
    return `<button class="metric-card" data-action="metric-nav" data-page="${page}" data-filter-key="${filterKey}" data-filter-value="${filterValue}"><div class="metric-top"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-icon">${icon(iconName)}</div></div><div class="metric-value mono">${escapeHtml(value)}</div>${foot ? `<div class="metric-foot">${escapeHtml(foot)}</div>` : ""}</button>`;
  }

  function renderDashboard() {
    const user = currentUser();
    const events = visibleEvents(user);
    const future = events.filter(e => daysFromToday(e.eventDate) >= 0 && ACTIVE_STATUSES.includes(e.status)).sort((a, b) => a.eventDate.localeCompare(b.eventDate) || PRIORITY[b.priority].rank - PRIORITY[a.priority].rank);
    const count = predicate => events.filter(predicate).length;
    const confirmed = count(e => e.status === "CONFIRMED");
    const declined = count(e => e.status === "NOT_ACCEPTED");
    const conversion = confirmed + declined ? Math.round(confirmed / (confirmed + declined) * 100) : 0;
    const next7 = count(e => daysFromToday(e.eventDate) >= 0 && daysFromToday(e.eventDate) <= 7 && ACTIVE_STATUSES.includes(e.status));
    const next30 = count(e => daysFromToday(e.eventDate) >= 0 && daysFromToday(e.eventDate) <= 30 && ACTIVE_STATUSES.includes(e.status));
    const urgent = count(e => ["URGENT", "VERY_URGENT"].includes(e.priority) && ACTIVE_STATUSES.includes(e.status));
    const noBudget = count(e => ACTIVE_STATUSES.includes(e.status) && visibleBudgets(e, user).length === 0);
    const alertEvents = future.filter(e => daysFromToday(e.eventDate) <= 7 && e.status !== "CONFIRMED");
    const histories = events.flatMap(e => e.history.map(h => ({ ...h, event: e }))).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 8);

    const cards = user.role === "VENUE_USER" ? [
      metricCard("Peticiones abiertas", count(e => ACTIVE_STATUSES.includes(e.status) && e.status !== "CONFIRMED"), "clock", "events", "open", "1", "Seguimiento de tu finca"),
      metricCard("Presupuestos recibidos", events.reduce((sum, e) => sum + visibleBudgets(e, user).length, 0), "euro", "budgets", "", "", "Versiones disponibles"),
      metricCard("Eventos confirmados", confirmed, "check", "events", "status", "CONFIRMED", "Preparados para producción"),
      metricCard("Próximos 30 días", next30, "calendar", "calendar", "", "", "Incluidos en calendario")
    ] : [
      metricCard("Nuevas peticiones", count(e => e.status === "NEW_REQUEST"), "plus", "events", "status", "NEW_REQUEST"),
      metricCard("Eventos urgentes", urgent, "warning", "events", "priority", "URGENT"),
      metricCard("Preparando presupuesto", count(e => e.status === "PREPARING_BUDGET"), "file", "events", "status", "PREPARING_BUDGET"),
      metricCard("Pendientes de respuesta", count(e => e.status === "PENDING_RESPONSE"), "clock", "events", "status", "PENDING_RESPONSE"),
      metricCard("Confirmados", confirmed, "check", "events", "status", "CONFIRMED"),
      metricCard("Próximos 7 días", next7, "calendar", "calendar"),
      metricCard("Sin presupuesto", noBudget, "euro", "events", "budget", "no"),
      metricCard("Conversión comercial", `${conversion}%`, "chart", "statistics")
    ];

    return `
      ${pageHead(user.role === "VENUE_USER" ? "Panel de mi finca" : "Control de eventos corporativos", user.role === "VENUE_USER" ? "Consulta rápidamente el estado de todas tus peticiones." : "Visión operativa y comercial de todas las fincas.")}
      ${alertEvents.length ? `<button class="alert-strip" data-action="open-event" data-id="${alertEvents[0].id}"><span>${icon("warning")}</span><div><strong>${alertEvents.length} evento${alertEvents.length === 1 ? "" : "s"} próximo${alertEvents.length === 1 ? "" : "s"} sin confirmar</strong><div class="alert-copy">Revisa ${escapeHtml(alertEvents[0].eventName)} · ${formatDate(alertEvents[0].eventDate)}</div></div><span class="spacer"></span>${icon("arrowRight")}</button>` : ""}
      <div class="metric-grid">${cards.join("")}</div>
      <div class="dashboard-grid">
        <section class="card">
          <div class="card-header"><div><div class="card-title">Próximos eventos</div><div class="card-desc">Ordenados por fecha y prioridad</div></div><button class="btn btn-ghost btn-sm" data-action="navigate" data-page="calendar">Ver calendario ${icon("arrowRight", "icon-sm")}</button></div>
          <div>${future.slice(0, 8).map(event => {
            const venue = venueById(event.venueId);
            const budget = latestBudget(event, user);
            return `<div class="event-row"><div><div class="event-date">${formatDate(event.eventDate)}</div><div class="event-time mono">${escapeHtml(eventTime(event))}</div></div><div style="min-width:0"><button class="event-name btn-link" data-action="open-event" data-id="${event.id}" style="border:0;background:none;padding:0;cursor:pointer;text-align:left">${escapeHtml(event.eventName)}</button><div class="event-meta truncate">${escapeHtml(venue?.name || "")} · ${escapeHtml(event.finalClient || "Cliente pendiente")} · ${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Pax pendiente"}${budget ? ` · ${escapeHtml(budget.displayName)}` : ""}</div></div><div class="row-wrap">${priorityBadge(event.priority)}${statusBadge(event.status)}<button class="btn btn-secondary btn-icon btn-sm" data-action="open-event" data-id="${event.id}" aria-label="Vista rápida">${icon("eye", "icon-sm")}</button></div></div>`;
          }).join("") || `<div class="empty-state"><div class="empty-icon">${icon("calendar", "icon-lg")}</div><h3>No hay próximos eventos</h3><p>Las nuevas peticiones aparecerán aquí automáticamente.</p></div>`}</div>
        </section>
        <aside class="card">
          <div class="card-header"><div><div class="card-title">Actividad reciente</div><div class="card-desc">Últimos cambios registrados</div></div></div>
          <div class="card-body"><div class="activity-list">${histories.map(item => {
            const actor = userById(item.actorId);
            return `<button class="activity-item" data-action="open-event" data-id="${item.event.id}" style="border-top:0;border-right:0;border-bottom:0;background:transparent;text-align:left;cursor:pointer"><div class="activity-title">${escapeHtml(item.summary)}</div><div class="activity-meta">${escapeHtml(item.event.eventName)}<br>${escapeHtml(actor ? `${actor.firstName} ${actor.lastName}` : "Sistema")} · ${relativeTime(item.createdAt)}</div></button>`;
          }).join("") || `<div class="small muted">Sin actividad reciente.</div>`}</div></div>
        </aside>
      </div>`;
  }

  function filteredEvents() {
    const user = currentUser();
    const f = app.eventFilters;
    let events = visibleEvents(user).filter(event => {
      const venue = venueById(event.venueId);
      const text = [event.eventName, event.finalClient, event.agency, event.contactFirstName, event.contactLastName, event.email, event.phone, venue?.name].filter(Boolean).join(" ").toLowerCase();
      if (f.q && !text.includes(f.q.toLowerCase())) return false;
      if (f.venue && event.venueId !== f.venue) return false;
      if (f.status && event.status !== f.status) return false;
      if (f.priority && event.priority !== f.priority && !(f.priority === "URGENT" && event.priority === "VERY_URGENT")) return false;
      if (f.budget === "yes" && visibleBudgets(event, user).length === 0) return false;
      if (f.budget === "no" && visibleBudgets(event, user).length > 0) return false;
      if (f.open === "1" && (!ACTIVE_STATUSES.includes(event.status) || event.status === "CONFIRMED")) return false;
      return true;
    });
    const { key, direction } = app.eventSort;
    events.sort((a, b) => {
      let av = a[key], bv = b[key];
      if (key === "venue") { av = venueById(a.venueId)?.name || ""; bv = venueById(b.venueId)?.name || ""; }
      if (key === "priority") { av = PRIORITY[a.priority].rank; bv = PRIORITY[b.priority].rank; }
      if (av == null) av = "";
      if (bv == null) bv = "";
      const result = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv), "es");
      return direction === "asc" ? result : -result;
    });
    return events;
  }

  function sortHeader(key, label) {
    const active = app.eventSort.key === key;
    const arrow = active ? (app.eventSort.direction === "asc" ? " ↑" : " ↓") : "";
    return `<button class="sort-btn" data-action="sort-events" data-key="${key}">${escapeHtml(label)}${arrow}</button>`;
  }

  function renderEvents() {
    const user = currentUser();
    const events = filteredEvents();
    const ops = isOps(user);
    const venueOptions = `<option value="">Todas las fincas</option>${app.data.venues.filter(v => v.state === "ACTIVE").map(v => `<option value="${v.id}" ${app.eventFilters.venue === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}`;
    return `
      ${pageHead(user.role === "VENUE_USER" ? "Mis eventos" : "Eventos", `${events.length} resultado${events.length === 1 ? "" : "s"} · búsqueda, seguimiento y acceso rápido a documentación.`, `${ops ? `<button class="btn btn-secondary" data-action="export-csv">${icon("download", "icon-sm")}Exportar CSV</button>` : ""}<button class="btn btn-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}${user.role === "VENUE_USER" ? "Nueva petición" : "Nuevo evento"}</button>`)}
      <section class="card filter-bar">
        <div class="search-field"><span>${icon("search", "icon-sm")}</span><input id="events-search" class="field" placeholder="Buscar por evento, cliente, agencia..." value="${escapeHtml(app.eventFilters.q)}" data-filter="q"></div>
        ${ops ? `<select class="select" data-filter="venue">${venueOptions}</select>` : ""}
        <select class="select" data-filter="status">${optionList(STATUS, app.eventFilters.status, true, "Todos los estados")}</select>
        <select class="select" data-filter="priority">${optionList(PRIORITY, app.eventFilters.priority, true, "Todas las prioridades")}</select>
        <select class="select" data-filter="budget"><option value="" ${!app.eventFilters.budget ? "selected" : ""}>Con o sin presupuesto</option><option value="yes" ${app.eventFilters.budget === "yes" ? "selected" : ""}>Con presupuesto</option><option value="no" ${app.eventFilters.budget === "no" ? "selected" : ""}>Sin presupuesto</option></select>
        <button class="btn btn-secondary" data-action="clear-filters">${icon("refresh", "icon-sm")}Limpiar</button>
      </section>
      <section class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>${sortHeader("eventDate", "Fecha")}</th><th>${sortHeader("eventName", "Evento")}</th><th>${sortHeader("finalClient", "Cliente")}</th>${ops ? `<th>${sortHeader("venue", "Finca")}</th>` : ""}<th>Contacto</th><th>${sortHeader("numberOfPeople", "Personas")}</th><th>${sortHeader("status", "Estado")}</th><th>${sortHeader("priority", "Prioridad")}</th><th>Presupuesto</th><th>Actualizado</th><th style="text-align:right">Acciones</th></tr></thead>
            <tbody>${events.map(event => {
              const venue = venueById(event.venueId);
              const budgets = visibleBudgets(event, user);
              const latest = latestBudget(event, user);
              return `<tr><td><strong>${formatDate(event.eventDate, { day: "2-digit", month: "short" })}</strong><div class="table-sub mono">${escapeHtml(eventTime(event))}</div></td><td><div class="table-event truncate">${escapeHtml(event.eventName)}</div><div class="table-sub">${escapeHtml(event.agency || "Sin agencia")}</div></td><td>${escapeHtml(event.finalClient || "—")}</td>${ops ? `<td>${escapeHtml(venue?.name || "—")}</td>` : ""}<td><div>${escapeHtml([event.contactFirstName, event.contactLastName].filter(Boolean).join(" ") || "—")}</div><div class="table-sub">${escapeHtml(event.phone || event.email || "Sin contacto")}</div></td><td class="mono">${event.numberOfPeople ?? "—"}</td><td>${statusBadge(event.status)}</td><td>${priorityBadge(event.priority)}</td><td>${latest ? `<button class="btn btn-secondary btn-sm" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">${icon("euro", "icon-sm")}${escapeHtml(latest.displayName)}${budgets.length > 1 ? ` +${budgets.length - 1}` : ""}</button>` : `<span class="badge badge-neutral">Sin presupuesto</span>`}</td><td><span class="small muted">${relativeTime(event.updatedAt)}</span></td><td><div class="table-actions"><button class="btn btn-secondary btn-icon btn-sm" data-action="open-event" data-id="${event.id}" title="Vista rápida">${icon("eye", "icon-sm")}</button>${ops ? `<button class="btn btn-secondary btn-icon btn-sm" data-action="edit-event" data-id="${event.id}" title="Editar">${icon("edit", "icon-sm")}</button>` : ""}</div></td></tr>`;
            }).join("")}</tbody>
          </table>
          ${events.length ? "" : `<div class="empty-state"><div class="empty-icon">${icon("search", "icon-lg")}</div><h3>No hay eventos con estos filtros</h3><p>Prueba a limpiar los filtros o crea una nueva petición.</p><button class="btn btn-primary" data-action="clear-filters" style="margin-top:15px">Limpiar filtros</button></div>`}
        </div>
      </section>`;
  }

  function renderNewEvent() {
    const user = currentUser();
    const ops = isOps(user);
    const venue = user.role === "VENUE_USER" ? venueById(user.venueId) : null;
    const venueField = ops
      ? `<select class="select" name="venueId" required><option value="">Selecciona una finca</option>${app.data.venues.filter(v => v.state === "ACTIVE").map(v => `<option value="${v.id}">${escapeHtml(v.name)}</option>`).join("")}</select>`
      : `<input type="hidden" name="venueId" value="${venue.id}"><input class="field" value="${escapeHtml(venue.name)}" disabled>`;
    return `
      ${pageHead(user.role === "VENUE_USER" ? "Nueva petición" : "Nuevo evento", "Formulario rápido: puedes guardar la petición aunque todavía falten algunos datos.", `<button class="btn btn-secondary" data-action="navigate" data-page="events">${icon("arrowLeft", "icon-sm")}Volver a eventos</button>`)}
      <div class="dashboard-grid" style="grid-template-columns:minmax(0,1.5fr) minmax(280px,.55fr)">
        <section class="card">
          <div class="card-header"><div><div class="card-title">Datos de la petición</div><div class="card-desc">Los campos principales están agrupados para completar el alta en menos de un minuto.</div></div><span class="badge badge-new">Nueva petición</span></div>
          <div class="card-body">
            <form id="new-event-form" class="form-grid">
              <div class="full"><label class="label">Nombre del evento *</label><input class="field" name="eventName" placeholder="Ej. Convención anual Empresa XXX" required autofocus></div>
              <div><label class="label">Finca del evento *</label>${venueField}</div>
              <div><label class="label">Empresa / cliente final</label><input class="field" name="finalClient" placeholder="Razón social o marca"></div>
              <div><label class="label">Fecha del evento *</label><input class="field" type="date" name="eventDate" min="${dateIso(new Date())}" value="${addDaysIso(14)}" required></div>
              <div><label class="label">Prioridad inicial</label><select class="select" name="priority">${optionList(PRIORITY, "NORMAL")}</select></div>
              <div><label class="label">Hora estimada de inicio</label><input class="field" type="time" name="estimatedStartTime" value="18:00"></div>
              <div><label class="label">Hora estimada de fin</label><input class="field" type="time" name="estimatedEndTime" value="23:30"></div>
              <div><label class="label">Nombre de contacto</label><input class="field" name="contactFirstName" placeholder="Nombre"></div>
              <div><label class="label">Apellidos</label><input class="field" name="contactLastName" placeholder="Apellidos"></div>
              <div><label class="label">Agencia</label><input class="field" name="agency" placeholder="Agencia organizadora"></div>
              <div><label class="label">Número de personas</label><input class="field" type="number" min="1" max="100000" name="numberOfPeople" placeholder="Ej. 250"></div>
              <div><label class="label">Correo electrónico</label><input class="field" type="email" name="email" placeholder="contacto@empresa.com"></div>
              <div><label class="label">Teléfono de contacto</label><input class="field" type="tel" name="phone" placeholder="600 000 000"></div>
              <div class="full"><label class="label">Petición de audiovisuales</label><textarea class="textarea" name="audiovisualRequest" placeholder="Ej. Pantalla LED, sonido, 4 micrófonos inalámbricos, iluminación ambiente, escenario de 6 × 4 m y técnico durante todo el evento."></textarea></div>
              <div class="full"><label class="label">Necesidades técnicas</label><textarea class="textarea" name="technicalRequirements" placeholder="Conexiones, streaming, microfonía, potencia eléctrica, horarios de montaje..."></textarea></div>
              <div class="full"><label class="label">Observaciones</label><textarea class="textarea" name="observations" placeholder="Cualquier información adicional relevante."></textarea></div>
              ${ops ? `<div class="full"><label class="label">Comercial asignado</label><select class="select" name="assignedCommercialId"><option value="">Sin asignar</option>${app.data.users.filter(u => u.active && u.role === "COMMERCIAL").map(u => `<option value="${u.id}" selected>${escapeHtml(u.firstName)} ${escapeHtml(u.lastName)}</option>`).join("")}</select></div>` : ""}
              <div class="full row-wrap" style="justify-content:flex-end;margin-top:3px"><button type="button" class="btn btn-secondary" data-action="navigate" data-page="events">Cancelar</button><button class="btn btn-primary" type="submit">${icon("plus", "icon-sm")}Crear petición</button></div>
            </form>
          </div>
        </section>
        <aside class="stack">
          <div class="card card-pad"><div class="row">${icon("clock")}<strong style="font-size:13px">Alta rápida</strong></div><p class="small muted" style="line-height:1.65;margin:12px 0 0">Solo son obligatorios el nombre, la finca y la fecha. Los datos pendientes quedarán señalados para completar después.</p></div>
          <div class="card card-pad"><div class="row">${icon("calendar")}<strong style="font-size:13px">Calendario automático</strong></div><p class="small muted" style="line-height:1.65;margin:12px 0 0">Al guardar, el evento aparecerá inmediatamente en el calendario de la finca y en el calendario global.</p></div>
          <div class="card card-pad"><div class="row">${icon("warning")}<strong style="font-size:13px">Control de duplicados</strong></div><p class="small muted" style="line-height:1.65;margin:12px 0 0">La plataforma avisará si existe otra petición de la misma finca, cliente y fecha.</p></div>
          <div class="card card-pad" style="background:#15181d;color:#fff;border-color:#15181d"><img src="${LOGO_WHITE}" alt="Marquee" style="width:170px;opacity:.92"><p class="tiny" style="line-height:1.65;color:rgba(255,255,255,.5);margin:13px 0 0">Todas las acciones quedan registradas en el histórico del evento.</p></div>
        </aside>
      </div>`;
  }

  function calendarEvents() {
    const user = currentUser();
    const venueFilter = user.role === "VENUE_USER" ? user.venueId : app.calendarVenue;
    return visibleEvents(user).filter(e => !venueFilter || e.venueId === venueFilter);
  }

  function startOfWeek(date) {
    const d = new Date(date);
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    d.setHours(12, 0, 0, 0);
    return d;
  }

  function calendarPeriodTitle() {
    if (app.calendarView === "month") return new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" }).format(app.calendarDate);
    if (app.calendarView === "day") return formatDateLong(dateIso(app.calendarDate));
    if (app.calendarView === "week") {
      const start = startOfWeek(app.calendarDate);
      const end = new Date(start); end.setDate(end.getDate() + 6);
      return `${formatDate(dateIso(start), { day: "numeric", month: "short" })} – ${formatDate(dateIso(end), { day: "numeric", month: "short", year: "numeric" })}`;
    }
    return "Próximos eventos";
  }

  function renderCalendarToolbar() {
    const user = currentUser();
    const ops = isOps(user);
    return `<div class="calendar-toolbar">
      <button class="btn btn-secondary btn-icon btn-sm" data-action="calendar-move" data-direction="-1" aria-label="Anterior">${icon("arrowLeft", "icon-sm")}</button>
      <button class="btn btn-secondary btn-sm" data-action="calendar-today">Hoy</button>
      <button class="btn btn-secondary btn-icon btn-sm" data-action="calendar-move" data-direction="1" aria-label="Siguiente">${icon("arrowRight", "icon-sm")}</button>
      <div class="calendar-title">${escapeHtml(calendarPeriodTitle())}</div>
      <span class="spacer"></span>
      ${ops ? `<select class="select" id="calendar-venue" style="width:auto;min-width:190px"><option value="">Todas las fincas</option>${app.data.venues.filter(v => v.state === "ACTIVE").map(v => `<option value="${v.id}" ${app.calendarVenue === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select>` : ""}
      <div class="segmented">${[["month", "Mes"], ["week", "Semana"], ["day", "Día"], ["list", "Listado"]].map(([key, label]) => `<button class="${app.calendarView === key ? "active" : ""}" data-action="calendar-view" data-view="${key}">${label}</button>`).join("")}</div>
    </div>`;
  }

  function calendarEventHtml(event) {
    const budgetCount = visibleBudgets(event).length;
    const docs = visibleDocuments(event).length;
    const incomplete = eventIncompleteFields(event).length;
    return `<div class="cal-event priority-${event.priority} ${event.status === "CONFIRMED" ? "confirmed" : ""}" data-action="open-event" data-id="${event.id}" role="button" tabindex="0" title="${escapeHtml(event.eventName)}"><div class="cal-event-title">${escapeHtml(event.estimatedStartTime || "")} ${escapeHtml(event.eventName)}</div><div class="cal-event-meta"><span>${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Pax ?"}</span><span class="cal-indicators">${budgetCount ? `<button type="button" class="cal-budget-btn" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets" title="${budgetCount} presupuesto(s)">€${budgetCount > 1 ? budgetCount : ""}</button>` : ""}${docs ? `<span title="Documentos">📎</span>` : ""}${incomplete ? `<span title="Información pendiente">!</span>` : ""}</span></div></div>`;
  }

  function renderMonthCalendar(events) {
    const year = app.calendarDate.getFullYear();
    const month = app.calendarDate.getMonth();
    const first = new Date(year, month, 1, 12);
    const mondayOffset = (first.getDay() + 6) % 7;
    const start = new Date(first); start.setDate(first.getDate() - mondayOffset);
    const weekdays = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
    const cells = [];
    const today = dateIso(new Date());
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const iso = dateIso(d);
      const dayEvents = events.filter(e => e.eventDate === iso).sort((a, b) => (a.estimatedStartTime || "99:99").localeCompare(b.estimatedStartTime || "99:99"));
      cells.push(`<div class="calendar-cell ${d.getMonth() !== month ? "outside" : ""} ${iso === today ? "today" : ""}"><div class="day-number"><span>${d.getDate()}</span>${dayEvents.length ? `<span class="day-count">${dayEvents.length}</span>` : ""}</div>${dayEvents.slice(0, 3).map(calendarEventHtml).join("")}${dayEvents.length > 3 ? `<button class="more-events" data-action="calendar-day" data-date="${iso}">+ ${dayEvents.length - 3} más</button>` : ""}</div>`);
    }
    return `<div class="calendar-scroll"><div class="calendar-grid">${weekdays.map(d => `<div class="calendar-weekday">${d}</div>`).join("")}${cells.join("")}</div></div>`;
  }

  function renderWeekCalendar(events) {
    const start = startOfWeek(app.calendarDate);
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
    return `<div class="week-grid">${days.map(d => {
      const iso = dateIso(d);
      const dayEvents = events.filter(e => e.eventDate === iso).sort((a, b) => (a.estimatedStartTime || "99:99").localeCompare(b.estimatedStartTime || "99:99"));
      return `<div class="week-day"><div class="week-head">${formatDate(iso, { weekday: "short", day: "numeric", month: "short" })}</div><div class="week-day-body">${dayEvents.map(event => `<button class="week-event" data-action="open-event" data-id="${event.id}" style="width:100%;text-align:left;background:#fff"><div class="tiny muted mono">${escapeHtml(eventTime(event))}</div><div style="font-size:11px;font-weight:850;margin-top:5px">${escapeHtml(event.eventName)}</div><div class="row-wrap" style="margin-top:7px">${priorityBadge(event.priority)}${visibleBudgets(event).length ? `<button class="cal-budget-btn" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">€</button>` : ""}</div></button>`).join("") || `<div class="tiny muted" style="padding:8px">Sin eventos</div>`}</div></div>`;
    }).join("")}</div>`;
  }

  function renderDayCalendar(events) {
    const iso = dateIso(app.calendarDate);
    const dayEvents = events.filter(e => e.eventDate === iso).sort((a, b) => (a.estimatedStartTime || "99:99").localeCompare(b.estimatedStartTime || "99:99"));
    return `<div class="day-list">${dayEvents.map(event => {
      const venue = venueById(event.venueId);
      const budget = latestBudget(event);
      return `<div class="day-event-card"><div><strong class="mono">${escapeHtml(event.estimatedStartTime || "—")}</strong><div class="tiny muted">${escapeHtml(event.estimatedEndTime || "")}</div></div><div><button data-action="open-event" data-id="${event.id}" style="border:0;background:none;padding:0;font-size:13px;font-weight:850;cursor:pointer;text-align:left">${escapeHtml(event.eventName)}</button><div class="small muted" style="margin-top:5px">${escapeHtml(venue?.name || "")} · ${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Personas pendientes"}</div><div class="row-wrap" style="margin-top:8px">${statusBadge(event.status)}${priorityBadge(event.priority)}</div></div><div class="row-wrap">${budget ? `<button class="btn btn-secondary btn-sm" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">${icon("euro", "icon-sm")}${escapeHtml(budget.displayName)}</button>` : ""}<button class="btn btn-primary btn-sm" data-action="open-event" data-id="${event.id}">Abrir evento</button></div></div>`;
    }).join("") || `<div class="empty-state"><div class="empty-icon">${icon("calendar", "icon-lg")}</div><h3>No hay eventos este día</h3><p>Selecciona otra fecha o crea una nueva petición.</p></div>`}</div>`;
  }

  function renderListCalendar(events) {
    const list = events.filter(e => daysFromToday(e.eventDate) >= -7).sort((a, b) => a.eventDate.localeCompare(b.eventDate) || (a.estimatedStartTime || "").localeCompare(b.estimatedStartTime || "")).slice(0, 80);
    return `<div class="calendar-list">${list.map(event => {
      const venue = venueById(event.venueId);
      const budgets = visibleBudgets(event);
      return `<div class="day-event-card"><div><strong>${formatDate(event.eventDate, { day: "2-digit", month: "short" })}</strong><div class="tiny muted mono">${escapeHtml(eventTime(event))}</div></div><div><button data-action="open-event" data-id="${event.id}" style="border:0;background:none;padding:0;font-size:13px;font-weight:850;cursor:pointer;text-align:left">${escapeHtml(event.eventName)}</button><div class="small muted" style="margin-top:5px">${escapeHtml(venue?.name || "")} · ${escapeHtml(event.finalClient || "Cliente pendiente")}</div><div class="row-wrap" style="margin-top:7px">${statusBadge(event.status)}${priorityBadge(event.priority)}</div></div><div>${budgets.length ? `<button class="btn btn-secondary btn-sm" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">${icon("euro", "icon-sm")}${budgets.length} presupuesto${budgets.length === 1 ? "" : "s"}</button>` : `<span class="badge badge-neutral">Sin presupuesto</span>`}</div></div>`;
    }).join("") || `<div class="empty-state"><h3>No hay eventos</h3></div>`}</div>`;
  }

  function renderCalendar() {
    const user = currentUser();
    const events = calendarEvents();
    let body = renderMonthCalendar(events);
    if (app.calendarView === "week") body = renderWeekCalendar(events);
    if (app.calendarView === "day") body = renderDayCalendar(events);
    if (app.calendarView === "list") body = renderListCalendar(events);
    return `${pageHead(user.role === "VENUE_USER" ? "Calendario de mi finca" : "Calendario global", "Todos los eventos aparecen automáticamente en su fecha y permiten acceder directamente a presupuestos.")}<section class="card">${renderCalendarToolbar()}${body}</section>`;
  }

  function venueMetrics(venueId) {
    const events = app.data.events.filter(e => !e.deletedAt && e.venueId === venueId);
    return {
      total: events.length,
      pending: events.filter(e => ACTIVE_STATUSES.includes(e.status) && e.status !== "CONFIRMED").length,
      confirmed: events.filter(e => e.status === "CONFIRMED").length,
      upcoming: events.filter(e => daysFromToday(e.eventDate) >= 0 && ACTIVE_STATUSES.includes(e.status)).length
    };
  }

  function venueCard(venue) {
    const m = venueMetrics(venue.id);
    return `<article class="card venue-card"><div class="venue-cover"><div><div class="tiny" style="color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.12em">${escapeHtml(venue.municipality || "Finca")}</div><div class="venue-name">${escapeHtml(venue.name)}</div></div></div><div class="venue-body"><div class="venue-info">${icon("location", "icon-sm")} ${escapeHtml([venue.address, venue.municipality, venue.province].filter(Boolean).join(", ") || "Dirección pendiente")}<br>${icon("phone", "icon-sm")} ${escapeHtml(venue.phone || "Sin teléfono")} · ${escapeHtml(venue.contactName || "Contacto pendiente")}</div><div class="venue-stats"><div class="venue-stat"><strong>${m.upcoming}</strong><span>Próximos</span></div><div class="venue-stat"><strong>${m.pending}</strong><span>Pendientes</span></div><div class="venue-stat"><strong>${m.confirmed}</strong><span>Confirmados</span></div></div><div class="row-wrap" style="margin-top:14px"><button class="btn btn-secondary btn-sm" data-action="view-venue" data-id="${venue.id}">${icon("eye", "icon-sm")}Ver finca</button><button class="btn btn-primary btn-sm" data-action="filter-by-venue" data-id="${venue.id}">${icon("calendar", "icon-sm")}Eventos</button>${isAdmin() ? `<button class="btn btn-ghost btn-sm" data-action="edit-venue" data-id="${venue.id}">${icon("edit", "icon-sm")}Editar</button>` : ""}</div></div></article>`;
  }

  function renderVenues() {
    const user = currentUser();
    if (!isOps(user)) return renderDashboard();
    const active = app.data.venues.filter(v => v.state === "ACTIVE");
    return `${pageHead("Fincas", `${active.length} espacios activos con calendario y seguimiento independiente.`, isAdmin(user) ? `<button class="btn btn-primary" data-action="new-venue">${icon("plus", "icon-sm")}Nueva finca</button>` : "")}<div class="venue-grid">${active.map(venueCard).join("")}</div>`;
  }

  function renderMyVenue() {
    const user = currentUser();
    if (user.role !== "VENUE_USER") return renderVenues();
    const venue = venueById(user.venueId);
    const m = venueMetrics(venue.id);
    const events = visibleEvents(user).filter(e => daysFromToday(e.eventDate) >= 0).sort((a, b) => a.eventDate.localeCompare(b.eventDate)).slice(0, 6);
    return `${pageHead("Mi finca", "Datos del espacio, próximos eventos y actividad asociada.", `<button class="btn btn-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}Nueva petición</button>`)}
      <div class="dashboard-grid">
        <section class="card"><div class="venue-cover" style="height:180px"><img src="${LOGO_WHITE}" alt="Marquee" style="position:absolute;right:24px;top:24px;width:170px;opacity:.18"><div><div class="tiny" style="color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.12em">${escapeHtml(venue.municipality)}</div><div class="venue-name" style="font-size:28px">${escapeHtml(venue.name)}</div></div></div><div class="card-body"><div class="detail-grid"><div class="detail-item"><div class="detail-label">Dirección</div><div class="detail-value">${escapeHtml(venue.address || "—")}</div></div><div class="detail-item"><div class="detail-label">Municipio / provincia</div><div class="detail-value">${escapeHtml([venue.municipality, venue.province].filter(Boolean).join(", "))}</div></div><div class="detail-item"><div class="detail-label">Persona de contacto</div><div class="detail-value">${escapeHtml(venue.contactName || "—")}</div></div><div class="detail-item"><div class="detail-label">Teléfono</div><div class="detail-value">${escapeHtml(venue.phone || "—")}</div></div><div class="detail-item full"><div class="detail-label">Email</div><div class="detail-value">${escapeHtml(venue.email || "—")}</div></div><div class="detail-item full"><div class="detail-label">Observaciones</div><div class="detail-value">${escapeHtml(venue.observations || "Sin observaciones")}</div></div></div></div></section>
        <aside class="stack"><div class="card card-pad"><div class="metric-label">Próximos eventos</div><div class="metric-value">${m.upcoming}</div></div><div class="card card-pad"><div class="metric-label">Peticiones pendientes</div><div class="metric-value">${m.pending}</div></div><div class="card card-pad"><div class="metric-label">Eventos confirmados</div><div class="metric-value">${m.confirmed}</div></div></aside>
      </div>
      <section class="card" style="margin-top:18px"><div class="card-header"><div><div class="card-title">Próximos eventos</div><div class="card-desc">Agenda actual de ${escapeHtml(venue.name)}</div></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-page="calendar">Ver calendario</button></div>${events.map(event => `<div class="event-row"><div><div class="event-date">${formatDate(event.eventDate)}</div><div class="event-time">${escapeHtml(eventTime(event))}</div></div><div><button class="event-name" data-action="open-event" data-id="${event.id}" style="border:0;background:none;padding:0;cursor:pointer">${escapeHtml(event.eventName)}</button><div class="event-meta">${escapeHtml(event.finalClient || "Cliente pendiente")}</div></div><div class="row-wrap">${statusBadge(event.status)}${priorityBadge(event.priority)}</div></div>`).join("") || `<div class="empty-state"><h3>Sin próximos eventos</h3></div>`}</section>`;
  }

  function allVisibleBudgetRows() {
    const user = currentUser();
    return visibleEvents(user).flatMap(event => visibleBudgets(event, user).map(budget => ({ event, budget }))).sort((a, b) => b.budget.createdAt.localeCompare(a.budget.createdAt));
  }

  function renderBudgets() {
    const user = currentUser();
    const rows = allVisibleBudgetRows();
    return `${pageHead("Presupuestos", `${rows.length} versión${rows.length === 1 ? "" : "es"} disponible${rows.length === 1 ? "" : "s"}. Nunca se sobrescriben versiones anteriores.`, `<button class="btn btn-secondary" data-action="navigate" data-page="calendar">${icon("calendar", "icon-sm")}Abrir calendario</button>`)}
      <section class="card">${rows.map(({ event, budget }) => {
        const venue = venueById(event.venueId);
        const uploader = userById(budget.uploadedById);
        return `<div class="budget-card"><div class="file-icon">${icon("file")}</div><div class="budget-main"><div class="row-wrap"><button class="budget-name" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets" style="border:0;background:none;padding:0;cursor:pointer">${escapeHtml(budget.displayName)}</button>${budgetBadge(budget.status)}<span class="badge badge-neutral">V${budget.version}</span></div><div class="budget-meta">${escapeHtml(event.eventName)} · ${escapeHtml(venue?.name || "")} · ${escapeHtml(uploader ? `${uploader.firstName} ${uploader.lastName}` : "Sistema")} · ${formatDateTime(budget.createdAt)}</div>${budget.description ? `<div class="small muted" style="margin-top:7px">${escapeHtml(budget.description)}</div>` : ""}</div><div class="row-wrap"><button class="btn btn-secondary btn-sm" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${budget.id}">${icon("download", "icon-sm")}Descargar</button><button class="btn btn-primary btn-sm" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">Ver evento</button></div></div>`;
      }).join("") || `<div class="empty-state"><div class="empty-icon">${icon("euro", "icon-lg")}</div><h3>No hay presupuestos disponibles</h3><p>Los presupuestos enviados aparecerán aquí y dentro de cada evento.</p></div>`}</section>`;
  }

  function renderNotifications() {
    const user = currentUser();
    const items = app.data.notifications.filter(n => n.recipientId === user.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return `${pageHead("Notificaciones", `${items.filter(n => !n.readAt).length} pendiente${items.filter(n => !n.readAt).length === 1 ? "" : "s"} de leer.`, `<button class="btn btn-secondary" data-action="mark-all-read">${icon("check", "icon-sm")}Marcar todas como leídas</button>`)}
      <section class="card">${items.map(item => `<button class="notification-row ${item.readAt ? "" : "unread"}" data-action="open-notification" data-id="${item.id}" style="width:100%;border-top:0;border-left:0;border-right:0;text-align:left"><div class="notification-icon">${icon(item.type === "URGENT_EVENT" ? "warning" : item.type === "BUDGET_AVAILABLE" ? "euro" : item.type === "NEW_REQUEST" ? "plus" : "bell")}</div><div><div class="notification-title">${escapeHtml(item.title)}</div><div class="notification-body">${escapeHtml(item.body)}</div></div><div class="notification-time">${relativeTime(item.createdAt)}</div></button>`).join("") || `<div class="empty-state"><h3>No tienes notificaciones</h3></div>`}</section>`;
  }

  function renderStatistics() {
    const user = currentUser();
    if (!isOps(user)) return renderDashboard();
    const events = visibleEvents(user);
    const total = events.length || 1;
    const confirmed = events.filter(e => e.status === "CONFIRMED").length;
    const declined = events.filter(e => e.status === "NOT_ACCEPTED").length;
    const conversion = confirmed + declined ? Math.round(confirmed / (confirmed + declined) * 100) : 0;
    const statusRows = Object.entries(STATUS).map(([key, item]) => ({ label: item.label, value: events.filter(e => e.status === key).length })).filter(x => x.value).sort((a, b) => b.value - a.value);
    const venueRows = app.data.venues.map(v => ({ label: v.name, value: events.filter(e => e.venueId === v.id).length })).sort((a, b) => b.value - a.value);
    const maxStatus = Math.max(...statusRows.map(x => x.value), 1);
    const maxVenue = Math.max(...venueRows.map(x => x.value), 1);
    return `${pageHead("Estadísticas", "Resumen comercial y distribución de eventos por estado y finca.", `<button class="btn btn-secondary" data-action="export-csv">${icon("download", "icon-sm")}Exportar eventos</button>`)}
      <div class="stats-grid"><div class="card stat-hero"><div class="metric-label">Total de peticiones</div><strong>${events.length}</strong><div class="small muted" style="margin-top:7px">Histórico de todas las fincas</div></div><div class="card stat-hero"><div class="metric-label">Eventos confirmados</div><strong>${confirmed}</strong><div class="small muted" style="margin-top:7px">${Math.round(confirmed / total * 100)}% del total</div></div><div class="card stat-hero"><div class="metric-label">Conversión comercial</div><strong>${conversion}%</strong><div class="small muted" style="margin-top:7px">Confirmados frente a decididos</div></div></div>
      <div class="dashboard-grid">
        <section class="card"><div class="card-header"><div><div class="card-title">Eventos por estado</div><div class="card-desc">Distribución actual del flujo comercial</div></div></div><div class="card-body"><div class="bar-chart">${statusRows.map(row => `<div class="bar-row"><div class="bar-label">${escapeHtml(row.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(row.value / maxStatus * 100)}%"></div></div><div class="bar-value">${row.value}</div></div>`).join("")}</div></div></section>
        <aside class="card"><div class="card-header"><div><div class="card-title">Conversión</div><div class="card-desc">Resultados de peticiones cerradas</div></div></div><div class="card-body"><div class="donut-wrap"><div class="donut" style="--value:${conversion}%"><div class="donut-center"><strong>${conversion}%</strong><span>Conversión</span></div></div><div class="stack"><div><strong>${confirmed}</strong><div class="tiny muted">Confirmados</div></div><div><strong>${declined}</strong><div class="tiny muted">No aceptados</div></div></div></div></div></aside>
      </div>
      <section class="card" style="margin-top:18px"><div class="card-header"><div><div class="card-title">Eventos por finca</div><div class="card-desc">Volumen de peticiones por espacio</div></div></div><div class="card-body"><div class="bar-chart">${venueRows.map(row => `<div class="bar-row"><div class="bar-label">${escapeHtml(row.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(row.value / maxVenue * 100)}%"></div></div><div class="bar-value">${row.value}</div></div>`).join("")}</div></div></section>`;
  }

  function renderUsers() {
    const user = currentUser();
    if (!isAdmin(user)) return renderDashboard();
    return `${pageHead("Usuarios", `${app.data.users.length} usuarios registrados.`, `<button class="btn btn-primary" data-action="new-user">${icon("plus", "icon-sm")}Nuevo usuario</button>`)}
      <section class="card"><div class="table-wrap"><table class="data-table" style="min-width:850px"><thead><tr><th>Usuario</th><th>Email</th><th>Rol</th><th>Finca</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>${app.data.users.map(item => `<tr><td><div class="row"><div class="avatar" style="background:#eceef1;color:#333">${initials(item)}</div><div><strong>${escapeHtml(item.firstName)} ${escapeHtml(item.lastName)}</strong><div class="table-sub">ID ${escapeHtml(item.id)}</div></div></div></td><td>${escapeHtml(item.email)}</td><td><span class="user-role">${escapeHtml(ROLE_LABEL[item.role])}</span></td><td>${escapeHtml(item.venueId ? venueById(item.venueId)?.name || "—" : "Todas")}</td><td>${item.active ? `<span class="badge badge-confirmed">Activo</span>` : `<span class="badge badge-cancelled">Inactivo</span>`}</td><td><div class="table-actions"><button class="btn btn-secondary btn-sm" data-action="edit-user" data-id="${item.id}">${icon("edit", "icon-sm")}Editar</button>${item.id !== user.id ? `<button class="btn ${item.active ? "btn-danger" : "btn-secondary"} btn-sm" data-action="toggle-user" data-id="${item.id}">${item.active ? "Desactivar" : "Activar"}</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div></section>`;
  }

  function renderSettings() {
    const user = currentUser();
    if (!isAdmin(user)) return renderDashboard();
    const s = app.data.settings;
    return `${pageHead("Configuración", "Preferencias generales del flujo y preparación de integraciones futuras.")}
      <div class="dashboard-grid">
        <section class="card"><div class="card-header"><div><div class="card-title">Visibilidad y alertas</div><div class="card-desc">Ajustes operativos de la plataforma</div></div></div><div class="card-body"><form id="settings-form" class="stack"><label class="check-row"><input type="checkbox" name="showCommercialToVenue" ${s.showCommercialToVenue ? "checked" : ""}> Mostrar a la finca el comercial responsable</label><label class="check-row"><input type="checkbox" name="emailNotifications" ${s.emailNotifications ? "checked" : ""}> Activar avisos por email cuando se configure SMTP</label><label class="check-row"><input type="checkbox" name="whatsappPrepared" ${s.whatsappPrepared ? "checked" : ""}> Mantener preparada la integración de WhatsApp Business</label><div class="form-grid" style="margin-top:8px"><div><label class="label">Días sin actualización para alerta</label><input class="field" type="number" name="staleDays" min="1" max="30" value="${s.staleDays}"></div><div><label class="label">Días de espera tras presupuesto</label><input class="field" type="number" name="budgetResponseDays" min="1" max="30" value="${s.budgetResponseDays}"></div></div><div><button class="btn btn-primary" type="submit">Guardar configuración</button></div></form></div></section>
        <aside class="stack"><div class="card card-pad" style="background:#111419;color:#fff;border-color:#111419"><img src="${LOGO_WHITE}" alt="Marquee" style="width:190px"><p class="small" style="color:rgba(255,255,255,.5);line-height:1.65;margin:17px 0 0">Identidad corporativa aplicada en login, navegación, iconos de aplicación y documentos de prueba.</p></div><div class="card card-pad"><div class="row">${icon("refresh")}<strong style="font-size:13px">Reiniciar demo</strong></div><p class="small muted" style="line-height:1.6">Elimina cambios locales y recupera fincas, usuarios, eventos y presupuestos iniciales.</p><button class="btn btn-danger" data-action="reset-demo">Reiniciar todos los datos</button></div><div class="card card-pad"><div class="row">${icon("lock")}<strong style="font-size:13px">Arquitectura de producción</strong></div><p class="small muted" style="line-height:1.6">La versión full-stack incluida utiliza PostgreSQL, permisos RBAC en backend y almacenamiento S3/R2.</p></div></aside>
      </div>`;
  }

  function renderOverlay() {
    const root = document.getElementById("overlay-root");
    if (!root) return;
    const event = eventById(app.selectedEventId);
    const user = currentUser();
    if (!event || !canAccessEvent(event, user)) {
      app.selectedEventId = null;
      root.innerHTML = "";
      return;
    }
    const venue = venueById(event.venueId);
    const tabs = [
      ["summary", "Resumen"], ["audiovisual", "Petición audiovisual"], ["budgets", `Presupuestos (${visibleBudgets(event, user).length})`],
      ["documents", `Documentos (${visibleDocuments(event, user).length})`], ["comments", `Comentarios (${event.comments.length})`]
    ];
    if (isOps(user)) tabs.push(["notes", `Notas internas (${event.internalNotes.length})`]);
    tabs.push(["history", "Histórico"]);
    if (!tabs.some(([key]) => key === app.selectedEventTab)) app.selectedEventTab = "summary";
    root.innerHTML = `<div class="overlay" data-action="close-event"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Ficha del evento" data-drawer-stop>
      <div class="drawer-head"><div class="drawer-top"><div style="min-width:0;flex:1"><h2 class="drawer-title">${escapeHtml(event.eventName)}</h2><div class="drawer-sub">${escapeHtml(venue?.name || "")} · ${formatDateLong(event.eventDate)} · ${escapeHtml(eventTime(event))}</div><div class="drawer-badges">${statusBadge(event.status)}${priorityBadge(event.priority)}${eventIncompleteFields(event).length ? `<span class="badge badge-info">${eventIncompleteFields(event).length} dato${eventIncompleteFields(event).length === 1 ? "" : "s"} pendiente${eventIncompleteFields(event).length === 1 ? "" : "s"}</span>` : ""}</div></div><button class="close-btn" data-action="close-event" aria-label="Cerrar">${icon("close")}</button></div><div class="tabs">${tabs.map(([key, label]) => `<button class="tab-btn ${app.selectedEventTab === key ? "active" : ""}" data-action="event-tab" data-tab="${key}">${escapeHtml(label)}</button>`).join("")}</div></div>
      <div class="drawer-body">${renderEventTab(event, user)}</div>
    </aside></div>`;
  }

  function renderEventTab(event, user) {
    switch (app.selectedEventTab) {
      case "audiovisual": return renderEventAudiovisual(event);
      case "budgets": return renderEventBudgets(event, user);
      case "documents": return renderEventDocuments(event, user);
      case "comments": return renderEventComments(event);
      case "notes": return isOps(user) ? renderEventNotes(event) : renderEventSummary(event, user);
      case "history": return renderEventHistory(event, user);
      default: return renderEventSummary(event, user);
    }
  }

  function renderEventSummary(event, user) {
    const venue = venueById(event.venueId);
    const commercial = userById(event.assignedCommercialId);
    const incomplete = eventIncompleteFields(event);
    const ops = isOps(user);
    return `<section class="drawer-section"><div class="section-head"><div class="section-title">Control del evento</div>${ops || ACTIVE_STATUSES.includes(event.status) ? `<button class="btn btn-secondary btn-sm" data-action="edit-event" data-id="${event.id}">${icon("edit", "icon-sm")}Editar datos</button>` : ""}</div><div class="section-body">${ops ? `<div class="inline-controls"><div><label class="label">Estado</label><select class="select" data-action-change="event-status" data-id="${event.id}">${optionList(STATUS, event.status)}</select></div><div><label class="label">Prioridad</label><select class="select" data-action-change="event-priority" data-id="${event.id}">${optionList(PRIORITY, event.priority)}</select></div></div>` : `<div class="row-wrap">${statusBadge(event.status)}${priorityBadge(event.priority)}</div>`}</div></section>
      <section class="drawer-section"><div class="section-head"><div class="section-title">Datos principales</div></div><div class="section-body"><div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Finca</div><div class="detail-value">${escapeHtml(venue?.name || "—")}</div></div>
        <div class="detail-item"><div class="detail-label">Empresa / cliente</div><div class="detail-value">${escapeHtml(event.finalClient || "Pendiente")}</div></div>
        <div class="detail-item"><div class="detail-label">Fecha y horario</div><div class="detail-value">${formatDate(event.eventDate)}<br>${escapeHtml(eventTime(event))}</div></div>
        <div class="detail-item"><div class="detail-label">Número de personas</div><div class="detail-value">${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Pendiente"}</div></div>
        <div class="detail-item"><div class="detail-label">Agencia</div><div class="detail-value">${escapeHtml(event.agency || "Sin agencia")}</div></div>
        <div class="detail-item"><div class="detail-label">Comercial asignado</div><div class="detail-value">${escapeHtml(commercial && (isOps(user) || app.data.settings.showCommercialToVenue) ? `${commercial.firstName} ${commercial.lastName}` : "Equipo Marquee")}</div></div>
        <div class="detail-item"><div class="detail-label">Contacto</div><div class="detail-value">${escapeHtml([event.contactFirstName, event.contactLastName].filter(Boolean).join(" ") || "Pendiente")}</div></div>
        <div class="detail-item"><div class="detail-label">Email / teléfono</div><div class="detail-value">${escapeHtml(event.email || "—")}<br>${escapeHtml(event.phone || "—")}</div></div>
        <div class="detail-item full"><div class="detail-label">Observaciones</div><div class="detail-value">${escapeHtml(event.observations || "Sin observaciones")}</div></div>
      </div></div></section>
      ${incomplete.length ? `<section class="drawer-section"><div class="section-head"><div class="section-title">Información pendiente</div></div><div class="section-body"><div class="incomplete-list">${incomplete.map(item => `<span class="incomplete-chip">${escapeHtml(item)}</span>`).join("")}</div></div></section>` : ""}
      <section class="drawer-section"><div class="section-head"><div class="section-title">Accesos rápidos</div></div><div class="section-body"><div class="row-wrap"><button class="btn btn-secondary" data-action="event-tab" data-tab="budgets">${icon("euro", "icon-sm")}Ver presupuestos</button><button class="btn btn-secondary" data-action="event-tab" data-tab="documents">${icon("file", "icon-sm")}Documentos</button><button class="btn btn-secondary" data-action="event-tab" data-tab="comments">${icon("message", "icon-sm")}Comentarios</button>${ops ? `<button class="btn btn-secondary" data-action="duplicate-event" data-id="${event.id}">${icon("copy", "icon-sm")}Duplicar</button>` : ""}${isAdmin(user) ? `<button class="btn btn-danger" data-action="delete-event" data-id="${event.id}">${icon("trash", "icon-sm")}Eliminar</button>` : ""}</div></div></section>`;
  }

  function renderEventAudiovisual(event) {
    return `<section class="drawer-section"><div class="section-head"><div><div class="section-title">Petición de audiovisuales</div><div class="card-desc">Información facilitada por la finca o cliente.</div></div><button class="btn btn-secondary btn-sm" data-action="edit-event" data-id="${event.id}">${icon("edit", "icon-sm")}Editar</button></div><div class="section-body"><div class="detail-item full"><div class="detail-label">¿Qué requieren?</div><div class="detail-value" style="white-space:pre-wrap;font-size:13px">${escapeHtml(event.audiovisualRequest || "Información pendiente")}</div></div><div class="detail-item full" style="margin-top:10px"><div class="detail-label">Necesidades técnicas</div><div class="detail-value" style="white-space:pre-wrap">${escapeHtml(event.technicalRequirements || "Sin necesidades técnicas indicadas")}</div></div></div></section>`;
  }

  function renderEventBudgets(event, user) {
    const budgets = visibleBudgets(event, user).sort((a, b) => b.version - a.version);
    return `${isOps(user) ? `<section class="drawer-section"><div class="section-head"><div><div class="section-title">Añadir presupuesto</div><div class="card-desc">Cada archivo crea una nueva versión y no sobrescribe las anteriores.</div></div></div><div class="section-body"><form id="budget-upload-form" class="form-grid"><input type="hidden" name="eventId" value="${event.id}"><div class="full"><label class="drop-zone" id="budget-drop-zone" for="budget-file">${icon("upload", "icon-lg")}<br><strong>Arrastra un archivo o pulsa para seleccionarlo</strong><p>PDF, DOCX, XLSX, JPG o PNG · máximo 20 MB</p><input id="budget-file" type="file" name="file" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png" hidden required></label><div id="budget-file-name" class="help"></div></div><div><label class="label">Nombre de versión</label><input class="field" name="displayName" placeholder="Ej. Presupuesto V3"></div><div><label class="label">Estado</label><select class="select" name="status"><option value="DRAFT">Borrador interno</option><option value="SENT" selected>Enviado a la finca</option><option value="FINAL">Final</option></select></div><div class="full"><label class="label">Descripción</label><input class="field" name="description" placeholder="Cambios incluidos en esta versión"></div><div class="full"><button class="btn btn-primary" type="submit">${icon("upload", "icon-sm")}Añadir presupuesto</button></div></form></div></section>` : ""}
      <section class="drawer-section"><div class="section-head"><div><div class="section-title">Versiones disponibles</div><div class="card-desc">${budgets.length} presupuesto${budgets.length === 1 ? "" : "s"} asociado${budgets.length === 1 ? "" : "s"} al evento.</div></div></div><div class="section-body">${budgets.map(b => {
        const uploader = userById(b.uploadedById);
        return `<div class="file-row"><div class="file-icon">${icon("file")}</div><div class="file-row-main"><div class="row-wrap"><div class="file-row-title">${escapeHtml(b.displayName)}</div>${budgetBadge(b.status)}<span class="badge badge-neutral">V${b.version}</span></div><div class="file-row-meta">${escapeHtml(b.originalName)} · ${Math.ceil(b.sizeBytes / 1024)} KB · ${escapeHtml(uploader ? `${uploader.firstName} ${uploader.lastName}` : "Sistema")} · ${formatDateTime(b.createdAt)}</div>${b.description ? `<div class="small muted" style="margin-top:6px">${escapeHtml(b.description)}</div>` : ""}</div><div class="row-wrap"><button class="btn btn-secondary btn-icon btn-sm" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${b.id}" title="Descargar">${icon("download", "icon-sm")}</button>${isAdmin(user) ? `<button class="btn btn-danger btn-icon btn-sm" data-action="archive-budget" data-event-id="${event.id}" data-budget-id="${b.id}" title="Archivar">${icon("archive", "icon-sm")}</button>` : ""}</div></div>`;
      }).join("") || `<div class="empty-state" style="padding:32px"><div class="empty-icon">${icon("euro", "icon-lg")}</div><h3>Todavía no hay presupuestos</h3><p>Cuando el equipo comercial añada una versión, aparecerá aquí y en el calendario.</p></div>`}</div></section>`;
  }

  function renderEventDocuments(event, user) {
    const documents = visibleDocuments(event, user).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return `${isOps(user) ? `<section class="drawer-section"><div class="section-head"><div><div class="section-title">Añadir documento</div><div class="card-desc">Documentación técnica compartida o solo interna.</div></div></div><div class="section-body"><form id="document-upload-form" class="form-grid"><input type="hidden" name="eventId" value="${event.id}"><div class="full"><label class="drop-zone" id="document-drop-zone" for="document-file">${icon("upload", "icon-lg")}<br><strong>Arrastra un documento o pulsa para seleccionarlo</strong><p>PDF, DOCX, XLSX, JPG o PNG</p><input id="document-file" type="file" name="file" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png" hidden required></label><div id="document-file-name" class="help"></div></div><div><label class="label">Nombre</label><input class="field" name="displayName" placeholder="Ej. Plano de implantación"></div><div><label class="label">Visibilidad</label><select class="select" name="visibility"><option value="SHARED">Compartido con la finca</option><option value="INTERNAL">Solo interno</option></select></div><div class="full"><label class="label">Descripción</label><input class="field" name="description"></div><div class="full"><button class="btn btn-primary" type="submit">${icon("upload", "icon-sm")}Añadir documento</button></div></form></div></section>` : ""}
      <section class="drawer-section"><div class="section-head"><div class="section-title">Documentación del evento</div></div><div class="section-body">${documents.map(d => {
        const uploader = userById(d.uploadedById);
        return `<div class="file-row"><div class="file-icon">${icon("file")}</div><div class="file-row-main"><div class="row-wrap"><div class="file-row-title">${escapeHtml(d.displayName)}</div>${d.visibility === "INTERNAL" ? `<span class="badge badge-info">Solo interno</span>` : `<span class="badge badge-confirmed">Compartido</span>`}</div><div class="file-row-meta">${escapeHtml(d.originalName)} · ${escapeHtml(uploader ? `${uploader.firstName} ${uploader.lastName}` : "Sistema")} · ${formatDateTime(d.createdAt)}</div>${d.description ? `<div class="small muted" style="margin-top:6px">${escapeHtml(d.description)}</div>` : ""}</div><button class="btn btn-secondary btn-icon btn-sm" data-action="download-document" data-event-id="${event.id}" data-document-id="${d.id}">${icon("download", "icon-sm")}</button></div>`;
      }).join("") || `<div class="empty-state" style="padding:32px"><h3>Sin documentos</h3><p>No hay documentación disponible para este evento.</p></div>`}</div></section>`;
  }

  function renderEventComments(event) {
    return `<section class="drawer-section"><div class="section-head"><div><div class="section-title">Comentarios compartidos</div><div class="card-desc">Visibles para administrador, comercial y finca.</div></div></div><div class="section-body"><form id="comment-form"><input type="hidden" name="eventId" value="${event.id}"><textarea class="textarea" name="body" required maxlength="5000" placeholder="Añadir información o comentario..."></textarea><button class="btn btn-primary" type="submit" style="margin-top:9px">${icon("message", "icon-sm")}Publicar comentario</button></form><div style="margin-top:18px">${[...event.comments].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(c => {
      const author = userById(c.authorId);
      return `<article class="comment"><div class="comment-head"><span class="comment-author">${escapeHtml(author ? `${author.firstName} ${author.lastName}` : "Sistema")}</span><span class="comment-time">${formatDateTime(c.createdAt)}</span></div><div class="comment-body">${escapeHtml(c.body)}</div></article>`;
    }).join("") || `<div class="small muted">Todavía no hay comentarios.</div>`}</div></div></section>`;
  }

  function renderEventNotes(event) {
    return `<section class="drawer-section"><div class="section-head"><div><div class="section-title">Notas internas</div><div class="card-desc">Nunca se muestran a los usuarios finca.</div></div></div><div class="section-body"><form id="note-form"><input type="hidden" name="eventId" value="${event.id}"><textarea class="textarea" name="body" required maxlength="5000" placeholder="Seguimiento comercial interno..."></textarea><button class="btn btn-primary" type="submit" style="margin-top:9px">${icon("note", "icon-sm")}Añadir nota interna</button></form><div style="margin-top:18px">${[...event.internalNotes].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(n => {
      const author = userById(n.authorId);
      return `<article class="comment internal"><div class="comment-head"><span class="comment-author">${escapeHtml(author ? `${author.firstName} ${author.lastName}` : "Sistema")}</span><span class="comment-time">${formatDateTime(n.createdAt)}</span></div><div class="comment-body">${escapeHtml(n.body)}</div></article>`;
    }).join("") || `<div class="small muted">Sin notas internas.</div>`}</div></div></section>`;
  }

  function renderEventHistory(event, user) {
    const items = [...event.history].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return `<section class="drawer-section"><div class="section-head"><div><div class="section-title">Histórico del evento</div><div class="card-desc">Trazabilidad automática de cambios y documentos.</div></div></div><div class="section-body"><div class="timeline">${items.map(h => {
      const actor = userById(h.actorId);
      return `<div class="timeline-item"><div class="timeline-title">${escapeHtml(h.summary)}</div><div class="timeline-meta">${escapeHtml(actor ? `${actor.firstName} ${actor.lastName}` : "Sistema")} · ${formatDateTime(h.createdAt)}</div></div>`;
    }).join("") || `<div class="small muted">Sin histórico.</div>`}</div></div></section>${isOps(user) ? `<section class="drawer-section"><div class="section-head"><div class="section-title">Auditoría técnica</div></div><div class="section-body"><div class="small muted">ID evento: <span class="mono">${escapeHtml(event.id)}</span><br>Creado: ${formatDateTime(event.createdAt)}<br>Última actualización: ${formatDateTime(event.updatedAt)}</div></div></section>` : ""}`;
  }

  function modalFrame(title, subtitle, body, footer = "", wide = false) {
    return `<div class="modal-layer" data-action="close-modal"><section class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" data-modal-stop><div class="modal-head"><div><div class="modal-title">${escapeHtml(title)}</div>${subtitle ? `<div class="modal-sub">${escapeHtml(subtitle)}</div>` : ""}</div><span class="spacer"></span><button class="close-btn" data-action="close-modal">${icon("close")}</button></div><div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ""}</section></div>`;
  }

  function renderModal() {
    const root = document.getElementById("modal-root");
    if (!root) return;
    const modal = app.modal;
    if (!modal) { root.innerHTML = ""; return; }
    if (modal.type === "duplicateWarning") {
      const candidate = modal.candidate;
      const venue = venueById(candidate.venueId);
      root.innerHTML = modalFrame("Posible petición duplicada", "La creación no está bloqueada, pero conviene revisar la coincidencia.", `<div class="possible-duplicate">Ya existe <strong>${escapeHtml(candidate.eventName)}</strong> para <strong>${escapeHtml(venue?.name || "esta finca")}</strong> el ${formatDate(candidate.eventDate)} y el mismo cliente.</div><div class="detail-grid"><div class="detail-item"><div class="detail-label">Evento existente</div><div class="detail-value">${escapeHtml(candidate.eventName)}</div></div><div class="detail-item"><div class="detail-label">Cliente</div><div class="detail-value">${escapeHtml(candidate.finalClient || "—")}</div></div><div class="detail-item"><div class="detail-label">Fecha</div><div class="detail-value">${formatDate(candidate.eventDate)}</div></div><div class="detail-item"><div class="detail-label">Estado</div><div class="detail-value">${statusBadge(candidate.status)}</div></div></div>`, `<button class="btn btn-secondary" data-action="open-existing-duplicate" data-id="${candidate.id}">Abrir existente</button><button class="btn btn-primary" data-action="confirm-create-event">Crear de todas formas</button>`);
      return;
    }
    if (modal.type === "editEvent") {
      const event = eventById(modal.id);
      if (!event || !canAccessEvent(event)) { app.modal = null; root.innerHTML = ""; return; }
      const user = currentUser();
      const ops = isOps(user);
      const venueField = ops ? `<select class="select" name="venueId" required>${app.data.venues.filter(v => v.state === "ACTIVE").map(v => `<option value="${v.id}" ${event.venueId === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select>` : `<input type="hidden" name="venueId" value="${event.venueId}"><input class="field" value="${escapeHtml(venueById(event.venueId)?.name || "")}" disabled>`;

tDate)}</strong><span class="small">${escapeHtml(e.eventName)}</span><span class="spacer"></span>${statusBadge(e.status)}</button>`).join("") || `<div class="small muted">Sin próximos eventos.</div>`}`, `<button class="btn btn-secondary" data-action="filter-by-venue" data-id="${venue.id}">Ver eventos</button>${isAdmin() ? `<button class="btn btn-primary" data-action="edit-venue" data-id="${venue.id}">Editar finca</button>` : ""}`, true);

      return;

    if (modal.type === "confirmReset") {
      root.innerHTML = modalFrame("Reiniciar versión de prueba", "Esta acción elimina los cambios guardados en este navegador.", `<div class="possible-duplicate" style="background:#fff0f0;border-color:#efb6b6;color:#8b1e1e">Se restaurarán los usuarios, fincas, eventos, presupuestos, comentarios y notificaciones de demostración.</div>`, `<button class="btn btn-secondary" data-action="close-modal">Cancelar</button><button class="btn btn-danger" data-action="confirm-reset-demo">Sí, reiniciar demo</button>`);
