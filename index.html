  function formObject(form) {
    const fd = new FormData(form);
    return Object.fromEntries(fd.entries());
  }

  function numberOrNull(value) {
    const n = Number(value);
    return value === "" || !Number.isFinite(n) ? null : n;
  }

  function findPossibleDuplicate(data, excludeId = null) {
    const client = String(data.finalClient || "").trim().toLowerCase();
    if (!client) return null;
    return app.data.events.find(event => !event.deletedAt && event.id !== excludeId && event.venueId === data.venueId && event.eventDate === data.eventDate && String(event.finalClient || "").trim().toLowerCase() === client) || null;
  }

  function createEvent(data) {
    const user = currentUser();
    if (!user) return;
    const event = {
      id: uid("event"),
      venueId: data.venueId,
      eventName: String(data.eventName || "").trim(),
      eventDate: data.eventDate,
      estimatedStartTime: data.estimatedStartTime || "",
      estimatedEndTime: data.estimatedEndTime || "",
      contactFirstName: String(data.contactFirstName || "").trim(),
      contactLastName: String(data.contactLastName || "").trim(),
      agency: String(data.agency || "").trim(),
      finalClient: String(data.finalClient || "").trim(),
      email: String(data.email || "").trim(),
      phone: String(data.phone || "").trim(),
      numberOfPeople: numberOrNull(data.numberOfPeople),
      audiovisualRequest: String(data.audiovisualRequest || "").trim(),
      technicalRequirements: String(data.technicalRequirements || "").trim(),
      observations: String(data.observations || "").trim(),
      priority: data.priority || "NORMAL",
      status: "NEW_REQUEST",
      createdById: user.id,
      assignedCommercialId: isOps(user) ? (data.assignedCommercialId || app.data.users.find(u => u.role === "COMMERCIAL" && u.active)?.id || null) : (app.data.users.find(u => u.role === "COMMERCIAL" && u.active)?.id || null),
      createdAt: nowIso(),
      updatedAt: nowIso(),
      deletedAt: null,
      budgets: [], documents: [], comments: [], internalNotes: [], history: []
    };
    const incomplete = eventIncompleteFields(event);
    if (incomplete.length >= 4) event.status = "INFORMATION_PENDING";
    event.history.push(makeHistory(user.id, `${user.firstName} ${user.lastName} creó la petición`, "CREATED"));
    if (incomplete.length) event.history.push(makeHistory(user.id, `Petición guardada con ${incomplete.length} dato${incomplete.length === 1 ? "" : "s"} pendiente${incomplete.length === 1 ? "" : "s"}`, "INFORMATION_PENDING"));
    app.data.events.unshift(event);
    notifyOps(event, "NEW_REQUEST", "Nueva petición recibida", `${venueById(event.venueId)?.name || "Una finca"} ha creado ${event.eventName}.`, user.id);
    if (isOps(user)) notifyVenue(event, "NEW_REQUEST", "Nueva petición registrada", `${event.eventName} ya está disponible en el calendario.`, user.id);
    addAudit("CREATE", "EVENT", event.id, { venueId: event.venueId });
    saveData();
    app.modal = null;
    app.page = "events";
    app.selectedEventId = event.id;
    app.selectedEventTab = "summary";
    history.replaceState(null, "", "#events");
    renderShell();
    toast("Petición creada", "El evento ya aparece en el calendario de la finca.", "success");
  }

  function updateEventFromForm(data) {
    const user = currentUser();
    const event = eventById(data.eventId);
    if (!event || !canAccessEvent(event, user)) return toast("Acceso denegado", "No puedes modificar este evento.", "error");
    if (user.role === "VENUE_USER" && !ACTIVE_STATUSES.includes(event.status)) return toast("Evento cerrado", "La finca ya no puede editar esta petición.", "error");
    const before = { ...event };
    const fields = ["venueId", "eventName", "eventDate", "estimatedStartTime", "estimatedEndTime", "contactFirstName", "contactLastName", "agency", "finalClient", "email", "phone", "audiovisualRequest", "technicalRequirements", "observations"];
    for (const field of fields) {
      if (field in data) event[field] = String(data[field] || "").trim();
    }
    if ("numberOfPeople" in data) event.numberOfPeople = numberOrNull(data.numberOfPeople);
    if (isOps(user) && "assignedCommercialId" in data) event.assignedCommercialId = data.assignedCommercialId || null;
    const changed = fields.filter(field => String(before[field] ?? "") !== String(event[field] ?? ""));
    if (before.numberOfPeople !== event.numberOfPeople) changed.push("numberOfPeople");
    if (before.assignedCommercialId !== event.assignedCommercialId) changed.push("assignedCommercialId");
    if (before.eventDate !== event.eventDate) event.history.unshift(makeHistory(user.id, `Fecha cambiada de ${formatDate(before.eventDate)} a ${formatDate(event.eventDate)}`, "DATE_CHANGED", { fromValue: before.eventDate, toValue: event.eventDate }));
    if (before.venueId !== event.venueId) event.history.unshift(makeHistory(user.id, `Finca cambiada de ${venueById(before.venueId)?.name || "—"} a ${venueById(event.venueId)?.name || "—"}`, "VENUE_CHANGED"));
    if (changed.length) event.history.unshift(makeHistory(user.id, `Se actualizaron los datos del evento (${changed.length} campos)`, "UPDATED", { fields: changed }));
    const incomplete = eventIncompleteFields(event);
    if (event.status === "INFORMATION_PENDING" && incomplete.length === 0) {
      event.status = "PENDING_REVIEW";
      event.history.unshift(makeHistory(user.id, "Información completada; el evento pasa a pendiente de revisión", "STATUS_CHANGED"));
    }
    event.updatedAt = nowIso();
    notifyOps(event, "EVENT_UPDATED", "Evento modificado", `${event.eventName} ha sido actualizado.`, user.id);
    if (isOps(user)) notifyVenue(event, "EVENT_UPDATED", "Evento actualizado", `Se han actualizado los datos de ${event.eventName}.`, user.id);
    addAudit("UPDATE", "EVENT", event.id, { fields: changed });
    saveData();
    app.modal = null;
    renderShell();
    toast("Cambios guardados", "El histórico del evento se ha actualizado.", "success");
  }

  function changeEventStatus(eventId, status) {
    const user = currentUser();
    const event = eventById(eventId);
    if (!event || !isOps(user) || !STATUS[status]) return toast("Acción no autorizada", "Solo administrador y comercial pueden cambiar el estado.", "error");
    const previous = event.status;
    if (previous === status) return;
    event.status = status;
    event.updatedAt = nowIso();
    event.history.unshift(makeHistory(user.id, `Estado cambiado de ${STATUS[previous].label} a ${STATUS[status].label}`, "STATUS_CHANGED", { fromValue: previous, toValue: status }));
    notifyVenue(event, "STATUS_CHANGED", "Estado actualizado", `${event.eventName}: ${STATUS[status].label}.`, user.id);
    addAudit("STATUS_CHANGED", "EVENT", event.id, { from: previous, to: status });
    saveData();
    renderShell();
    toast("Estado actualizado", STATUS[status].label, "success");
  }

  function changeEventPriority(eventId, priority) {
    const user = currentUser();
    const event = eventById(eventId);
    if (!event || !isOps(user) || !PRIORITY[priority]) return toast("Acción no autorizada", "Solo administrador y comercial pueden cambiar la prioridad.", "error");
    const previous = event.priority;
    if (previous === priority) return;
    event.priority = priority;
    event.updatedAt = nowIso();
    event.history.unshift(makeHistory(user.id, `Prioridad cambiada de ${PRIORITY[previous].label} a ${PRIORITY[priority].label}`, "PRIORITY_CHANGED", { fromValue: previous, toValue: priority }));
    if (["URGENT", "VERY_URGENT"].includes(priority)) notifyOps(event, "URGENT_EVENT", "Evento urgente", `${event.eventName} tiene prioridad ${PRIORITY[priority].label}.`, user.id);
    addAudit("PRIORITY_CHANGED", "EVENT", event.id, { from: previous, to: priority });
    saveData();
    renderShell();
    toast("Prioridad actualizada", PRIORITY[priority].label, "success");
  }

  async function uploadBudget(form) {
    const user = currentUser();
    const data = formObject(form);
    const event = eventById(data.eventId);
    const file = form.querySelector('input[type="file"]')?.files?.[0];
    if (!event || !isOps(user)) return toast("Acción no autorizada", "La finca no puede añadir presupuestos.", "error");
    if (!file) return toast("Selecciona un archivo", "Debes elegir un presupuesto antes de continuar.", "error");
    if (file.size > 20 * 1024 * 1024) return toast("Archivo demasiado grande", "El máximo de la demo es 20 MB.", "error");
    const allowed = ["pdf", "docx", "xlsx", "jpg", "jpeg", "png"];
    const ext = file.name.split(".").pop()?.toLowerCase();
    if (!allowed.includes(ext)) return toast("Formato no permitido", "Usa PDF, DOCX, XLSX, JPG o PNG.", "error");
    const version = Math.max(0, ...event.budgets.map(b => b.version)) + 1;
    const budget = { id: uid("budget"), version, displayName: String(data.displayName || "").trim() || `Presupuesto V${version}`, originalName: file.name, description: String(data.description || "").trim(), status: data.status || "SENT", uploadedById: user.id, sizeBytes: file.size, mimeType: file.type || "application/octet-stream", createdAt: nowIso(), fileKey: uid("file") };
    try { await saveFileBlob(budget.fileKey, file); } catch { return toast("No se pudo guardar el archivo", "El navegador ha bloqueado el almacenamiento local.", "error"); }
    event.budgets.push(budget);
    event.updatedAt = nowIso();
    event.history.unshift(makeHistory(user.id, `Se añadió ${budget.displayName} (V${version})`, "BUDGET_ADDED", { budgetId: budget.id, status: budget.status }));
    if (["SENT", "FINAL"].includes(budget.status)) notifyVenue(event, "BUDGET_AVAILABLE", "Nuevo presupuesto disponible", `${budget.displayName} ya puede descargarse.`, user.id);
    addAudit("UPLOAD", "EVENT_BUDGET", budget.id, { eventId: event.id, version });
    saveData();
    renderShell();
    toast("Presupuesto añadido", `${budget.displayName} está asociado al evento y al calendario.`, "success");
  }

  async function uploadDocument(form) {
    const user = currentUser();
    const data = formObject(form);
    const event = eventById(data.eventId);
    const file = form.querySelector('input[type="file"]')?.files?.[0];
    if (!event || !isOps(user)) return toast("Acción no autorizada", "Solo el equipo interno puede añadir documentos.", "error");
    if (!file) return toast("Selecciona un archivo", "Debes elegir un documento.", "error");
    if (file.size > 20 * 1024 * 1024) return toast("Archivo demasiado grande", "El máximo de la demo es 20 MB.", "error");
    const allowed = ["pdf", "docx", "xlsx", "jpg", "jpeg", "png"];
    const ext = file.name.split(".").pop()?.toLowerCase();
    if (!allowed.includes(ext)) return toast("Formato no permitido", "Usa PDF, DOCX, XLSX, JPG o PNG.", "error");
    const documentItem = { id: uid("document"), displayName: String(data.displayName || "").trim() || file.name.replace(/\.[^.]+$/, ""), originalName: file.name, description: String(data.description || "").trim(), visibility: data.visibility || "SHARED", uploadedById: user.id, sizeBytes: file.size, mimeType: file.type || "application/octet-stream", createdAt: nowIso(), fileKey: uid("file") };
    try { await saveFileBlob(documentItem.fileKey, file); } catch { return toast("No se pudo guardar el archivo", "El navegador ha bloqueado el almacenamiento local.", "error"); }
    event.documents.push(documentItem);
    event.updatedAt = nowIso();
    event.history.unshift(makeHistory(user.id, `Se añadió el documento ${documentItem.displayName}`, "DOCUMENT_ADDED", { documentId: documentItem.id, visibility: documentItem.visibility }));
    if (documentItem.visibility === "SHARED") notifyVenue(event, "EVENT_UPDATED", "Nuevo documento disponible", `${documentItem.displayName} se ha añadido al evento.`, user.id);
    addAudit("UPLOAD", "EVENT_DOCUMENT", documentItem.id, { eventId: event.id });
    saveData();
    renderShell();
    toast("Documento añadido", documentItem.displayName, "success");
  }

  async function downloadStoredFile(item, fallbackName = "archivo-demo.pdf") {
    let blob = item.fileKey ? await getFileBlob(item.fileKey) : null;
    if (!blob) {
      if ((item.mimeType || "").includes("png") || /\.png$/i.test(item.originalName || "")) {
        const png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";
        blob = base64ToBlob(png, "image/png");
      } else if (DEMO_PDF_BASE64) blob = base64ToBlob(DEMO_PDF_BASE64, "application/pdf");
      else blob = new Blob(["Documento de demostración de Marquee Audiovisuales"], { type: "text/plain;charset=utf-8" });
    }
    downloadBlob(blob, item.originalName || fallbackName);
  }

  function addComment(form) {
    const user = currentUser();
    const data = formObject(form);
    const event = eventById(data.eventId);
    const body = String(data.body || "").trim();
    if (!event || !canAccessEvent(event, user) || !body) return;
    event.comments.push({ id: uid("comment"), authorId: user.id, body, createdAt: nowIso() });
    event.history.unshift(makeHistory(user.id, "Se añadió un comentario compartido", "COMMENT_ADDED"));
    event.updatedAt = nowIso();

  function openFileDb() {
    return new Promise((resolve) => {
      try {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(FILE_DB, 2);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
          if (!db.objectStoreNames.contains("backups")) db.createObjectStore("backups", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch {
        resolve(null);
      }
    });
  }

  async function clearFileDb() {
    try {
      localStorage.removeItem(BACKUP_FALLBACK_KEY);
      if (window.indexedDB) {
        await new Promise(resolve => {
          const req = indexedDB.deleteDatabase(FILE_DB);
          req.onsuccess = req.onerror = req.onblocked = () => resolve();
        });
      }
      app.backupsCache = [];
    } catch {
      // La demo continúa aunque el navegador limite el almacenamiento persistente.
    }
  }

  async function idbPut(storeName, value, key) {
    const db = await openFileDb();
    if (!db || !db.objectStoreNames.contains(storeName)) return false;
    const ok = await new Promise(resolve => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      key === undefined ? store.put(value) : store.put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => resolve(false);
    });
    db.close();
    return ok;
  }

  async function idbGet(storeName, key) {
    const db = await openFileDb();
    if (!db || !db.objectStoreNames.contains(storeName)) return null;
    const value = await new Promise(resolve => {
      const tx = db.transaction(storeName, "readonly");
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
    db.close();
    return value;
  }

  async function idbGetAll(storeName) {
    const db = await openFileDb();
    if (!db || !db.objectStoreNames.contains(storeName)) return [];
    const values = await new Promise(resolve => {
      const tx = db.transaction(storeName, "readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
    db.close();
    return values;
  }

  async function idbDelete(storeName, key) {
    const db = await openFileDb();
    if (!db || !db.objectStoreNames.contains(storeName)) return false;
    const ok = await new Promise(resolve => {
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => resolve(false);
    });
    db.close();
    return ok;
  }

  function formatBytes(bytes = 0) {
    const units = ["B", "KB", "MB", "GB"];
    let value = Number(bytes) || 0;
    let index = 0;
    while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
    return `${value < 10 && index ? value.toFixed(1) : Math.round(value)} ${units[index]}`;
  }

  function daysSince(iso) {

  function completenessFor(event) {

  function actionPlanFor(event, user = currentUser()) {
    const budgets = visibleBudgets(event, user);
    const incomplete = eventIncompleteFields(event);
    const days = daysFromToday(event.eventDate);
    if (incomplete.length) return { label: "Completar información", tone: "warning", detail: `${incomplete.length} dato${incomplete.length === 1 ? "" : "s"} pendiente${incomplete.length === 1 ? "" : "s"}`, tab: "summary" };
    if (!budgets.length && ACTIVE_STATUSES.includes(event.status)) return { label: isOps(user) ? "Preparar presupuesto" : "Presupuesto en preparación", tone: "violet", detail: "Aún no existe una versión compartida", tab: "budgets" };
    if (["BUDGET_SENT", "PENDING_RESPONSE"].includes(event.status)) return { label: "Realizar seguimiento", tone: "blue", detail: `Último movimiento ${relativeTime(event.updatedAt)}`, tab: "comments" };
    if (days >= 0 && days <= 7 && event.status !== "CONFIRMED") return { label: "Confirmación prioritaria", tone: "danger", detail: `El evento es en ${days === 0 ? "hoy" : `${days} día${days === 1 ? "" : "s"}`}`, tab: "summary" };
    if (event.status === "CONFIRMED") return { label: "Preparado para producción", tone: "success", detail: "Evento confirmado", tab: "documents" };
    return { label: "Revisar expediente", tone: "neutral", detail: `Actualizado ${relativeTime(event.updatedAt)}`, tab: "summary" };
  }

  function attentionScore(event, user = currentUser()) {
    let score = 0;
    const days = daysFromToday(event.eventDate);
    if (event.priority === "VERY_URGENT") score += 180;
    if (event.priority === "URGENT") score += 125;
    if (event.priority === "HIGH") score += 55;
    if (eventIncompleteFields(event).length) score += 90;
    if (!visibleBudgets(event, user).length && ACTIVE_STATUSES.includes(event.status)) score += 75;
    if (["BUDGET_SENT", "PENDING_RESPONSE"].includes(event.status)) score += 55;
    if (days >= 0 && days <= 7 && event.status !== "CONFIRMED") score += 110 - days * 8;
    if (daysSince(event.updatedAt) >= Number(app.data.settings.staleDays || 5)) score += 35;
    if (["CONFIRMED", "COMPLETED", "NOT_ACCEPTED", "CANCELLED"].includes(event.status)) score -= 100;
    return score;
  }

  async function loadBackupCache(render = false) {

  async function createLocalBackup(reason = "manual", silent = false) {
    const snapshot = {
      id: uid("backup"),
      createdAt: nowIso(),
      reason,
      actorId: currentUser()?.id || null,
      eventCount: (app.data.events || []).filter(e => !e.deletedAt).length,
      fileCount: linkedFileCount(),
      data: deepClone(app.data)
    };
    const retention = Math.max(3, Math.min(50, Number(app.data.settings.backupRetention || 12)));
    const savedInIndexedDb = await idbPut("backups", snapshot);
    let savedInFallback = false;

    if (!savedInIndexedDb) {
      const fallback = mergeBackupLists([snapshot], loadFallbackBackups()).slice(0, retention);
      savedInFallback = saveFallbackBackups(fallback);
    }

    const savedInMemory = !savedInIndexedDb && !savedInFallback;

    const indexedBackups = savedInIndexedDb ? await idbGetAll("backups") : [];
    const merged = mergeBackupLists(indexedBackups, loadFallbackBackups(), savedInMemory ? [snapshot, ...app.backupsCache] : app.backupsCache);
    const retained = merged.slice(0, retention);

    if (savedInIndexedDb) {
      for (const old of indexedBackups.filter(item => !retained.some(keep => keep.id === item.id))) await idbDelete("backups", old.id);
    }
    saveFallbackBackups(retained.filter(item => !savedInIndexedDb || !indexedBackups.some(idbItem => idbItem.id === item.id)));
    app.backupsCache = retained;
    lastAutomaticBackupAt = Date.now();

    if (!silent) {
      const storage = savedInIndexedDb ? "indexeddb" : savedInFallback ? "localstorage" : "memory";
      addAudit("BACKUP_CREATE", "SYSTEM", snapshot.id, { reason, storage });
      try { localStorage.setItem(DATA_KEY, JSON.stringify(app.data)); } catch { /* sesión en memoria */ }
      if (storage === "memory") toast("Copia temporal creada", "El navegador limita el almacenamiento persistente. Descarga la copia completa para conservarla fuera de esta sesión.", "warning");
      else toast("Copia creada", `${snapshot.eventCount} eventos y ${snapshot.fileCount} archivos vinculados protegidos.`, "success");
      if (app.page === "backups") renderShell();
    }
    return true;
  }

  async function blobToBase64(blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let binary = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
    return btoa(binary);
  }

  async function sha256(text) {
    if (!window.crypto?.subtle) return "no-disponible";
    const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(hash)].map(value => value.toString(16).padStart(2, "0")).join("");
  }

  async function exportPortableBackup() {
    if (!isAdmin()) return toast("Acción no autorizada", "Solo el administrador puede exportar la copia completa.", "error");
    toast("Preparando copia completa", "Incluyendo base de datos y archivos adjuntos…");
    const files = [];
    for (const key of fileKeysFromData()) {
      const blob = await getFileBlob(key);
      if (blob) files.push({ key, type: blob.type || "application/octet-stream", size: blob.size, base64: await blobToBase64(blob) });
    }
    const core = { data: deepClone(app.data), files };
    const checksum = await sha256(JSON.stringify(core));
    const payload = {
      format: "marquee-corporate-events-portable-backup",
      schemaVersion: 1,
      appVersion: 7,
      exportedAt: nowIso(),
      checksumAlgorithm: "SHA-256",
      checksum,
      ...core
    };
    const filename = `marquee-backup-completo-${dateIso(new Date()).replaceAll("-", "")}.json`;
    downloadBlob(new Blob([JSON.stringify(payload)], { type: "application/json;charset=utf-8" }), filename);
    addAudit("BACKUP_EXPORT", "SYSTEM", null, { fileCount: files.length, checksum });
    try { localStorage.setItem(DATA_KEY, JSON.stringify(app.data)); } catch { /* copia disponible en memoria */ }
    toast("Copia completa descargada", `${files.length} archivo${files.length === 1 ? "" : "s"} incluido${files.length === 1 ? "" : "s"} · integridad SHA-256.`, "success");
  }

  async function importPortableBackup(file) {
    if (!isAdmin()) return toast("Acción no autorizada", "Solo el administrador puede restaurar copias.", "error");
    try {
      const payload = JSON.parse(await file.text());
      if (payload?.format !== "marquee-corporate-events-portable-backup" || !payload.data || !Array.isArray(payload.files)) throw new Error("Formato incompatible");
      const expected = await sha256(JSON.stringify({ data: payload.data, files: payload.files }));
      if (payload.checksum && payload.checksum !== "no-disponible" && expected !== payload.checksum) throw new Error("La comprobación de integridad no coincide");
      for (const item of payload.files) {
        const blob = base64ToBlob(item.base64, item.type || "application/octet-stream");
        await saveFileBlob(item.key, blob);
      }
      app.data = payload.data;
      app.data.version = 7;
      app.data.settings = { backupRetention: 12, automaticBackups: true, ...app.data.settings };
      try { localStorage.setItem(DATA_KEY, JSON.stringify(app.data)); } catch { /* sesión en memoria */ }
      await createLocalBackup("restauración de archivo", true);
      app.page = "dashboard";
      app.selectedEventId = null;
      app.proModal = null;
      renderShell();
      toast("Copia restaurada", `${app.data.events.filter(e => !e.deletedAt).length} eventos y ${payload.files.length} archivos recuperados.`, "success");
    } catch (error) {
      toast("No se pudo restaurar", error?.message || "El archivo no es una copia válida.", "error");
    }
  }

      ["notifications", "Notificaciones", "bell"],
      ["statistics", "Estadísticas", "chart"]
    ];
    if (user.role === "ADMIN") items.push(["users", "Usuarios", "users"], ["backups", "Copias de seguridad", "archive"], ["settings", "Configuración", "settings"]);
    return items;
  }

  function safePage(page, user) {
    const allowed = new Set(navItemsFor(user).map(item => item[0]));
    allowed.add("new-event");
    return allowed.has(page) ? page : "dashboard";
  }

  function renderPage() {
    switch (app.page) {
      case "dashboard": return renderDashboard();
      case "events": return renderEvents();
      case "new-event": return renderNewEvent();
      case "calendar": return renderCalendar();
      case "communications": return renderCommunications();
      case "files": return renderFiles();
      case "venues": return renderVenues();
      case "my-venue": return renderMyVenue();
      case "notifications": return renderNotifications();
      case "statistics": return renderStatistics();
      case "users": return renderUsers();
      case "backups": return renderBackups();
      case "settings": return renderSettings();
      default: return renderDashboard();
    }
  }

  function commandItems() {
    const user = currentUser();
    if (!user) return [];
    const pages = navItemsFor(user).map(([page, label, iconName]) => ({
      type: "page", page, label, meta: "Ir a sección", iconName
    }));
    const events = visibleEvents(user).map(event => ({
      type: "event",
      id: event.id,
      label: event.eventName,
      meta: `${venueById(event.venueId)?.name || ""} · ${event.finalClient || "Cliente pendiente"} · ${formatDate(event.eventDate)}`,
      iconName: "calendar",
      search: [event.eventName, event.finalClient, event.agency, event.contactFirstName, event.contactLastName, event.email, event.phone, venueById(event.venueId)?.name].filter(Boolean).join(" ")
    }));
    return [...pages, ...events];
  }

  function renderCommandPalette() {
    if (!app.commandOpen) return "";
    const query = String(app.commandQuery || "").trim().toLowerCase();
    const results = commandItems().filter(item => !query || `${item.label} ${item.meta} ${item.search || ""}`.toLowerCase().includes(query)).slice(0, 12);
    return `<div class="command-layer" data-action="close-command">
      <section class="command-panel" role="dialog" aria-modal="true" aria-label="Búsqueda rápida" data-command-stop>
        <div class="command-input-wrap">${icon("search")}<input id="command-search" autocomplete="off" placeholder="Buscar evento, finca, cliente, teléfono o sección…" value="${escapeHtml(app.commandQuery)}"><kbd>ESC</kbd></div>
        <div class="command-results">
          ${results.map((item, index) => item.type === "page"
            ? `<button class="command-result" data-action="navigate" data-page="${item.page}"><span class="command-result-icon">${icon(item.iconName)}</span><span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.meta)}</small></span>${index === 0 ? `<kbd>↵</kbd>` : icon("arrowRight", "icon-sm")}</button>`
            : `<button class="command-result" data-action="open-event" data-id="${item.id}"><span class="command-result-icon event">${icon("calendar")}</span><span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.meta)}</small></span>${icon("arrowRight", "icon-sm")}</button>`).join("") || `<div class="command-empty">${icon("search", "icon-lg")}<strong>No hay coincidencias</strong><span>Prueba con el nombre del cliente, la finca, un teléfono o una fecha.</span></div>`}
        </div>
        <div class="command-footer"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span>Búsqueda protegida por permisos</span></div>
      </section>
    </div>`;
  }

  function mobileNavFor(user) {
    const items = user.role === "VENUE_USER"
      ? [["dashboard", "Inicio", "dashboard"], ["events", "Eventos", "calendar"], ["new-event", "Nueva", "plus"], ["communications", "Mensajes", "message"], ["files", "Archivos", "file"]]
      : [["dashboard", "Inicio", "dashboard"], ["calendar", "Agenda", "calendar"], ["new-event", "Nuevo", "plus"], ["communications", "Mensajes", "message"], ["events", "Eventos", "file"]];
    return `<nav class="mobile-bottom-nav" aria-label="Navegación móvil">${items.map(([page, label, iconName]) => `<button class="mobile-nav-item ${app.page === page ? "active" : ""} ${page === "new-event" ? "create" : ""}" data-action="navigate" data-page="${page}">${icon(iconName)}<span>${label}</span></button>`).join("")}</nav>`;
  }

  function renderShell() {
    const user = currentUser();
    if (!user) return renderLogin();
    app.page = safePage(app.page, user);
    const nav = navItemsFor(user);
    const unread = unreadCount(user);
    const queueCount = operationalQueue(user).filter(item => item.score >= 55).length;
    const venue = user.role === "VENUE_USER" ? venueById(user.venueId) : null;
    document.getElementById("app").innerHTML = `
      <div class="app-shell pro-shell">
        <div id="mobile-overlay" class="mobile-overlay" data-action="close-mobile-menu"></div>
        <aside id="sidebar" class="sidebar pro-sidebar">
          <div class="sidebar-brand"><img class="sidebar-logo" src="${LOGO_WHITE}" alt="Marquee Audiovisuales"><div class="sidebar-subtitle">Corporate Event Workspace</div></div>
          <div class="workspace-chip"><span class="workspace-dot"></span><div><strong>${escapeHtml(venue?.name || "Marquee Audiovisuales")}</strong><small>${escapeHtml(ROLE_LABEL[user.role])}</small></div></div>
          <div class="nav-scroll">
            <div class="nav-label">Espacio de trabajo</div>
            ${nav.map(([page, label, iconName]) => `<button class="nav-item ${app.page === page ? "active" : ""}" data-action="navigate" data-page="${page}">${icon(iconName)}<span>${label}</span>${page === "communications" && queueCount ? `<span class="nav-count attention">${queueCount}</span>` : page === "notifications" && unread ? `<span class="nav-count">${unread}</span>` : ""}</button>`).join("")}
          </div>
          <div class="sidebar-trust"><div class="trust-icon">${icon("lock")}</div><div><strong>Datos protegidos</strong><span>Acceso limitado por finca y rol</span></div></div>
          <div class="sidebar-footer">
            <div class="user-chip"><div class="avatar">${initials(user)}</div><div style="min-width:0"><div class="user-name">${escapeHtml(user.firstName)} ${escapeHtml(user.lastName)}</div><div class="user-email">${escapeHtml(user.email)}</div></div></div>
            <div class="side-actions"><button class="side-action" data-action="logout">${icon("logout", "icon-sm")} Salir</button><button class="side-action" data-action="reset-demo">${icon("refresh", "icon-sm")} Reiniciar</button></div>
          </div>
        </aside>
        <div class="main-column">
          <header class="topbar pro-topbar">
            <button class="topbar-action mobile-menu" data-action="open-mobile-menu" aria-label="Abrir menú">${icon("menu")}</button>
            <button class="command-trigger" data-action="open-command" aria-label="Abrir búsqueda global">${icon("search")}<span>Buscar evento, finca, cliente, archivo…</span><kbd>⌘ K</kbd></button>
            <span class="spacer"></span>
            <div class="sync-state" title="Cambios guardados en el navegador">${icon("check", "icon-sm")}<span>Guardado</span></div>
            <button class="topbar-action" data-action="navigate" data-page="notifications" aria-label="Notificaciones">${icon("bell")}${unread ? `<span class="notification-dot">${unread > 9 ? "9+" : unread}</span>` : ""}</button>
            <button class="btn btn-primary pro-new-event" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}<span class="new-event-text">${user.role === "VENUE_USER" ? "Nueva petición" : "Nuevo evento"}</span></button>
          </header>
          <main class="main-content" id="page-content">${renderPage()}</main>
        </div>
        ${mobileNavFor(user)}
      </div>
      <div id="command-root">${renderCommandPalette()}</div>`;
    renderOverlay();
    renderModal();
    renderProModal();
    document.body.classList.toggle("no-scroll", Boolean(app.selectedEventId || app.modal || app.proModal || app.commandOpen));
  }

  function dashboardMetric(label, value, detail, iconName, action = "", tone = "") {
    return `<button class="pro-metric ${tone}" ${action}><span class="pro-metric-icon">${icon(iconName)}</span><span class="pro-metric-copy"><small>${escapeHtml(label)}</small><strong class="mono">${escapeHtml(value)}</strong><em>${escapeHtml(detail)}</em></span>${icon("arrowRight", "icon-sm")}</button>`;
  }

  function eventCompactCard(event, user = currentUser(), options = {}) {
    const venue = venueById(event.venueId);
    const budget = latestBudget(event, user);
    const plan = actionPlanFor(event, user);
    const days = daysFromToday(event.eventDate);
    return `<article class="pro-event-card ${["URGENT", "VERY_URGENT"].includes(event.priority) ? "urgent" : ""}">
      <button class="pro-event-main" data-action="open-event" data-id="${event.id}">
        <span class="pro-date-block"><strong>${formatDate(event.eventDate, { day: "2-digit" })}</strong><small>${formatDate(event.eventDate, { month: "short" })}</small><em>${days === 0 ? "Hoy" : days === 1 ? "Mañana" : days > 1 ? `En ${days} días` : "Pasado"}</em></span>
        <span class="pro-event-copy"><span class="row-wrap">${priorityBadge(event.priority)}${statusBadge(event.status)}</span><strong>${escapeHtml(event.eventName)}</strong><small>${escapeHtml(venue?.name || "")} · ${escapeHtml(event.finalClient || "Cliente pendiente")} · ${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Pax pendiente"}</small><span class="next-action-line ${plan.tone}">${escapeHtml(plan.label)} · ${escapeHtml(plan.detail)}</span></span>
      </button>
      <div class="pro-event-actions">
        ${budget ? `<button class="btn btn-secondary btn-sm" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${budget.id}" title="Descargar ${escapeHtml(budget.displayName)}">${icon("download", "icon-sm")}<span>${escapeHtml(budget.displayName)}</span></button>` : `<button class="btn btn-ghost btn-sm" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">${icon("euro", "icon-sm")}Sin presupuesto</button>`}
        <button class="btn btn-secondary btn-icon btn-sm" data-action="open-event" data-id="${event.id}" aria-label="Abrir ficha">${icon("arrowRight", "icon-sm")}</button>
      </div>
    </article>`;
  }

  function renderDashboard() {
    const user = currentUser();
    const events = visibleEvents(user);
    const future = events.filter(event => daysFromToday(event.eventDate) >= 0 && ACTIVE_STATUSES.includes(event.status)).sort((a, b) => a.eventDate.localeCompare(b.eventDate) || PRIORITY[b.priority].rank - PRIORITY[a.priority].rank);
    const count = predicate => events.filter(predicate).length;
    const queue = operationalQueue(user);
    const important = queue.filter(item => item.score >= 55).slice(0, 5);
    const confirmed = count(event => event.status === "CONFIRMED");
    const pending = count(event => ACTIVE_STATUSES.includes(event.status) && event.status !== "CONFIRMED");
    const urgent = count(event => ["URGENT", "VERY_URGENT"].includes(event.priority) && ACTIVE_STATUSES.includes(event.status));
    const noBudget = count(event => ACTIVE_STATUSES.includes(event.status) && visibleBudgets(event, user).length === 0);
    const next7 = count(event => daysFromToday(event.eventDate) >= 0 && daysFromToday(event.eventDate) <= 7 && ACTIVE_STATUSES.includes(event.status));
    const budgetCount = events.reduce((sum, event) => sum + visibleBudgets(event, user).length, 0);
    const todayLabel = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
    const firstName = user.firstName || "Equipo";
    const venue = user.role === "VENUE_USER" ? venueById(user.venueId) : null;
    const headline = user.role === "VENUE_USER"
      ? `Todo lo que ocurre en ${venue?.name || "tu finca"}, en un solo lugar.`
      : "Cada petición, conversación y presupuesto bajo control.";
    const subline = user.role === "VENUE_USER"
      ? "Crea peticiones, consulta su evolución y descarga la documentación sin llamadas ni búsquedas interminables."
      : "Prioriza el trabajo comercial, responde a las fincas y encuentra cualquier expediente en segundos.";

    return `
      <section class="pro-hero">
        <div class="pro-hero-copy"><div class="eyebrow">${escapeHtml(todayLabel)} · Hola, ${escapeHtml(firstName)}</div><h1>${escapeHtml(headline)}</h1><p>${escapeHtml(subline)}</p><div class="hero-actions"><button class="btn btn-primary" data-action="navigate" data-page="${user.role === "VENUE_USER" ? "new-event" : "communications"}">${icon(user.role === "VENUE_USER" ? "plus" : "message", "icon-sm")}${user.role === "VENUE_USER" ? "Crear nueva petición" : "Abrir centro de comunicación"}</button><button class="btn btn-glass" data-action="open-command">${icon("search", "icon-sm")}Buscar cualquier cosa <kbd>⌘ K</kbd></button></div></div>
        <div class="hero-signal"><div class="signal-ring"><div><strong>${important.length}</strong><span>acciones<br>prioritarias</span></div></div><div class="signal-list"><span><i class="signal-dot danger"></i>${urgent} urgentes</span><span><i class="signal-dot warning"></i>${noBudget} sin presupuesto</span><span><i class="signal-dot success"></i>${confirmed} confirmados</span></div></div>
      </section>

      <div class="pro-metric-grid">
        ${user.role === "VENUE_USER" ? [
          dashboardMetric("Peticiones abiertas", pending, "En seguimiento", "clock", `data-action="metric-nav" data-page="events" data-filter-key="open" data-filter-value="1"`, "violet"),
          dashboardMetric("Presupuestos disponibles", budgetCount, "Descarga inmediata", "euro", `data-action="navigate" data-page="files"`, "blue"),
          dashboardMetric("Eventos confirmados", confirmed, "Listos para producción", "check", `data-action="metric-nav" data-page="events" data-filter-key="status" data-filter-value="CONFIRMED"`, "green"),
          dashboardMetric("Próximos 7 días", next7, "Visibles en agenda", "calendar", `data-action="navigate" data-page="calendar"`, "neutral")
        ].join("") : [
          dashboardMetric("Acciones prioritarias", important.length, "Ordenadas por impacto", "warning", `data-action="navigate" data-page="communications"`, "violet"),
          dashboardMetric("Eventos sin presupuesto", noBudget, "Requieren propuesta", "euro", `data-action="metric-nav" data-page="events" data-filter-key="budget" data-filter-value="no"`, "warning"),
          dashboardMetric("Próximos 7 días", next7, "Revisión de agenda", "calendar", `data-action="navigate" data-page="calendar"`, "blue"),
          dashboardMetric("Confirmados", confirmed, "Cartera activa", "check", `data-action="metric-nav" data-page="events" data-filter-key="status" data-filter-value="CONFIRMED"`, "green")
        ].join("")}
      </div>

      <div class="pro-dashboard-layout">
        <section class="card pro-card priority-work">
          <div class="card-header pro-card-header"><div><div class="eyebrow dark">${user.role === "VENUE_USER" ? "SEGUIMIENTO" : "BANDEJA INTELIGENTE"}</div><div class="card-title">${user.role === "VENUE_USER" ? "Lo más importante ahora" : "Trabajo priorizado automáticamente"}</div><div class="card-desc">Urgencia, fecha, información pendiente y situación del presupuesto.</div></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-page="communications">Ver todo ${icon("arrowRight", "icon-sm")}</button></div>
          <div class="priority-list">${important.map(({ event }) => eventCompactCard(event, user)).join("") || `<div class="empty-state"><div class="empty-icon">${icon("check", "icon-lg")}</div><h3>Todo está bajo control</h3><p>No existen acciones prioritarias en este momento.</p></div>`}</div>
        </section>

        <aside class="pro-side-stack">
          <section class="card pro-card next-agenda"><div class="card-header pro-card-header"><div><div class="eyebrow dark">AGENDA</div><div class="card-title">Próximas fechas</div></div><button class="icon-link" data-action="navigate" data-page="calendar" aria-label="Abrir calendario">${icon("arrowRight")}</button></div><div class="agenda-mini-list">${future.slice(0, 4).map(event => {
            const budget = latestBudget(event, user);
            return `<article><button data-action="open-event" data-id="${event.id}"><span class="agenda-date"><strong>${formatDate(event.eventDate, { day: "2-digit" })}</strong><small>${formatDate(event.eventDate, { month: "short" })}</small></span><span><strong>${escapeHtml(event.eventName)}</strong><small>${escapeHtml(event.estimatedStartTime || "Horario pendiente")} · ${escapeHtml(venueById(event.venueId)?.name || "")}</small></span></button>${budget ? `<button class="agenda-download" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${budget.id}" title="Descargar presupuesto">${icon("download", "icon-sm")}</button>` : ""}</article>`;
          }).join("") || `<div class="empty-state compact"><p>Sin próximos eventos.</p></div>`}</div></section>
          <section class="pro-assurance"><span class="assurance-icon">${icon("archive")}</span><div><strong>Continuidad protegida</strong><p>${isAdmin(user) ? `${app.backupsCache.length} puntos de restauración locales. Exportación completa con archivos e integridad.` : "Cada cambio queda guardado y registrado en el histórico del evento."}</p></div>${isAdmin(user) ? `<button class="btn btn-glass btn-sm" data-action="navigate" data-page="backups">Revisar copias</button>` : ""}</section>
        </aside>
      </div>

      <section class="card pro-card recent-section">
        <div class="card-header pro-card-header"><div><div class="eyebrow dark">PRÓXIMOS EVENTOS</div><div class="card-title">Agenda operativa</div><div class="card-desc">Abre la ficha o descarga el último presupuesto sin cambiar de pantalla.</div></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-page="events">Ver listado completo</button></div>
        <div class="recent-grid">${future.slice(0, 6).map(event => {
          const budget = latestBudget(event, user);
          return `<article class="recent-event"><div class="recent-event-top"><span class="recent-event-date">${formatDate(event.eventDate, { day: "numeric", month: "short" })}</span>${priorityBadge(event.priority)}</div><button class="recent-event-title" data-action="open-event" data-id="${event.id}">${escapeHtml(event.eventName)}</button><p>${escapeHtml(venueById(event.venueId)?.name || "")} · ${escapeHtml(event.finalClient || "Cliente pendiente")}</p><div class="recent-event-foot">${statusBadge(event.status)}<span class="spacer"></span>${budget ? `<button class="quick-file" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${budget.id}">${icon("download", "icon-sm")} ${escapeHtml(budget.displayName)}</button>` : `<button class="quick-file muted" data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">Sin presupuesto</button>`}</div></article>`;
        }).join("") || `<div class="empty-state"><h3>No hay eventos próximos</h3></div>`}</div>
      </section>`;
  }

  function renderCommunications() {
    const user = currentUser();
    const queue = operationalQueue(user);
    const all = visibleEvents(user).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    const selected = eventById(app.communicationEventId) && canAccessEvent(eventById(app.communicationEventId), user)
      ? eventById(app.communicationEventId)
      : (queue[0]?.event || all[0] || null);
    if (selected) app.communicationEventId = selected.id;
    const comments = selected ? [...selected.comments].sort((a, b) => a.createdAt.localeCompare(b.createdAt)) : [];
    const latest = selected ? latestBudget(selected, user) : null;
    const plan = selected ? actionPlanFor(selected, user) : null;
    const queueIds = new Set(queue.slice(0, 12).map(item => item.event.id));
    const conversations = [...queue.slice(0, 12).map(item => item.event), ...all.filter(event => !queueIds.has(event.id))].slice(0, 30);

    return `
      ${pageHead("Centro de comunicación", user.role === "VENUE_USER" ? "Toda la conversación con Marquee, organizada por evento y sin mensajes perdidos." : "Una bandeja compartida para responder a fincas, priorizar seguimientos y cerrar eventos.", `<button class="btn btn-secondary" data-action="open-command">${icon("search", "icon-sm")}Buscar conversación</button>`)}
      <section class="communication-shell card">
        <aside class="conversation-list-panel">
          <div class="conversation-list-head"><div><strong>Bandeja de eventos</strong><span>${conversations.length} conversaciones accesibles</span></div><span class="live-pill"><i></i> Actualizada</span></div>
          <div class="conversation-search">${icon("search", "icon-sm")}<input id="communication-search" placeholder="Filtrar por evento o finca…"></div>
          <div class="conversation-list" id="conversation-list">
            ${conversations.map(event => {
              const score = attentionScore(event, user);
              const last = [...event.comments].sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
              const author = userById(last?.authorId);
              return `<button class="conversation-item ${selected?.id === event.id ? "active" : ""}" data-action="select-communication" data-id="${event.id}" data-search="${escapeHtml(`${event.eventName} ${venueById(event.venueId)?.name || ""} ${event.finalClient || ""}`.toLowerCase())}">
                <span class="conversation-avatar ${score >= 100 ? "urgent" : ""}">${escapeHtml((venueById(event.venueId)?.name || "EV").slice(0,2).toUpperCase())}</span>
                <span class="conversation-copy"><span class="conversation-title"><strong>${escapeHtml(event.eventName)}</strong><time>${relativeTime(last?.createdAt || event.updatedAt)}</time></span><small>${escapeHtml(venueById(event.venueId)?.name || "")} · ${escapeHtml(author ? `${author.firstName}: ` : "")}${escapeHtml(last?.body || actionPlanFor(event, user).detail)}</small><span class="conversation-tags">${statusBadge(event.status)}${score >= 100 ? `<em>Requiere atención</em>` : ""}</span></span>
              </button>`;
            }).join("") || `<div class="empty-state compact"><p>No hay conversaciones.</p></div>`}
          </div>
        </aside>
        <div class="conversation-detail">
          ${selected ? `<header class="conversation-detail-head">
            <div><div class="eyebrow dark">${escapeHtml(venueById(selected.venueId)?.name || "EVENTO")}</div><h2>${escapeHtml(selected.eventName)}</h2><p>${formatDateLong(selected.eventDate)} · ${escapeHtml(eventTime(selected))} · ${selected.numberOfPeople ? `${selected.numberOfPeople} pax` : "Personas pendientes"}</p><div class="row-wrap">${statusBadge(selected.status)}${priorityBadge(selected.priority)}</div></div>
            <div class="conversation-head-actions">${latest ? `<button class="btn btn-secondary" data-action="download-budget" data-event-id="${selected.id}" data-budget-id="${latest.id}">${icon("download", "icon-sm")} ${escapeHtml(latest.displayName)}</button>` : ""}<button class="btn btn-primary" data-action="open-event" data-id="${selected.id}">Abrir expediente ${icon("arrowRight", "icon-sm")}</button></div>
          </header>
          <div class="conversation-context">
            <div class="context-next ${plan.tone}"><span>${icon("warning")}</span><div><small>Siguiente mejor acción</small><strong>${escapeHtml(plan.label)}</strong><em>${escapeHtml(plan.detail)}</em></div></div>
            <div class="context-facts"><span><small>Cliente</small><strong>${escapeHtml(selected.finalClient || "Pendiente")}</strong></span><span><small>Contacto</small><strong>${escapeHtml([selected.contactFirstName, selected.contactLastName].filter(Boolean).join(" ") || "Pendiente")}</strong></span><span><small>Documentos</small><strong>${visibleDocuments(selected, user).length + visibleBudgets(selected, user).length} archivos</strong></span></div>
          </div>
          <div class="message-thread">
            ${comments.map(comment => {
              const author = userById(comment.authorId);
              const own = author?.id === user.id;
              const internalSide = author?.role !== "VENUE_USER";
              return `<article class="message-bubble ${own ? "own" : ""} ${internalSide ? "marquee" : "venue"}"><div class="message-avatar">${initials(author || {}) || "M"}</div><div class="message-content"><div class="message-meta"><strong>${escapeHtml(author ? `${author.firstName} ${author.lastName}` : "Sistema")}</strong><span>${escapeHtml(ROLE_LABEL[author?.role] || "Sistema")} · ${formatDateTime(comment.createdAt)}</span></div><p>${escapeHtml(comment.body)}</p></div></article>`;
            }).join("") || `<div class="thread-empty">${icon("message", "icon-lg")}<strong>Inicia la conversación</strong><span>Los mensajes quedarán vinculados permanentemente a este evento.</span></div>`}
          </div>
          <form id="comment-form" class="message-composer"><input type="hidden" name="eventId" value="${selected.id}"><textarea name="body" maxlength="5000" required placeholder="Escribe un mensaje sobre este evento…"></textarea><div class="composer-foot"><span>${icon("lock", "icon-sm")} Visible solo para las partes de este evento</span><button class="btn btn-primary" type="submit">Enviar mensaje ${icon("arrowRight", "icon-sm")}</button></div></form>` : `<div class="empty-state"><div class="empty-icon">${icon("message", "icon-lg")}</div><h3>Sin conversaciones</h3><p>Crea una petición para comenzar el seguimiento.</p></div>`}
        </div>
      </section>`;
  }

  function allVisibleFiles(user = currentUser()) {
    const rows = [];
    for (const event of visibleEvents(user)) {
      for (const budget of visibleBudgets(event, user)) rows.push({ kind: "BUDGET", event, item: budget, createdAt: budget.createdAt });
      for (const document of visibleDocuments(event, user)) rows.push({ kind: "DOCUMENT", event, item: document, createdAt: document.createdAt });
    }
    return rows.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }

  function fileTypeLabel(row) {
    if (row.kind === "BUDGET") return `Presupuesto V${row.item.version}`;
    return row.item.visibility === "INTERNAL" ? "Documento interno" : "Documento compartido";
  }

  function renderFiles() {
    const user = currentUser();
    const ops = isOps(user);
    const filters = app.fileFilters;
    const all = allVisibleFiles(user);
    const rows = all.filter(row => {
      const haystack = [row.item.displayName, row.item.originalName, row.item.description, row.event.eventName, row.event.finalClient, venueById(row.event.venueId)?.name].filter(Boolean).join(" ").toLowerCase();
      if (filters.q && !haystack.includes(filters.q.toLowerCase())) return false;
      if (filters.kind !== "ALL" && row.kind !== filters.kind) return false;
      if (filters.venue && row.event.venueId !== filters.venue) return false;
      return true;
    });
    const budgetCount = all.filter(row => row.kind === "BUDGET").length;
    const documentCount = all.filter(row => row.kind === "DOCUMENT").length;
    const totalBytes = all.reduce((sum, row) => sum + (row.item.sizeBytes || 0), 0);
    const actions = `${ops ? `<button class="btn btn-secondary" data-action="open-upload-modal" data-kind="BUDGET">${icon("euro", "icon-sm")}Subir presupuesto</button>` : ""}<button class="btn btn-primary" data-action="open-upload-modal" data-kind="DOCUMENT">${icon("upload", "icon-sm")}Subir documento</button>`;
    return `
      ${pageHead("Biblioteca de archivos", "Presupuestos y documentación localizados por evento, finca y fecha. Descarga directa desde una única pantalla.", actions)}
      <div class="file-overview-grid"><div class="file-overview"><span>${icon("euro")}</span><div><small>Presupuestos accesibles</small><strong>${budgetCount}</strong></div></div><div class="file-overview"><span>${icon("file")}</span><div><small>Documentos</small><strong>${documentCount}</strong></div></div><div class="file-overview"><span>${icon("archive")}</span><div><small>Volumen almacenado</small><strong>${formatBytes(totalBytes)}</strong></div></div><div class="file-overview secure"><span>${icon("lock")}</span><div><small>Control de acceso</small><strong>${user.role === "VENUE_USER" ? "Solo mi finca" : "Según rol"}</strong></div></div></div>
      <section class="card file-library">
        <div class="file-filter-bar"><div class="search-field">${icon("search", "icon-sm")}<input class="field" data-pro-file-filter="q" placeholder="Buscar por archivo, evento, cliente o finca…" value="${escapeHtml(filters.q)}"></div><select class="select" data-pro-file-filter="kind"><option value="ALL" ${filters.kind === "ALL" ? "selected" : ""}>Todos los archivos</option><option value="BUDGET" ${filters.kind === "BUDGET" ? "selected" : ""}>Presupuestos</option><option value="DOCUMENT" ${filters.kind === "DOCUMENT" ? "selected" : ""}>Documentos</option></select>${ops ? `<select class="select" data-pro-file-filter="venue"><option value="">Todas las fincas</option>${app.data.venues.filter(v => v.state === "ACTIVE").map(v => `<option value="${v.id}" ${filters.venue === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select>` : ""}<button class="btn btn-secondary" data-action="clear-file-filters">${icon("refresh", "icon-sm")}Limpiar</button></div>
        <div class="file-table-head"><span>Archivo</span><span>Evento y finca</span><span>Fecha</span><span>Acceso</span><span></span></div>
        <div class="file-library-list">${rows.map(row => {
          const uploader = userById(row.item.uploadedById);
          const isBudget = row.kind === "BUDGET";
          return `<article class="library-file-row"><span class="library-file-icon ${isBudget ? "budget" : "document"}">${icon(isBudget ? "euro" : "file")}</span><span class="library-file-main"><strong>${escapeHtml(row.item.displayName)}</strong><small>${escapeHtml(row.item.originalName)} · ${formatBytes(row.item.sizeBytes)} · ${escapeHtml(uploader ? `${uploader.firstName} ${uploader.lastName}` : "Sistema")}</small>${row.item.description ? `<em>${escapeHtml(row.item.description)}</em>` : ""}</span><span class="library-event"><button data-action="open-event" data-id="${row.event.id}">${escapeHtml(row.event.eventName)}</button><small>${escapeHtml(venueById(row.event.venueId)?.name || "")} · ${escapeHtml(row.event.finalClient || "")}</small></span><span class="library-date"><strong>${formatDate(row.createdAt.slice(0,10))}</strong><small>${relativeTime(row.createdAt)}</small></span><span class="library-access">${isBudget ? budgetBadge(row.item.status) : row.item.visibility === "INTERNAL" ? `<span class="badge badge-info">Solo interno</span>` : `<span class="badge badge-confirmed">Compartido</span>`}</span><span class="library-actions"><button class="btn btn-secondary btn-sm" data-action="${isBudget ? "download-budget" : "download-document"}" data-event-id="${row.event.id}" data-${isBudget ? "budget" : "document"}-id="${row.item.id}">${icon("download", "icon-sm")}Descargar</button><button class="btn btn-secondary btn-icon btn-sm" data-action="open-event-tab" data-id="${row.event.id}" data-tab="${isBudget ? "budgets" : "documents"}" aria-label="Abrir evento">${icon("arrowRight", "icon-sm")}</button></span></article>`;
        }).join("") || `<div class="empty-state"><div class="empty-icon">${icon("file", "icon-lg")}</div><h3>No hay archivos con estos filtros</h3><p>Prueba otra búsqueda o sube documentación a un evento.</p></div>`}</div>
      </section>`;
  }

  function backupReasonLabel(reason) {
    const labels = { automática: "Automática", manual: "Manual", "antes de restaurar": "Previa a restauración", "restauración de archivo": "Restauración" };
    return labels[reason] || reason || "Manual";
  }

  function renderBackups() {
    if (!isAdmin()) return `<div class="empty-state"><h3>Acceso restringido</h3></div>`;
    const latest = app.backupsCache[0];
    const fileCount = linkedFileCount();
    const activeEvents = app.data.events.filter(event => !event.deletedAt).length;
    return `
      ${pageHead("Copias de seguridad", "Protección de datos, recuperación y exportación portable del espacio de trabajo.", `<button class="btn btn-secondary" data-action="create-backup">${icon("archive", "icon-sm")}Crear punto ahora</button><button class="btn btn-primary" data-action="export-backup">${icon("download", "icon-sm")}Descargar copia completa</button>`)}
      <section class="backup-hero"><div class="backup-hero-copy"><span class="backup-shield">${icon("lock")}</span><div><div class="eyebrow">CONTINUIDAD DEL SERVICIO</div><h2>Datos preparados para recuperarse.</h2><p>La demo crea puntos locales automáticos. La copia portable incluye todos los datos, los archivos subidos y una comprobación SHA-256.</p></div></div><div class="backup-health"><span><i></i>Sistema operativo</span><strong>${latest ? relativeTime(latest.createdAt) : "Sin copia"}</strong><small>Último punto local</small></div></section>
      <div class="backup-metrics"><article><span>${icon("archive")}</span><div><small>Puntos disponibles</small><strong>${app.backupsCache.length}</strong><em>Retención: ${app.data.settings.backupRetention} copias</em></div></article><article><span>${icon("calendar")}</span><div><small>Eventos protegidos</small><strong>${activeEvents}</strong><em>Base de datos de la demo</em></div></article><article><span>${icon("file")}</span><div><small>Archivos vinculados</small><strong>${fileCount}</strong><em>Presupuestos y documentos</em></div></article><article><span>${icon("check")}</span><div><small>Integridad exportable</small><strong>SHA-256</strong><em>Verificación al restaurar</em></div></article></div>
      <div class="backup-layout">
        <section class="card backup-points"><div class="card-header pro-card-header"><div><div class="card-title">Puntos de restauración</div><div class="card-desc">Recupera el estado de los datos sin afectar a los archivos almacenados.</div></div><button class="icon-link" data-action="refresh-backups" aria-label="Actualizar">${icon("refresh")}</button></div><div class="backup-list">${app.backupsCache.map((item, index) => `<article class="backup-row"><span class="backup-timeline-dot ${index === 0 ? "latest" : ""}"></span><div><div class="row-wrap"><strong>${backupReasonLabel(item.reason)}</strong>${index === 0 ? `<span class="badge badge-confirmed">Más reciente</span>` : ""}</div><small>${formatDateTime(item.createdAt)} · ${item.eventCount} eventos · ${item.fileCount} archivos</small><em>${escapeHtml(userById(item.actorId) ? `${userById(item.actorId).firstName} ${userById(item.actorId).lastName}` : "Sistema")}</em></div><div class="backup-row-actions"><button class="btn btn-secondary btn-sm" data-action="request-restore-snapshot" data-id="${item.id}">${icon("refresh", "icon-sm")}Restaurar</button><button class="btn btn-ghost btn-icon btn-sm" data-action="delete-snapshot" data-id="${item.id}" title="Eliminar copia">${icon("trash", "icon-sm")}</button></div></article>`).join("") || `<div class="empty-state"><div class="empty-icon">${icon("archive", "icon-lg")}</div><h3>Aún no hay puntos locales</h3><p>Crea el primero ahora. Después se generarán automáticamente al guardar cambios.</p><button class="btn btn-primary" data-action="create-backup" style="margin-top:14px">Crear primera copia</button></div>`}</div></section>
        <aside class="backup-side">
          <section class="card card-pad portable-card"><span class="portable-icon">${icon("download")}</span><h3>Copia completa portable</h3><p>Descarga un único archivo JSON con eventos, usuarios, fincas, presupuestos, documentos y sus archivos reales.</p><ul><li>${icon("check", "icon-sm")}Incluye los adjuntos guardados</li><li>${icon("check", "icon-sm")}Verificación de integridad</li><li>${icon("check", "icon-sm")}Restaurable desde otro navegador</li></ul><button class="btn btn-primary" data-action="export-backup">${icon("download", "icon-sm")}Descargar copia completa</button></section>
          <section class="card card-pad restore-card"><h3>Restaurar desde archivo</h3><p>Selecciona una copia portable exportada anteriormente. Se valida antes de reemplazar los datos.</p><input id="backup-import-input" type="file" accept="application/json,.json" hidden><button class="btn btn-secondary" data-action="trigger-import-backup">${icon("upload", "icon-sm")}Seleccionar copia</button></section>
          <section class="production-backup-note"><div class="production-backup-title">${icon("building")} Protección en producción</div><p>Para Railway, el proyecto separa PostgreSQL, archivos S3/R2 y código. La estrategia recomendada añade copias diarias externas, versionado del bucket y prueba periódica de restauración.</p><span>3-2-1 · cifrado · retención · monitorización</span></section>
        </aside>
      </div>`;
  }

  function renderProModal() {
    const root = document.getElementById("modal-root");
    if (!root || app.modal) return;
    const modal = app.proModal;
    if (!modal) return;
    const user = currentUser();
    if (modal.type === "upload") {
      const kind = modal.kind;
      const isBudget = kind === "BUDGET";
      const events = visibleEvents(user).filter(event => ACTIVE_STATUSES.includes(event.status) || event.status === "CONFIRMED").sort((a,b) => a.eventDate.localeCompare(b.eventDate));
      root.innerHTML = `<div class="modal-layer" data-action="close-pro-modal"><section class="modal" role="dialog" aria-modal="true" data-modal-stop><div class="modal-head"><div><div class="modal-title">${isBudget ? "Añadir presupuesto" : "Añadir documento"}</div><div class="modal-sub">El archivo quedará asociado al evento, visible en su ficha, calendario y biblioteca.</div></div><span class="spacer"></span><button class="close-btn" data-action="close-pro-modal">${icon("close")}</button></div><div class="modal-body"><form id="pro-upload-form" class="form-grid" data-kind="${kind}"><div class="full"><label class="label">Evento *</label><select class="select" name="eventId" required><option value="">Selecciona un evento</option>${events.map(event => `<option value="${event.id}">${escapeHtml(formatDate(event.eventDate))} · ${escapeHtml(event.eventName)} · ${escapeHtml(venueById(event.venueId)?.name || "")}</option>`).join("")}</select></div><div class="full"><label class="pro-drop-zone" for="pro-upload-file">${icon("upload", "icon-lg")}<strong>Arrastra el archivo o pulsa para seleccionarlo</strong><span>PDF, DOCX, XLSX, JPG o PNG · máximo 25 MB</span><input id="pro-upload-file" name="file" type="file" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png" hidden required></label><div id="pro-upload-file-name" class="help"></div></div><div><label class="label">Nombre visible</label><input class="field" name="displayName" placeholder="${isBudget ? "Ej. Presupuesto V3" : "Ej. Plano de implantación"}"></div>${isBudget ? `<div><label class="label">Estado</label><select class="select" name="status"><option value="DRAFT">Borrador interno</option><option value="SENT" selected>Compartido con finca</option><option value="FINAL">Final</option></select></div>` : isOps(user) ? `<div><label class="label">Visibilidad</label><select class="select" name="visibility"><option value="SHARED">Compartido con finca</option><option value="INTERNAL">Solo interno</option></select></div>` : `<input type="hidden" name="visibility" value="SHARED">`}<div class="full"><label class="label">Descripción</label><textarea class="textarea compact" name="description" placeholder="Explica brevemente el contenido o los cambios incluidos"></textarea></div></form></div><div class="modal-foot"><button class="btn btn-secondary" data-action="close-pro-modal">Cancelar</button><button class="btn btn-primary" data-action="submit-pro-upload">${icon("upload", "icon-sm")}Subir y asociar</button></div></section></div>`;
      return;
    }
    if (modal.type === "restore") {
      const snapshot = app.backupsCache.find(item => item.id === modal.id);
      root.innerHTML = `<div class="modal-layer" data-action="close-pro-modal"><section class="modal" role="dialog" aria-modal="true" data-modal-stop><div class="modal-head"><div><div class="modal-title">Restaurar punto de seguridad</div><div class="modal-sub">Esta operación reemplazará los datos actuales de la demo.</div></div><span class="spacer"></span><button class="close-btn" data-action="close-pro-modal">${icon("close")}</button></div><div class="modal-body"><div class="restore-warning">${icon("warning")}<div><strong>Se creará una copia previa automáticamente.</strong><p>Vas a recuperar el estado de ${snapshot ? formatDateTime(snapshot.createdAt) : "la copia seleccionada"}. Los archivos subidos permanecen almacenados.</p></div></div></div><div class="modal-foot"><button class="btn btn-secondary" data-action="close-pro-modal">Cancelar</button><button class="btn btn-primary" data-action="confirm-restore-snapshot" data-id="${modal.id}">${icon("refresh", "icon-sm")}Crear copia y restaurar</button></div></section></div>`;
    }
  }

  function renderEvents() {
    const user = currentUser();
    const events = filteredEvents();
    const ops = isOps(user);
    const venueOptions = `<option value="">Todas las fincas</option>${app.data.venues.filter(v => v.state === "ACTIVE").map(v => `<option value="${v.id}" ${app.eventFilters.venue === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}`;
    const activeFilters = Object.values(app.eventFilters).filter(Boolean).length;
    return `
      ${pageHead(user.role === "VENUE_USER" ? "Mis eventos" : "Gestión de eventos", `${events.length} expediente${events.length === 1 ? "" : "s"} accesible${events.length === 1 ? "" : "s"}. Encuentra, revisa y descarga sin navegar por múltiples pantallas.`, `${ops ? `<button class="btn btn-secondary" data-action="export-csv">${icon("download", "icon-sm")}Exportar CSV</button>` : ""}<button class="btn btn-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}${user.role === "VENUE_USER" ? "Nueva petición" : "Nuevo evento"}</button>`)}
      <section class="card pro-filter-card">
        <div class="pro-filter-main"><div class="search-field pro-event-search"><span>${icon("search", "icon-sm")}</span><input id="events-search" class="field" placeholder="Evento, cliente, agencia, contacto, teléfono…" value="${escapeHtml(app.eventFilters.q)}" data-filter="q"></div><button class="filter-summary">${icon("filter", "icon-sm")} Filtros${activeFilters ? `<span>${activeFilters}</span>` : ""}</button></div>
        <div class="pro-filter-controls">${ops ? `<select class="select" data-filter="venue">${venueOptions}</select>` : ""}<select class="select" data-filter="status">${optionList(STATUS, app.eventFilters.status, true, "Todos los estados")}</select><select class="select" data-filter="priority">${optionList(PRIORITY, app.eventFilters.priority, true, "Todas las prioridades")}</select><select class="select" data-filter="budget"><option value="" ${!app.eventFilters.budget ? "selected" : ""}>Cualquier presupuesto</option><option value="yes" ${app.eventFilters.budget === "yes" ? "selected" : ""}>Con presupuesto</option><option value="no" ${app.eventFilters.budget === "no" ? "selected" : ""}>Sin presupuesto</option></select><button class="btn btn-ghost" data-action="clear-filters">${icon("refresh", "icon-sm")}Limpiar</button></div>
      </section>
      <section class="card pro-table-card">
        <div class="table-wrap"><table class="data-table pro-data-table"><thead><tr><th>${sortHeader("eventDate", "Fecha")}</th><th>${sortHeader("eventName", "Evento")}</th>${ops ? `<th>${sortHeader("venue", "Finca")}</th>` : ""}<th>Cliente y contacto</th><th>${sortHeader("status", "Situación")}</th><th>Próxima acción</th><th>Archivos</th><th style="text-align:right">Acciones</th></tr></thead><tbody>${events.map(event => {
          const venue = venueById(event.venueId);
          const budgets = visibleBudgets(event, user);
          const documents = visibleDocuments(event, user);
          const latest = latestBudget(event, user);
          const plan = actionPlanFor(event, user);
          const completeness = completenessFor(event);
          return `<tr class="event-table-row ${attentionScore(event,user) >= 100 ? "needs-attention" : ""}"><td><div class="table-date-pro"><strong>${formatDate(event.eventDate, { day: "2-digit" })}</strong><span>${formatDate(event.eventDate, { month: "short", year: "numeric" })}</span><small class="mono">${escapeHtml(eventTime(event))}</small></div></td><td><button class="table-event-link" data-action="open-event" data-id="${event.id}">${escapeHtml(event.eventName)}</button><div class="table-sub">${escapeHtml(event.agency || "Sin agencia")} · ${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Pax pendiente"}</div><div class="mini-progress" title="Expediente ${completeness}% completo"><i style="width:${completeness}%"></i><span>${completeness}%</span></div></td>${ops ? `<td><span class="venue-table-pill">${escapeHtml(venue?.name || "—")}</span></td>` : ""}<td><div class="table-client"><strong>${escapeHtml(event.finalClient || "Cliente pendiente")}</strong><span>${escapeHtml([event.contactFirstName,event.contactLastName].filter(Boolean).join(" ") || "Contacto pendiente")}</span><small>${escapeHtml(event.phone || event.email || "Sin datos de contacto")}</small></div></td><td><div class="status-stack">${statusBadge(event.status)}${priorityBadge(event.priority)}</div></td><td><button class="next-action-cell ${plan.tone}" data-action="open-event-tab" data-id="${event.id}" data-tab="${plan.tab}"><strong>${escapeHtml(plan.label)}</strong><span>${escapeHtml(plan.detail)}</span></button></td><td><div class="file-count-stack"><button data-action="open-event-tab" data-id="${event.id}" data-tab="budgets">${icon("euro", "icon-sm")}<strong>${budgets.length}</strong><span>presupuesto${budgets.length === 1 ? "" : "s"}</span></button><button data-action="open-event-tab" data-id="${event.id}" data-tab="documents">${icon("file", "icon-sm")}<strong>${documents.length}</strong><span>documento${documents.length === 1 ? "" : "s"}</span></button></div></td><td><div class="table-actions">${latest ? `<button class="btn btn-secondary btn-icon btn-sm" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${latest.id}" title="Descargar ${escapeHtml(latest.displayName)}">${icon("download", "icon-sm")}</button>` : ""}<button class="btn btn-secondary btn-icon btn-sm" data-action="open-event" data-id="${event.id}" title="Abrir expediente">${icon("eye", "icon-sm")}</button>${ops ? `<button class="btn btn-secondary btn-icon btn-sm" data-action="edit-event" data-id="${event.id}" title="Editar">${icon("edit", "icon-sm")}</button>` : ""}</div></td></tr>`;
        }).join("")}</tbody></table>${events.length ? "" : `<div class="empty-state"><div class="empty-icon">${icon("search", "icon-lg")}</div><h3>No hay eventos con estos filtros</h3><p>Prueba a limpiar la búsqueda o crea una nueva petición.</p><button class="btn btn-primary" data-action="clear-filters" style="margin-top:15px">Limpiar filtros</button></div>`}</div>
      </section>`;

  function calendarEventHtml(event) {
    const budgets = visibleBudgets(event);
    const latest = latestBudget(event);
    const docs = visibleDocuments(event).length;
    const incomplete = eventIncompleteFields(event).length;
    return `<article class="cal-event pro-cal-event priority-${event.priority} ${event.status === "CONFIRMED" ? "confirmed" : ""}" data-action="open-event" data-id="${event.id}" role="button" tabindex="0" title="${escapeHtml(event.eventName)}"><div class="cal-event-head"><span class="cal-time">${escapeHtml(event.estimatedStartTime || "—")}</span>${priorityBadge(event.priority)}</div><div class="cal-event-title">${escapeHtml(event.eventName)}</div><div class="cal-event-venue">${escapeHtml(venueById(event.venueId)?.name || "")}</div><div class="cal-event-foot"><span>${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Pax ?"}</span><span class="cal-indicators">${latest ? `<button type="button" class="cal-file-action" data-action="download-budget" data-event-id="${event.id}" data-budget-id="${latest.id}" title="Descargar ${escapeHtml(latest.displayName)}">${icon("download", "icon-sm")} €${budgets.length > 1 ? budgets.length : ""}</button>` : `<span class="cal-no-budget" title="Sin presupuesto">€—</span>`}${docs ? `<button type="button" class="cal-file-action icon-only" data-action="open-event-tab" data-id="${event.id}" data-tab="documents" title="${docs} documentos">${icon("file", "icon-sm")}</button>` : ""}${incomplete ? `<span class="cal-alert" title="${incomplete} datos pendientes">!</span>` : ""}</span></div></article>`;

  function renderDayCalendar(events) {
    const iso = dateIso(app.calendarDate);
    const dayEvents = events.filter(event => event.eventDate === iso).sort((a,b) => (a.estimatedStartTime || "99:99").localeCompare(b.estimatedStartTime || "99:99"));
    return `<div class="day-list pro-day-list">${dayEvents.map(event => {

  async function uploadDocument(form) {
    const user = currentUser();
    const data = formObject(form);
    const event = eventById(data.eventId);
    const file = form.querySelector('input[type="file"]')?.files?.[0];
    if (!event || !canAccessEvent(event,user)) return toast("Acción no autorizada", "No puedes añadir documentos a este evento.", "error");
    if (!file) return toast("Selecciona un archivo", "Debes elegir un documento.", "error");
    if (file.size > 25 * 1024 * 1024) return toast("Archivo demasiado grande", "El máximo de la demo es 25 MB.", "error");
    const allowed = ["pdf","docx","xlsx","jpg","jpeg","png"];
    const ext = file.name.split(".").pop()?.toLowerCase();
    if (!allowed.includes(ext)) return toast("Formato no permitido", "Usa PDF, DOCX, XLSX, JPG o PNG.", "error");
    const visibility = isOps(user) ? (data.visibility || "SHARED") : "SHARED";
    const documentItem = { id: uid("document"), displayName: String(data.displayName || "").trim() || file.name.replace(/\.[^.]+$/, ""), originalName: file.name, description: String(data.description || "").trim(), visibility, uploadedById: user.id, sizeBytes: file.size, mimeType: file.type || "application/octet-stream", createdAt: nowIso(), fileKey: uid("file") };
    try { await saveFileBlob(documentItem.fileKey,file); } catch { return toast("No se pudo guardar el archivo", "El navegador ha bloqueado el almacenamiento local.", "error"); }
    event.documents.push(documentItem);
    event.updatedAt = nowIso();
    event.history.unshift(makeHistory(user.id, `Se añadió el documento ${documentItem.displayName}`, "DOCUMENT_ADDED", { documentId: documentItem.id, visibility }));
    if (user.role === "VENUE_USER") notifyOps(event,"EVENT_UPDATED","Nuevo documento de la finca",`${documentItem.displayName} se ha añadido a ${event.eventName}.`,user.id);
    else if (visibility === "SHARED") notifyVenue(event,"EVENT_UPDATED","Nuevo documento disponible",`${documentItem.displayName} se ha añadido al evento.`,user.id);
    addAudit("UPLOAD","EVENT_DOCUMENT",documentItem.id,{eventId:event.id,visibility});
    saveData();
    app.proModal = null;
    renderShell();
    toast("Documento añadido", "Ya está disponible en el evento y en la biblioteca.", "success");
  }

    if (!isAdmin()) return;
    const data = formObject(form);

    app.data.settings.emailNotifications = data.emailNotifications === "on";

  function subtractMinutes(value, minutes) {
    if (!/^\d{2}:\d{2}$/.test(value || "")) return "";
    const [h, m] = value.split(":").map(Number);
    const total = (h * 60 + m - minutes + 1440) % 1440;
    return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
  }

  function isFinalStatus(status) {
    return ["COMPLETED", "CANCELLED", "NOT_ACCEPTED"].includes(status);
  }

  function v4Task(title, done, assignedTo, dueOffset, category = "GENERAL") {
    return {
      id: uid("task"), title, done, assignedTo, category,
      dueDate: v4DateOffset(dueOffset), createdAt: nowIso(), completedAt: done ? nowIso() : null
    };
  }

  function v4Info(label, done, assignedTo, dueOffset) {

    };
  }

  function defaultTasksFor(event) {
    const tasks = [];
    if (["NEW_REQUEST", "PENDING_REVIEW"].includes(event.status)) tasks.push(v4Task("Revisar briefing y detectar información pendiente", false, "MARQUEE", 0, "REVIEW"));
    if (!["BUDGET_SENT", "PENDING_RESPONSE", "NEGOTIATION", "CONFIRMED"].includes(event.status)) tasks.push(v4Task("Preparar propuesta técnica y presupuesto", false, "MARQUEE", 2, "BUDGET"));
    if (["BUDGET_SENT", "PENDING_RESPONSE", "NEGOTIATION"].includes(event.status)) tasks.push(v4Task("Realizar seguimiento del presupuesto", false, "MARQUEE", 1, "FOLLOW_UP"));
    if (event.status === "CONFIRMED") {
      tasks.push(v4Task("Confirmar horarios de acceso y montaje", false, "MARQUEE", Math.max(1, daysFromToday(event.eventDate) - 14), "PRODUCTION"));
      tasks.push(v4Task("Validar hoja técnica con la finca", false, "VENUE", Math.max(1, daysFromToday(event.eventDate) - 10), "PRODUCTION"));
    }
    return tasks;
  }

      COMPLETED: 6, NOT_ACCEPTED: 6, CANCELLED: 6
    };
    return map[event.status] ?? 0;
  }

  function publicStageLabel(event) {
    const labels = ["Petición recibida", "En revisión", "Preparando propuesta", "Presupuesto disponible", "Pendiente de decisión", "Evento confirmado", "Finalizado"];
    if (event.status === "CANCELLED") return "Cancelado";
    if (event.status === "NOT_ACCEPTED") return "No aceptado";
    return labels[publicStage(event)] || STATUS[event.status]?.label || event.status;
  }

  function renderPublicProgress(event, small = false) {
    const labels = ["Recibida", "Revisión", "Propuesta", "Presupuesto", "Decisión", "Confirmado", "Realizado"];
    const current = publicStage(event);
    return `<div class="v4-public-progress ${small ? "small" : ""}">${labels.map((label, index) => `<div class="v4-progress-step ${index < current ? "done" : index === current ? "current" : ""}"><span>${index < current ? icon("check", "icon-sm") : index + 1}</span><small>${label}</small></div>`).join("")}</div>`;
