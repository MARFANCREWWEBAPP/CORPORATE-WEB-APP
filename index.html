  function eventCurrentBudget(event, user = currentUser()) {
    const budgets = visibleBudgets(event, user).slice().sort((a, b) => b.version - a.version || String(b.createdAt).localeCompare(String(a.createdAt)));
    return budgets.find(item => item.isCurrent) || budgets[0] || null;
  }

  function isBudgetUnread(event, user = currentUser()) {
    if (!user || user.role !== "VENUE_USER") return false;
    const budget = eventCurrentBudget(event, user);
    return Boolean(budget && !(budget.viewedBy || []).includes(user.id));
  }

  function eventActionOwner(event) {
    if (event.waitingOn === "VENUE") return "VENUE";
    if (["CLIENT", "AGENCY"].includes(event.waitingOn)) return "FOLLOW_UP";
    if (event.waitingOn === "NONE") return "NONE";
    return "MARQUEE";
  }

  function isDue(date) {
    return Boolean(date && date <= dateIso(new Date()));
  }

  function dueText(date) {
    if (!date) return "Sin fecha límite";
    const days = daysFromToday(date);
    if (days < 0) return `Vencida hace ${Math.abs(days)} día${Math.abs(days) === 1 ? "" : "s"}`;
    if (days === 0) return "Vence hoy";
    if (days === 1) return "Vence mañana";
    return `Vence en ${days} días`;
  }

  function eventNeedsUser(event, user = currentUser()) {
    if (!user || isFinalStatus(event.status)) return false;
    if (user.role === "VENUE_USER") {
      return event.waitingOn === "VENUE" || event.infoRequests.some(item => !item.done && item.assignedTo === "VENUE") || isBudgetUnread(event, user);
    }
    if (event.waitingOn === "MARQUEE") return true;
    if (["CLIENT", "AGENCY"].includes(event.waitingOn) && isDue(event.nextActionDue)) return true;
    if (!event.assignedCommercialId) return true;
    if (user.role === "COMMERCIAL" && event.assignedCommercialId === user.id && event.waitingOn !== "NONE") return true;
    return isDue(event.nextActionDue);
  }

  function v4Queue(user = currentUser(), filter = app.v4InboxFilter) {
    let events = visibleEvents(user).filter(event => !isFinalStatus(event.status));
    if (user.role === "VENUE_USER") {
      if (filter === "mine") events = events.filter(event => eventNeedsUser(event, user));
      if (filter === "budget") events = events.filter(event => isBudgetUnread(event, user));
      if (filter === "information") events = events.filter(event => event.infoRequests.some(item => !item.done && item.assignedTo === "VENUE"));
      if (filter === "upcoming") events = events.filter(event => daysFromToday(event.eventDate) >= 0 && daysFromToday(event.eventDate) <= 30);
    } else {
      if (filter === "mine") events = events.filter(event => eventNeedsUser(event, user));
      if (filter === "venue") events = events.filter(event => event.waitingOn === "VENUE");
      if (filter === "client") events = events.filter(event => ["CLIENT", "AGENCY"].includes(event.waitingOn));
      if (filter === "overdue") events = events.filter(event => isDue(event.nextActionDue));
      if (filter === "unassigned") events = events.filter(event => !event.assignedCommercialId);
    }
    const query = String(app.v4QueueSearch || "").trim().toLowerCase();
    if (query) events = events.filter(event => [event.eventName, event.finalClient, event.agency, venueById(event.venueId)?.name].filter(Boolean).join(" ").toLowerCase().includes(query));
    return events.sort((a, b) => {
      const due = String(a.nextActionDue || "9999").localeCompare(String(b.nextActionDue || "9999"));
      if (due) return due;
      return (PRIORITY[b.priority]?.rank || 0) - (PRIORITY[a.priority]?.rank || 0);
    });
  }

  function pendingTaskCount(event, assignedTo = null) {
    return (event.tasks || []).filter(item => !item.done && (!assignedTo || item.assignedTo === assignedTo)).length;
  }

  function pendingInfoCount(event, assignedTo = null) {
    return (event.infoRequests || []).filter(item => !item.done && (!assignedTo || item.assignedTo === assignedTo)).length;
  }

  renderPage = function() {
    switch (app.page) {
      case "inbox": return renderV4Inbox();
      case "dashboard": return renderDashboard();
      case "events": return renderEvents();
      case "new-event": return renderNewEvent();
      case "calendar": return renderCalendar();
      case "communications": return renderCommunications();
      case "files": return renderFiles();
      case "venues": return renderVenues();
      case "contacts": return renderV4Contacts();
      case "my-venue": return renderMyVenue();
      case "notifications": return renderNotifications();
      case "statistics": return renderStatistics();
      case "users": return renderUsers();
      case "backups": return renderBackups();
      case "settings": return renderSettings();
      default: return renderDashboard();
    }

  function v4PageHead(title, description, actions = "", eyebrow = "") {
    return `<div class="page-head v4-page-head"><div>${eyebrow ? `<div class="eyebrow dark">${escapeHtml(eyebrow)}</div>` : ""}<h1>${escapeHtml(title)}</h1><p>${escapeHtml(description)}</p></div><div class="page-actions">${actions}</div></div>`;
  }

  function renderV4Metric(label, value, detail, iconName, tone, action) {
    return `<button class="v4-metric ${tone || ""}" ${action || ""}><span class="v4-metric-icon">${icon(iconName)}</span><span><small>${escapeHtml(label)}</small><strong>${escapeHtml(String(value))}</strong><em>${escapeHtml(detail)}</em></span>${icon("arrowRight", "icon-sm")}</button>`;
  }

  renderDashboard = function() {
    const user = currentUser();
    const events = visibleEvents(user);
    const open = events.filter(event => ACTIVE_STATUSES.includes(event.status));

    const upcoming = open.filter(event => daysFromToday(event.eventDate) >= 0).sort((a, b) => a.eventDate.localeCompare(b.eventDate)).slice(0, 5);
    const currentBudgets = events.filter(event => eventCurrentBudget(event, user)).length;
    const today = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
    const venue = user.role === "VENUE_USER" ? venueById(user.venueId) : null;
    const pendingInfo = events.reduce((sum, event) => sum + pendingInfoCount(event, user.role === "VENUE_USER" ? "VENUE" : null), 0);
    const waitingVenue = open.filter(event => event.waitingOn === "VENUE").length;
    const waitingClient = open.filter(event => ["CLIENT", "AGENCY"].includes(event.waitingOn)).length;
    const confirmed = events.filter(event => event.status === "CONFIRMED").length;

    if (user.role === "VENUE_USER") {
      const unreadBudgets = events.filter(event => isBudgetUnread(event, user)).length;
      return `
        <section class="v4-welcome v4-venue-welcome">
          <div><div class="eyebrow light">${escapeHtml(today)} · ${escapeHtml(venue?.name || "Mi finca")}</div><h1>Todo claro. Nada perdido.</h1><p>Crea peticiones, completa lo que falta y abre el presupuesto vigente sin buscar entre correos o conversaciones.</p><div class="hero-actions"><button class="btn btn-primary v4-hero-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}Crear petición</button><button class="btn btn-glass" data-action="navigate" data-page="inbox">${icon("inbox", "icon-sm")}Ver lo pendiente${needsMe.length ? ` · ${needsMe.length}` : ""}</button></div></div>
          <div class="v4-focus-orb"><span>${needsMe.length}</span><strong>acciones<br>para ti</strong><small>${unreadBudgets ? `${unreadBudgets} presupuesto nuevo` : "Todo al día"}</small></div>
        </section>
        <div class="v4-metric-grid v4-metric-grid-venue">
          ${renderV4Metric("Necesitan tu respuesta", needsMe.length, "Información o decisión", "inbox", needsMe.length ? "warning" : "success", `data-action="navigate" data-page="inbox"`)}
          ${renderV4Metric("Presupuestos", currentBudgets, unreadBudgets ? `${unreadBudgets} sin consultar` : "Todos consultados", "file", unreadBudgets ? "blue" : "", `data-action="navigate" data-page="files"`)}
          ${renderV4Metric("Eventos confirmados", confirmed, "Próximos y realizados", "checkCircle", "success", `data-action="metric-nav" data-page="events" data-filter-key="status" data-filter-value="CONFIRMED"`)}
          ${renderV4Metric("Información pendiente", pendingInfo, "Campos solicitados", "clipboard", pendingInfo ? "violet" : "", `data-action="navigate" data-page="inbox"`)}
        </div>
        <div class="v4-dashboard-layout">
          <section class="card v4-card"><div class="card-header v4-card-header"><div><div class="v4-section-kicker">PRÓXIMA ACCIÓN</div><div class="card-title">Pendiente de ti</div><div class="card-desc">Solo mostramos lo que requiere una actuación por tu parte.</div></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-page="inbox">Ver todo ${icon("arrowRight", "icon-sm")}</button></div><div class="v4-card-body">${needsMe.slice(0, 4).map(event => renderV4WorkRow(event, user)).join("") || renderV4Empty("checkCircle", "No tienes nada pendiente", "Marquee o el cliente tienen ahora la siguiente acción.")}</div></section>
          <aside class="v4-dashboard-aside"><section class="card v4-card"><div class="card-header"><div><div class="card-title">Próximos eventos</div><div class="card-desc">Agenda de ${escapeHtml(venue?.name || "tu finca")}</div></div><button class="btn btn-ghost btn-sm" data-action="navigate" data-page="calendar">Calendario</button></div><div class="v4-mini-agenda">${upcoming.map(renderV4AgendaItem).join("") || renderV4Empty("calendar", "Sin próximos eventos", "Crea una petición para comenzar.")}</div></section><section class="v4-assistance-card"><div>${icon("message")}</div><span><small>¿Necesitas ayuda?</small><strong>Escribe a Marquee dentro del evento</strong><p>La conversación y los archivos quedarán siempre vinculados al expediente correcto.</p></span><button class="btn btn-secondary btn-sm" data-action="navigate" data-page="communications">Abrir comunicación</button></section></aside>
        </div>`;
    }

    const overdue = open.filter(event => isDue(event.nextActionDue)).length;
    const noBudget = open.filter(event => !eventCurrentBudget(event, user)).length;
    const urgent = open.filter(event => ["URGENT", "VERY_URGENT"].includes(event.priority)).length;
    return `
      <section class="v4-welcome">
        <div class="v4-welcome-copy"><div class="eyebrow light">${escapeHtml(today)} · Hola, ${escapeHtml(user.firstName)}</div><h1>Empieza por lo importante.</h1><p>Marquee Flow organiza automáticamente las peticiones para que el equipo sepa qué hacer, quién debe responder y qué documento está vigente.</p><div class="hero-actions"><button class="btn btn-primary v4-hero-primary" data-action="navigate" data-page="inbox">${icon("inbox", "icon-sm")}Abrir mi trabajo · ${needsMe.length}</button><button class="btn btn-glass" data-action="open-command">${icon("search", "icon-sm")}Buscar cualquier cosa <kbd>⌘ K</kbd></button></div></div>
        <div class="v4-pulse-panel"><div class="v4-pulse-head"><span class="v4-live-dot"></span><strong>Operativa de hoy</strong><small>Actualizada ahora</small></div><div class="v4-pulse-grid"><span><strong>${overdue}</strong><small>vencidas</small></span><span><strong>${urgent}</strong><small>urgentes</small></span><span><strong>${waitingVenue}</strong><small>esperando finca</small></span><span><strong>${waitingClient}</strong><small>esperando cliente</small></span></div><button data-action="navigate" data-page="inbox">Resolver pendientes ${icon("arrowRight", "icon-sm")}</button></div>
      </section>
      <div class="v4-metric-grid">
        ${renderV4Metric("Pendiente de mí", needsMe.length, `${overdue} con fecha vencida`, "inbox", "warning", `data-action="navigate" data-page="inbox"`)}
        ${renderV4Metric("Sin presupuesto", noBudget, "Peticiones abiertas", "euro", "violet", `data-action="metric-nav" data-page="events" data-filter-key="budget" data-filter-value="without"`)}
        ${renderV4Metric("Esperando finca", waitingVenue, "Información solicitada", "building", "blue", `data-action="v4-open-inbox-filter" data-filter="venue"`)}
        ${renderV4Metric("Confirmados", confirmed, "Listos para producción", "checkCircle", "success", `data-action="metric-nav" data-page="events" data-filter-key="status" data-filter-value="CONFIRMED"`)}
      </div>
      <div class="v4-dashboard-layout">
        <section class="card v4-card"><div class="card-header v4-card-header"><div><div class="v4-section-kicker">COLA INTELIGENTE</div><div class="card-title">Lo que requiere atención</div><div class="card-desc">Ordenado por fecha límite, urgencia e impacto comercial.</div></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-page="inbox">Abrir mi trabajo ${icon("arrowRight", "icon-sm")}</button></div><div class="v4-card-body">${needsMe.slice(0, 5).map(event => renderV4WorkRow(event, user)).join("") || renderV4Empty("checkCircle", "Todo al día", "No hay acciones pendientes para tu perfil.")}</div></section>
        <aside class="v4-dashboard-aside"><section class="card v4-card"><div class="card-header"><div><div class="card-title">Próximos eventos</div><div class="card-desc">Ordenados por fecha</div></div><button class="btn btn-ghost btn-sm" data-action="navigate" data-page="calendar">Calendario</button></div><div class="v4-mini-agenda">${upcoming.map(renderV4AgendaItem).join("") || renderV4Empty("calendar", "Sin próximos eventos", "No hay eventos abiertos.")}</div></section><section class="v4-system-card"><div class="v4-system-icon">${icon("archive")}</div><div><small>Continuidad del servicio</small><strong>Datos y archivos protegidos</strong><p>Guardado automático, puntos de recuperación y exportación completa preparados.</p></div>${isAdmin(user) ? `<button class="btn btn-secondary btn-sm" data-action="navigate" data-page="backups">Ver copias</button>` : `<span class="badge badge-confirmed">Activo</span>`}</section></aside>
      </div>`;
  };

  function renderV4AgendaItem(event) {
    const budget = eventCurrentBudget(event);
    return `<button class="v4-agenda-item" data-action="open-event" data-id="${event.id}"><span class="v4-agenda-date"><strong>${formatDate(event.eventDate, { day: "2-digit" })}</strong><small>${formatDate(event.eventDate, { month: "short" })}</small></span><span class="v4-agenda-copy"><strong>${escapeHtml(event.eventName)}</strong><small>${escapeHtml(event.estimatedStartTime || "Hora pendiente")} · ${escapeHtml(venueById(event.venueId)?.name || "")}</small></span><span class="v4-agenda-end">${budget ? `<i title="Presupuesto vigente">${icon("file", "icon-sm")}</i>` : ""}${priorityBadge(event.priority)}${icon("arrowRight", "icon-sm")}</span></button>`;
  }

  function renderV4Empty(iconName, title, text) {
    return `<div class="v4-empty"><span>${icon(iconName, "icon-lg")}</span><div><strong>${escapeHtml(title)}</strong><p>${escapeHtml(text)}</p></div></div>`;
  }

  function renderV4WorkRow(event, user = currentUser()) {
    const venue = venueById(event.venueId);
    const budget = eventCurrentBudget(event, user);
    const pendingInfo = pendingInfoCount(event, user.role === "VENUE_USER" ? "VENUE" : null);
    const dueClass = isDue(event.nextActionDue) ? "overdue" : daysFromToday(event.nextActionDue) <= 1 ? "soon" : "";
    const actionLabel = user.role === "VENUE_USER" ? (isBudgetUnread(event, user) ? "Abrir presupuesto" : pendingInfo ? "Completar información" : "Abrir evento") : "Resolver";
    const tab = user.role === "VENUE_USER" && isBudgetUnread(event, user) ? "budgets" : pendingInfo ? "tasks" : "summary";
    return `<article class="v4-work-row ${dueClass}">
      <button class="v4-work-main" data-action="open-event-tab" data-id="${event.id}" data-tab="${tab}"><span class="v4-priority-rail priority-${event.priority}"></span><span class="v4-work-date"><strong>${formatDate(event.eventDate, { day: "2-digit" })}</strong><small>${formatDate(event.eventDate, { month: "short" })}</small></span><span class="v4-work-copy"><span class="v4-work-top">${waitingOnBadge(event, true)}<em class="${dueClass}">${escapeHtml(dueText(event.nextActionDue))}</em></span><strong>${escapeHtml(event.eventName)}</strong><small>${escapeHtml(venue?.name || "")} · ${escapeHtml(event.finalClient || "Cliente pendiente")}</small><p>${escapeHtml(event.nextAction || "Revisar expediente")}</p></span></button>
      <div class="v4-work-meta">${budget ? `<button class="v4-file-chip ${isBudgetUnread(event, user) ? "unread" : ""}" data-action="v4-preview-budget" data-event-id="${event.id}" data-budget-id="${budget.id}">${icon("file", "icon-sm")}${isBudgetUnread(event, user) ? "Nuevo" : `V${budget.version}`}</button>` : `<span class="v4-file-chip empty">€ Sin presupuesto</span>`}${pendingInfo ? `<span class="v4-count-chip">${pendingInfo} dato${pendingInfo === 1 ? "" : "s"}</span>` : ""}<button class="btn btn-primary btn-sm" data-action="open-event-tab" data-id="${event.id}" data-tab="${tab}">${actionLabel} ${icon("arrowRight", "icon-sm")}</button></div>
    </article>`;
  }

  function renderV4Inbox() {
    const user = currentUser();
    const filters = user.role === "VENUE_USER"
      ? [["mine", "Para mí", "inbox"], ["budget", "Presupuestos nuevos", "file"], ["information", "Información pendiente", "clipboard"], ["upcoming", "Próximos 30 días", "calendar"]]
      : [["mine", "Para mí", "inbox"], ["overdue", "Vencidas", "warning"], ["venue", "Esperando finca", "building"], ["client", "Esperando cliente", "users"], ["unassigned", "Sin responsable", "users"]];
    if (!filters.some(item => item[0] === app.v4InboxFilter)) app.v4InboxFilter = "mine";
    const rows = v4Queue(user, app.v4InboxFilter);
    const counts = Object.fromEntries(filters.map(([key]) => [key, v4Queue(user, key).length]));
    const title = user.role === "VENUE_USER" ? "Pendiente de mí" : "Mi trabajo";
    const description = user.role === "VENUE_USER" ? "Todo lo que necesita una respuesta, un dato o una decisión por parte de tu finca." : "Una cola única con las acciones comerciales y operativas que requieren atención.";
    return `${v4PageHead(title, description, `<button class="btn btn-secondary" data-action="open-command">${icon("search", "icon-sm")}Buscar expediente</button><button class="btn btn-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}${user.role === "VENUE_USER" ? "Nueva petición" : "Nuevo evento"}</button>`, "TRABAJO GUIADO")}
      <section class="v4-inbox-summary"><div><span class="v4-inbox-orb">${rows.length}</span><div><small>${user.role === "VENUE_USER" ? "ACCIONES PARA TU FINCA" : "ACCIONES EN ESTA VISTA"}</small><strong>${rows.length ? "Empieza por la primera" : "Todo está al día"}</strong><p>${rows.length ? "La lista está ordenada por fecha límite y prioridad." : "No hay ningún expediente que requiera tu actuación ahora mismo."}</p></div></div><div class="v4-inbox-health"><span><i class="success"></i>Guardado automático</span><span><i class="success"></i>Permisos por finca</span><span><i class="success"></i>Histórico activo</span></div></section>
      <div class="v4-filter-bar"><div class="v4-filter-tabs">${filters.map(([key, label, iconName]) => `<button class="v4-filter-tab ${app.v4InboxFilter === key ? "active" : ""}" data-action="v4-inbox-filter" data-filter="${key}">${icon(iconName, "icon-sm")}<span>${escapeHtml(label)}</span><strong>${counts[key]}</strong></button>`).join("")}</div><div class="v4-filter-search">${icon("search", "icon-sm")}<input id="v4-queue-search" placeholder="Filtrar esta lista…" value="${escapeHtml(app.v4QueueSearch)}"></div></div>
      <section class="card v4-inbox-card"><div class="v4-inbox-list">${rows.map(event => renderV4WorkRow(event, user)).join("") || renderV4Empty("checkCircle", "No hay acciones en esta vista", user.role === "VENUE_USER" ? "Puedes consultar el calendario o crear una nueva petición." : "Cambia de filtro para consultar expedientes que están esperando a otra parte.")}</div></section>
      ${user.role !== "VENUE_USER" ? `<div class="v4-work-legend"><span>${icon("briefcase", "icon-sm")}Esperando a Marquee: requiere trabajo interno</span><span>${icon("building", "icon-sm")}Esperando finca: se ha solicitado información</span><span>${icon("users", "icon-sm")}Esperando cliente/agencia: seguimiento comercial</span><span>${icon("checkCircle", "icon-sm")}Sin bloqueo: expediente en curso</span></div>` : ""}`;
  }

  function renderNewEvent() {

            </section>

              <div class="v4-template-grid">${Object.entries(EVENT_TEMPLATES).map(([key,tpl]) => `<button type="button" class="v4-template-card ${d.eventType === key ? "selected" : ""}" data-action="v4-use-template" data-template="${key}"><span>${icon(tpl.icon)}</span><strong>${tpl.title}</strong><small>${tpl.subtitle}</small></button>`).join("")}</div>
              <div class="v4-services"><label class="label">Servicios habituales</label><div class="v4-service-chips">${services.map(service => `<button type="button" data-action="v4-add-service" data-service="${escapeHtml(service)}">${icon("plus", "icon-sm")}${escapeHtml(service)}</button>`).join("")}</div></div>

  function v4DraftFromForm() {
    const form = document.getElementById("new-event-form");
    if (!form) return app.v4WizardDraft || {};
    return { ...app.v4WizardDraft, ...formObject(form) };
  }

  function saveV4Draft(data = v4DraftFromForm()) {
    app.v4WizardDraft = data;
    try { localStorage.setItem(V4_DRAFT_KEY, JSON.stringify(data)); } catch { /* solo sesión */ }
  }

  function renderV4Contacts() {
    const user = currentUser();
    if (!isOps(user)) return renderDashboard();
    const contacts = [];
    for (const event of visibleEvents(user)) {
      const name = [event.contactFirstName, event.contactLastName].filter(Boolean).join(" ");
      if (!name && !event.email && !event.phone) continue;
      const key = (event.email || event.phone || name).toLowerCase();
      let contact = contacts.find(item => item.key === key);
      if (!contact) {
        contact = { key, name: name || "Contacto pendiente", email: event.email, phone: event.phone, agency: event.agency, client: event.finalClient, events: [] };
        contacts.push(contact);
      }
      contact.events.push(event);
    }
    for (const venue of app.data.venues) {
      const key = `venue-${venue.id}`;
      contacts.push({ key, name: venue.contactName || venue.name, email: venue.email, phone: venue.phone, agency: "", client: venue.name, venue, events: visibleEvents(user).filter(e => e.venueId === venue.id) });
    }
    const query = String(app.v4ContactQuery || "").toLowerCase();
    const filtered = contacts.filter(contact => !query || [contact.name, contact.email, contact.phone, contact.agency, contact.client].filter(Boolean).join(" ").toLowerCase().includes(query));
    return `${v4PageHead("Contactos", "Agenda unificada de fincas, agencias y clientes vinculada a sus eventos.", `<button class="btn btn-secondary" data-action="navigate" data-page="events">${icon("calendar", "icon-sm")}Ver eventos</button>`, "AGENDA COMERCIAL")}
      <div class="v4-contacts-toolbar"><div class="v4-filter-search wide">${icon("search", "icon-sm")}<input id="v4-contact-search" placeholder="Buscar por nombre, empresa, agencia, email o teléfono…" value="${escapeHtml(app.v4ContactQuery)}"></div><div class="v4-contact-count"><strong>${filtered.length}</strong><span>contactos encontrados</span></div></div>
      <div class="v4-contact-grid">${filtered.map(contact => { const latest = contact.events.slice().sort((a,b) => b.eventDate.localeCompare(a.eventDate))[0]; return `<article class="card v4-contact-card"><div class="v4-contact-top"><div class="v4-contact-avatar ${contact.venue ? "venue" : ""}">${contact.venue ? icon("building") : escapeHtml(contact.name.split(" ").map(part => part[0]).join("").slice(0,2).toUpperCase())}</div><div><div class="row-wrap"><strong>${escapeHtml(contact.name)}</strong>${contact.venue ? `<span class="badge badge-confirmed">Finca</span>` : contact.agency ? `<span class="badge badge-info">Agencia</span>` : `<span class="badge badge-neutral">Cliente</span>`}</div><p>${escapeHtml(contact.agency || contact.client || "Sin empresa asociada")}</p></div></div><div class="v4-contact-lines">${contact.email ? `<a href="mailto:${escapeHtml(contact.email)}">${icon("mail", "icon-sm")}<span>${escapeHtml(contact.email)}</span></a>` : ""}${contact.phone ? `<a href="tel:${escapeHtml(contact.phone)}">${icon("phone", "icon-sm")}<span>${escapeHtml(contact.phone)}</span></a>` : ""}</div><div class="v4-contact-events"><span><strong>${contact.events.length}</strong> evento${contact.events.length === 1 ? "" : "s"}</span>${latest ? `<button data-action="open-event" data-id="${latest.id}">Último: ${escapeHtml(latest.eventName)} ${icon("arrowRight", "icon-sm")}</button>` : ""}</div></article>`; }).join("") || renderV4Empty("users", "No hay contactos", "Prueba con otro término de búsqueda.")}</div>`;
  }

  renderVenues = function() {
    const user = currentUser();
    if (!isOps(user)) return renderDashboard();
    const venues = app.data.venues.filter(v => v.state === "ACTIVE");
    return `${v4PageHead("Fincas", "Cada espacio dispone de calendario, usuarios, histórico y memoria técnica propia.", isAdmin(user) ? `<button class="btn btn-primary" data-action="new-venue">${icon("plus", "icon-sm")}Nueva finca</button>` : "", "ESPACIOS DE TRABAJO")}
      <div class="v4-venue-grid">${venues.map(venue => { const metrics = venueMetrics(venue.id); const profile = venue.technicalProfile || {}; const events = app.data.events.filter(e => !e.deletedAt && e.venueId === venue.id); const pending = events.filter(e => ACTIVE_STATUSES.includes(e.status)).length; return `<article class="card v4-venue-card"><div class="v4-venue-cover"><div class="v4-venue-monogram">${escapeHtml(venue.name.split(" ").map(x => x[0]).join("").slice(0,2))}</div><div class="v4-venue-cover-copy"><span>${escapeHtml(venue.municipality || "Málaga")}</span><h2>${escapeHtml(venue.name)}</h2><p>${escapeHtml([venue.address, venue.province].filter(Boolean).join(" · "))}</p></div><div class="v4-tech-score"><strong>${profile.completeness || 0}%</strong><span>ficha técnica</span></div></div><div class="v4-venue-stats"><span><strong>${metrics.upcoming}</strong><small>próximos</small></span><span><strong>${pending}</strong><small>abiertos</small></span><span><strong>${metrics.confirmed}</strong><small>confirmados</small></span></div><div class="v4-venue-contact"><span>${icon("users", "icon-sm")}<div><small>Contacto</small><strong>${escapeHtml(venue.contactName || "Pendiente")}</strong></div></span><span>${icon("phone", "icon-sm")}<div><small>Teléfono</small><strong>${escapeHtml(venue.phone || "Pendiente")}</strong></div></span></div><div class="v4-tech-chips"><span>${icon("briefcase", "icon-sm")}${escapeHtml(profile.loadingAccess ? "Acceso definido" : "Acceso pendiente")}</span><span>${icon("wifi", "icon-sm")}${escapeHtml(profile.wifi ? "Internet documentado" : "Internet pendiente")}</span><span>${icon("sparkles", "icon-sm")}${escapeHtml(profile.soundRestrictions ? "Límites acústicos" : "Sin límites cargados")}</span></div><div class="v4-venue-actions"><button class="btn btn-secondary" data-action="v4-open-venue-tech" data-id="${venue.id}">${icon("clipboard", "icon-sm")}Ficha técnica</button><button class="btn btn-primary" data-action="filter-by-venue" data-id="${venue.id}">${icon("calendar", "icon-sm")}Ver eventos</button>${isAdmin(user) ? `<button class="btn btn-ghost btn-icon" data-action="edit-venue" data-id="${venue.id}" aria-label="Editar finca">${icon("edit")}</button>` : ""}</div></article>`; }).join("")}</div>`;
  };

  renderMyVenue = function() {
    const user = currentUser();
    if (user.role !== "VENUE_USER") return renderVenues();
    const venue = venueById(user.venueId);
    const profile = venue.technicalProfile || {};
    const events = visibleEvents(user).filter(e => daysFromToday(e.eventDate) >= 0).sort((a,b) => a.eventDate.localeCompare(b.eventDate));
    return `${v4PageHead("Mi finca", "Información comercial y técnica que Marquee reutiliza para preparar cada evento con mayor rapidez.", `<button class="btn btn-primary" data-action="navigate" data-page="new-event">${icon("plus", "icon-sm")}Nueva petición</button>`, "ESPACIO COMPARTIDO")}
      <section class="v4-venue-profile-hero"><div><span>${escapeHtml(venue.municipality || "Finca")}</span><h1>${escapeHtml(venue.name)}</h1><p>${escapeHtml([venue.address, venue.province].filter(Boolean).join(" · "))}</p><div class="row-wrap"><a class="btn btn-glass" href="tel:${escapeHtml(venue.phone || "")}">${icon("phone", "icon-sm")}Llamar</a><a class="btn btn-glass" href="mailto:${escapeHtml(venue.email || "")}">${icon("mail", "icon-sm")}Email</a></div></div><div class="v4-tech-ring" style="--progress:${(profile.completeness || 0) * 3.6}deg"><span><strong>${profile.completeness || 0}%</strong><small>Ficha técnica</small></span></div></section>
      <div class="v4-venue-profile-layout"><section class="card v4-card"><div class="card-header"><div><div class="card-title">Memoria técnica permanente</div><div class="card-desc">Esta información evita repetir los mismos datos en cada petición.</div></div></div><div class="v4-tech-detail-grid">${[["Espacios",profile.spaces,"layers"],["Acceso y descarga",profile.loadingAccess,"briefcase"],["Horario de carga",profile.loadingHours,"clock"],["Potencia eléctrica",profile.power,"sparkles"],["Restricciones de sonido",profile.soundRestrictions,"warning"],["Altura",profile.ceilingHeight,"arrowUp"],["Internet",profile.wifi,"wifi"],["Escenario",profile.stage,"target"]].map(([label,value,iconName]) => `<article><span>${icon(ICONS[iconName] ? iconName : "clipboard")}</span><div><small>${escapeHtml(label)}</small><strong>${escapeHtml(value || "Información pendiente")}</strong></div></article>`).join("")}</div><div class="v4-tech-note"><strong>Observaciones de producción</strong><p>${escapeHtml(profile.notes || venue.observations || "Sin observaciones")}</p></div></section><aside class="v4-dashboard-aside"><section class="card v4-card"><div class="card-header"><div><div class="card-title">Próximos eventos</div><div class="card-desc">${events.length} en calendario</div></div><button class="btn btn-ghost btn-sm" data-action="navigate" data-page="calendar">Ver agenda</button></div><div class="v4-mini-agenda">${events.slice(0,5).map(renderV4AgendaItem).join("") || renderV4Empty("calendar", "Sin eventos próximos", "Crea una nueva petición.")}</div></section><section class="v4-tip-card">${icon("clipboard")}<div><strong>Una ficha técnica compartida</strong><p>Marquee puede presupuestar más rápido y detectar incompatibilidades antes del evento.</p></div></section></aside></div>`;
  };

  function renderOverlayV4Header(event, user) {
    const venue = venueById(event.venueId);
    const budget = eventCurrentBudget(event, user);
    const commercial = userById(event.assignedCommercialId);
    const dueClass = isDue(event.nextActionDue) ? "overdue" : "";
    return `<div class="drawer-head v4-drawer-head"><div class="v4-drawer-topline"><div class="v4-drawer-location">${icon("building", "icon-sm")}<span>${escapeHtml(venue?.name || "")}</span><b>·</b><span>${formatDateLong(event.eventDate)}</span></div><div class="v4-drawer-actions">${budget ? `<button class="btn btn-secondary btn-sm" data-action="v4-preview-budget" data-event-id="${event.id}" data-budget-id="${budget.id}">${icon("eye", "icon-sm")}Ver presupuesto vigente</button>` : ""}<button class="close-btn" data-action="close-event" aria-label="Cerrar">${icon("close")}</button></div></div><div class="v4-drawer-title-row"><div class="v4-event-symbol">${escapeHtml((event.finalClient || event.eventName || "EV").slice(0,2).toUpperCase())}</div><div><div class="row-wrap">${priorityBadge(event.priority)}${user.role === "VENUE_USER" ? `<span class="badge badge-info">${escapeHtml(publicStageLabel(event))}</span>` : statusBadge(event.status)}</div><h2 class="drawer-title">${escapeHtml(event.eventName)}</h2><div class="drawer-sub">${escapeHtml(event.finalClient || "Cliente pendiente")} · ${escapeHtml(eventTime(event))} · ${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Asistentes pendientes"}</div></div></div><div class="v4-command-strip"><div class="v4-command-primary ${dueClass}"><span>${icon("target")}</span><div><small>SIGUIENTE ACCIÓN</small><strong>${escapeHtml(event.nextAction || "Revisar expediente")}</strong></div><em>${escapeHtml(dueText(event.nextActionDue))}</em></div><div class="v4-command-meta">${waitingOnBadge(event)}<span>${icon("briefcase", "icon-sm")}<div><small>Responsable</small><strong>${escapeHtml(commercial ? `${commercial.firstName} ${commercial.lastName}` : "Sin asignar")}</strong></div></span><span>${icon("file", "icon-sm")}<div><small>Presupuesto vigente</small><strong>${escapeHtml(budget ? `${budget.displayName} · V${budget.version}` : "No disponible")}</strong></div></span></div></div>`;
  }

  renderOverlay = function() {
    const root = document.getElementById("overlay-root");
    if (!root) return;
    const event = eventById(app.selectedEventId);
    const user = currentUser();
    if (!event || !canAccessEvent(event, user)) {
      app.selectedEventId = null;
      root.innerHTML = "";
      return;
    }
    ensureV4Data();
    const tabs = [
      ["summary", "Resumen", "dashboard"], ["comments", `Comunicación${event.comments.length ? ` · ${event.comments.length}` : ""}`, "message"], ["budgets", `Presupuestos · ${visibleBudgets(event,user).length}`, "file"], ["documents", `Documentos · ${visibleDocuments(event,user).length}`, "paperclip"], ["tasks", `Tareas · ${pendingTaskCount(event) + pendingInfoCount(event)}`, "clipboard"], ["audiovisual", "Datos técnicos", "sparkles"]
    ];
    if (isOps(user)) tabs.push(["notes", `Notas internas · ${event.internalNotes.length}`, "lock"]);
    tabs.push(["history", "Histórico", "history"]);
    if (!tabs.some(([key]) => key === app.selectedEventTab)) app.selectedEventTab = "summary";
    root.innerHTML = `<div class="overlay pro-overlay v4-overlay" data-action="close-event"><aside class="drawer pro-drawer v4-drawer" role="dialog" aria-modal="true" aria-label="Espacio de trabajo del evento" data-drawer-stop>
      ${renderOverlayV4Header(event, user)}
      <div class="v4-drawer-tabs">${tabs.map(([key,label,iconName]) => `<button class="tab-btn ${app.selectedEventTab === key ? "active" : ""}" data-action="event-tab" data-tab="${key}">${icon(iconName, "icon-sm")}<span>${escapeHtml(label)}</span></button>`).join("")}</div>
      <div class="drawer-body v4-drawer-body">${renderEventTab(event, user)}</div>
    </aside></div>`;
  };

  renderEventTab = function(event, user) {
    switch (app.selectedEventTab) {
      case "audiovisual": return renderEventAudiovisual(event);
      case "budgets": return renderEventBudgetsV4(event, user);
      case "documents": return renderEventDocuments(event, user);
      case "comments": return renderEventComments(event);
      case "tasks": return renderEventTasksV4(event, user);
      case "notes": return isOps(user) ? renderEventNotes(event) : renderEventSummaryV4(event, user);
      case "history": return renderEventHistory(event, user);
      default: return renderEventSummaryV4(event, user);
    }
  };

      <section class="drawer-section v4-detail-section"><div class="section-head"><div><div class="section-title">Información del evento</div><div class="card-desc">Datos de referencia para todas las partes.</div></div>${isOps(user) || ACTIVE_STATUSES.includes(event.status) ? `<button class="btn btn-secondary btn-sm" data-action="edit-event" data-id="${event.id}">${icon("edit", "icon-sm")}Editar</button>` : ""}</div><div class="v4-detail-grid"><article><span>${icon("building")}</span><div><small>Finca</small><strong>${escapeHtml(venue?.name || "Pendiente")}</strong><p>${escapeHtml(venue?.municipality || "")}</p></div></article><article><span>${icon("calendar")}</span><div><small>Fecha y horario</small><strong>${formatDateLong(event.eventDate)}</strong><p>${escapeHtml(eventTime(event))}</p></div></article><article><span>${icon("people")}</span><div><small>Cliente y asistentes</small><strong>${escapeHtml(event.finalClient || "Cliente pendiente")}</strong><p>${event.numberOfPeople ? `${event.numberOfPeople} pax` : "Asistentes pendientes"}</p></div></article><article><span>${icon("users")}</span><div><small>Contacto</small><strong>${escapeHtml([event.contactFirstName,event.contactLastName].filter(Boolean).join(" ") || "Pendiente")}</strong><p>${escapeHtml(event.phone || event.email || "Sin datos")}</p></div></article></div></section>

otificación cuando se publique." : "Añade el primer presupuesto y decide si se comparte con la finca como borrador, enviado o final."}</p></div>${canUpload ? `<button class="btn btn-primary" data-action="open-upload-modal" data-kind="BUDGET" data-event-id="${event.id}">${icon("upload", "icon-sm")}Añadir presupuesto</button>` : ""}</section>`}

      <section class="drawer-section"><div class="section-head"><div><div class="section-title">Histórico de versiones</div><div class="card-desc">Nunca se sobrescribe un presupuesto anterior.</div></div></div><div class="v4-budget-version-list">${budgets.map((budget,index) => { const uploader = userById(budget.uploadedById); const isCurrent = current?.id === budget.id; return `<article class="v4-budget-version ${isCurrent ? "current" : ""}"><span class="v4-version-number">V${budget.version}</span><div><div class="row-wrap"><strong>${escapeHtml(budget.displayName)}</strong>${isCurrent ? `<span class="badge badge-confirmed">Vigente</span>` : `<span class="badge badge-neutral">Sustituido</span>`}${budgetBadge(budget.status)}</div><p>${escapeHtml(budget.description || "Sin descripción")}</p><small>${escapeHtml(uploader ? `${uploader.firstName} ${uploader.lastName}` : "Sistema")} · ${formatDateTime(budget.createdAt)} · ${formatBytes(budget.sizeBytes)}</small></div><div class="v4-version-actions"><button class="btn btn-secondary btn-icon btn-sm" data-action="v4-preview-budget" data-event-id="${event.id}" data-budget-id="${budget.id}" title="Vista previa">${icon("eye", "icon-sm")}</button><button class="btn btn-secondary btn-icon btn-sm" data-action="v4-download-budget" data-event-id="${event.id}" data-budget-id="${budget.id}" title="Descargar">${icon("download", "icon-sm")}</button></div></article>`; }).join("") || renderV4Empty("file", "Sin versiones", "El primer presupuesto aparecerá aquí.")}</div></section>`;

  function renderEventTasksV4(event, user) {
    const tasks = event.tasks || [];

    const pendingInfos = infos.filter(item => !item.done).length;

      <section class="drawer-section"><div class="section-head"><div><div class="section-title">Información solicitada</div><div class="card-desc">Datos concretos que una parte necesita para continuar.</div></div>${isOps(user) ? `<span class="badge badge-info">${pendingInfos} pendientes</span>` : ""}</div><div class="v4-checklist">${infos.map(item => { const canToggle = isOps(user) || (user.role === "VENUE_USER" && item.assignedTo === "VENUE"); return `<article class="v4-check-item ${item.done ? "done" : ""}"><button ${canToggle ? `data-action="v4-toggle-info" data-event-id="${event.id}" data-id="${item.id}"` : "disabled"} class="v4-check-button">${icon(item.done ? "checkCircle" : "circle")}</button><div><div class="row-wrap"><strong>${escapeHtml(item.label)}</strong><span class="v4-assignee ${item.assignedTo.toLowerCase()}">${escapeHtml(item.assignedTo === "VENUE" ? "Finca" : item.assignedTo === "AGENCY" ? "Agencia" : item.assignedTo === "CLIENT" ? "Cliente" : "Marquee")}</span></div><p>${item.done ? `Completado ${relativeTime(item.completedAt || nowIso())}` : dueText(item.dueDate)}</p></div></article>`; }).join("") || renderV4Empty("checkCircle", "No hay información solicitada", "El expediente no está bloqueado por falta de datos.")}</div>${isOps(user) ? `<form id="v4-info-request-form" class="v4-add-row"><input type="hidden" name="eventId" value="${event.id}"><input class="field" name="label" placeholder="Solicitar un dato concreto…" required><select class="select" name="assignedTo"><option value="VENUE">A la finca</option><option value="CLIENT">Al cliente</option><option value="AGENCY">A la agencia</option><option value="MARQUEE">A Marquee</option></select><input class="field" type="date" name="dueDate" value="${v4DateOffset(2)}"><button class="btn btn-primary" type="submit">${icon("plus", "icon-sm")}Solicitar</button></form>` : ""}</section>
      <section class="drawer-section"><div class="section-head"><div><div class="section-title">Tareas del equipo</div><div class="card-desc">Acciones de seguimiento, presupuesto y producción.</div></div><span class="badge badge-neutral">${pendingTasks} pendientes</span></div><div class="v4-checklist">${tasks.map(item => { const canToggle = isOps(user) || (user.role === "VENUE_USER" && item.assignedTo === "VENUE"); return `<article class="v4-check-item ${item.done ? "done" : ""}"><button ${canToggle ? `data-action="v4-toggle-task" data-event-id="${event.id}" data-id="${item.id}"` : "disabled"} class="v4-check-button">${icon(item.done ? "checkCircle" : "circle")}</button><div><div class="row-wrap"><strong>${escapeHtml(item.title)}</strong><span class="v4-assignee ${item.assignedTo.toLowerCase()}">${escapeHtml(item.assignedTo === "VENUE" ? "Finca" : "Marquee")}</span></div><p>${item.done ? `Completada ${relativeTime(item.completedAt || nowIso())}` : dueText(item.dueDate)}</p></div></article>`; }).join("") || renderV4Empty("checkCircle", "No hay tareas", "Añade una acción de seguimiento.")}</div>${isOps(user) ? `<form id="v4-task-form" class="v4-add-row"><input type="hidden" name="eventId" value="${event.id}"><input class="field" name="title" placeholder="Añadir una tarea…" required><select class="select" name="assignedTo"><option value="MARQUEE">Marquee</option><option value="VENUE">Finca</option></select><input class="field" type="date" name="dueDate" value="${v4DateOffset(2)}"><button class="btn btn-primary" type="submit">${icon("plus", "icon-sm")}Añadir</button></form>` : ""}</section>

  }

  function renderBudgetDocumentPreview(event, budget) {
    const pax = Number(event.numberOfPeople || 180);
    const net = Math.max(3200, Math.round((2850 + pax * 7.5) / 50) * 50);
    const sound = Math.round(net * 0.29 / 10) * 10;
    const light = Math.round(net * 0.22 / 10) * 10;
    const video = Math.round(net * 0.31 / 10) * 10;
    const crew = net - sound - light - video;
    const vat = Math.round(net * 0.21 * 100) / 100;
    const total = net + vat;
    const money = value => new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(value);
    const venue = venueById(event.venueId);
    const budgetCode = `MQ-${String(event.eventDate || "2026").slice(0,4)}-${String(event.id || "EVENTO").replace(/[^a-z0-9]/gi, "").slice(-4).toUpperCase()}-V${budget.version}`;
    const lines = [
      ["Sonido profesional y microfonía", "Sistema adaptado al aforo, control digital y microfonía inalámbrica.", sound],
      ["Iluminación ambiente y escénica", "Diseño lumínico, programación y equipamiento de apoyo.", light],
      ["Vídeo, pantallas y contenidos", "Solución visual y distribución de señal según briefing del evento.", video],
      ["Equipo técnico, montaje y operación", "Personal especializado, pruebas, montaje y desmontaje.", crew]
    ];
    return `<div class="v4-pdf-viewer"><div class="v4-pdf-toolbar"><span>${icon("search", "icon-sm")}Vista previa optimizada</span><span>1 / 1</span><span>100%</span></div><article class="v4-pdf-paper">
      <header class="v4-pdf-paper-head"><img src="${LOGO_DARK}" alt="Marquee Audiovisuales"><div><small>PROPUESTA AUDIOVISUAL</small><strong>${escapeHtml(budgetCode)}</strong><span>${formatDateLong(String(budget.uploadedAt || nowIso()).slice(0,10))}</span></div></header>
      <section class="v4-pdf-title"><div><span>PRESUPUESTO · VERSIÓN ${budget.version}</span><h2>${escapeHtml(event.eventName)}</h2><p>${escapeHtml(event.finalClient || event.agency || "Cliente corporativo")} · ${escapeHtml(venue?.name || "Finca")}</p></div><div class="v4-pdf-status"><small>ESTADO</small><strong>${budget.isCurrent ? "Vigente" : "Versión anterior"}</strong><span>${escapeHtml(BUDGET_STATUS[budget.status] || budget.status || "Compartido")}</span></div></section>
      <section class="v4-pdf-meta"><div><small>FECHA DEL EVENTO</small><strong>${formatDateLong(event.eventDate)}</strong></div><div><small>HORARIO</small><strong>${escapeHtml(event.estimatedStartTime || "--:--")} – ${escapeHtml(event.estimatedEndTime || "--:--")}</strong></div><div><small>ASISTENTES</small><strong>${pax} personas</strong></div><div><small>CONTACTO</small><strong>${escapeHtml(`${event.contactFirstName || ""} ${event.contactLastName || ""}`.trim() || "Pendiente")}</strong></div></section>
      <section class="v4-pdf-scope"><small>ALCANCE DE LA PROPUESTA</small><p>${escapeHtml(budget.description || event.audiovisualRequest || "Producción audiovisual integral adaptada a las necesidades del evento.")}</p></section>
      <section class="v4-pdf-table"><div class="v4-pdf-table-head"><span>Concepto</span><span>Ud.</span><span>Importe</span></div>${lines.map(([title,desc,amount]) => `<div class="v4-pdf-table-row"><div><strong>${escapeHtml(title)}</strong><small>${escapeHtml(desc)}</small></div><span>1</span><strong>${money(amount)}</strong></div>`).join("")}</section>
      <section class="v4-pdf-bottom"><div class="v4-pdf-conditions"><small>CONDICIONES</small><p>Validez de la propuesta: 15 días. Importes sujetos a revisión si cambian fecha, aforo, horario o necesidades técnicas. Documento demostrativo para revisar el flujo de la plataforma.</p></div><div class="v4-pdf-totals"><span><small>Base imponible</small><strong>${money(net)}</strong></span><span><small>IVA 21 %</small><strong>${money(vat)}</strong></span><span class="total"><small>TOTAL</small><strong>${money(total)}</strong></span></div></section>
      <footer class="v4-pdf-paper-foot"><span>MARQUEE PRODUCCIONES Y AUDIOVISUALES, S.L.</span><span>Documento vinculado al expediente · ${escapeHtml(budget.displayName)}</span></footer>
    </article></div>`;
  }

  function renderV4Modal() {
    if (!app.v4Modal) return "";
    const modal = app.v4Modal;
    if (modal.type === "budgetPreview") {
      const event = eventById(modal.eventId);
      const budget = event?.budgets.find(item => item.id === modal.budgetId);
      if (!event || !budget || !canAccessEvent(event)) return "";
      return `<div class="modal-layer v4-preview-layer" data-action="v4-close-modal"><section class="v4-preview-modal" data-v4-modal-stop><header><div><span class="v4-pdf-mini">PDF</span><div><small>PRESUPUESTO · ${escapeHtml(event.eventName)}</small><strong>${escapeHtml(budget.displayName)} · V${budget.version}</strong></div></div><div class="row-wrap"><button class="btn btn-secondary" data-action="v4-download-budget" data-event-id="${event.id}" data-budget-id="${budget.id}">${icon("download", "icon-sm")}Descargar</button><button class="close-btn" data-action="v4-close-modal">${icon("close")}</button></div></header><div class="v4-preview-body">${renderBudgetDocumentPreview(event, budget)}</div><footer><span>${icon("lock", "icon-sm")}Documento accesible según permisos del evento</span><span>Versión vigente: <strong>${budget.isCurrent ? "Sí" : "No"}</strong></span></footer></section></div>`;
    }
    if (modal.type === "venueTech") {
      const venue = venueById(modal.venueId);

    if (!target) return;
    const action = target.dataset.action;
    if (action === "close-event" && target.classList.contains("overlay") && event.target.closest("[data-drawer-stop]")) return;
    if (action === "close-modal" && target.classList.contains("modal-layer") && event.target.closest("[data-modal-stop]")) return;
    event.preventDefault();

    switch (action) {
      case "select-login-profile":
        app.loginProfile = target.dataset.profile;
        renderLogin();
        break;
      case "navigate":
        navigate(target.dataset.page);
        break;
      case "open-mobile-menu": openMobileMenu(); break;
      case "close-mobile-menu": closeMobileMenu(); break;
      case "logout":
        app.session = null; saveSession(null); app.selectedEventId = null; app.modal = null; renderLogin();
        break;
      case "reset-demo":
        app.modal = { type: "confirmReset" }; renderShell();
        break;
      case "confirm-reset-demo":
        try { localStorage.removeItem(DATA_KEY); } catch { /* noop */ } await clearFileDb(); app.data = seedData(); saveData(); app.modal = null; app.selectedEventId = null; renderShell(); toast("Demo reiniciada", "Se han restaurado todos los datos iniciales.", "success");
        break;
      case "metric-nav": {
        const key = target.dataset.filterKey;
        app.eventFilters = { q: "", venue: "", status: "", priority: "", budget: "", open: "" };
        if (key) app.eventFilters[key] = target.dataset.filterValue || "";
        navigate(target.dataset.page);
        break;
      }
      case "clear-filters":
        app.eventFilters = { q: "", venue: "", status: "", priority: "", budget: "", open: "" }; renderShell();
        break;
      case "sort-events":
        if (app.eventSort.key === target.dataset.key) app.eventSort.direction = app.eventSort.direction === "asc" ? "desc" : "asc";
        else app.eventSort = { key: target.dataset.key, direction: "asc" };
        renderShell();
        break;
      case "open-event": {
        const selected = eventById(target.dataset.id);
        if (!canAccessEvent(selected)) return toast("Acceso denegado", "Este evento pertenece a otra finca.", "error");
        app.selectedEventId = selected.id; app.selectedEventTab = "summary"; renderShell();
        break;
      }
      case "open-event-tab": {
        const selected = eventById(target.dataset.id);
        if (!canAccessEvent(selected)) return toast("Acceso denegado", "Este evento pertenece a otra finca.", "error");
        app.selectedEventId = selected.id; app.selectedEventTab = target.dataset.tab || "summary"; renderShell();
        break;
      }
      case "close-event":
        app.selectedEventId = null; renderShell();
        break;
      case "event-tab":
        app.selectedEventTab = target.dataset.tab; renderShell();
        break;
      case "edit-event":
        app.modal = { type: "editEvent", id: target.dataset.id }; renderShell();
        break;
      case "duplicate-event": duplicateEvent(target.dataset.id); break;
      case "delete-event": app.modal = { type: "confirmDeleteEvent", id: target.dataset.id }; renderShell(); break;
      case "confirm-delete-event": {
        const item = eventById(target.dataset.id);
        if (!item || !isAdmin()) break;
        item.deletedAt = nowIso(); item.updatedAt = nowIso(); item.history.unshift(makeHistory(currentUser().id, "El administrador eliminó el evento", "DELETED"));
        addAudit("DELETE", "EVENT", item.id); saveData(); app.modal = null; app.selectedEventId = null; renderShell(); toast("Evento eliminado", "Se conserva la trazabilidad en auditoría.", "success");
        break;
      }
      case "download-budget": {
        const item = eventById(target.dataset.eventId);
        const budget = item?.budgets.find(b => b.id === target.dataset.budgetId);
        if (!item || !budget || !visibleBudgets(item).some(b => b.id === budget.id)) return toast("Acceso denegado", "No puedes descargar esta versión.", "error");
        await downloadStoredFile(budget, "presupuesto-demo.pdf");
        addAudit("DOWNLOAD", "EVENT_BUDGET", budget.id, { eventId: item.id }); saveData();
        break;
      }
      case "download-document": {
        const item = eventById(target.dataset.eventId);
        const doc = item?.documents.find(d => d.id === target.dataset.documentId);
        if (!item || !doc || !visibleDocuments(item).some(d => d.id === doc.id)) return toast("Acceso denegado", "No puedes descargar este documento.", "error");
        await downloadStoredFile(doc, "documento-demo.pdf");
        addAudit("DOWNLOAD", "EVENT_DOCUMENT", doc.id, { eventId: item.id }); saveData();
        break;
      }
      case "archive-budget": archiveBudget(target.dataset.eventId, target.dataset.budgetId); break;
      case "calendar-move": {
        const direction = Number(target.dataset.direction) || 0;
        const d = new Date(app.calendarDate);
        if (app.calendarView === "month" || app.calendarView === "list") d.setMonth(d.getMonth() + direction);
        else if (app.calendarView === "week") d.setDate(d.getDate() + direction * 7);
        else d.setDate(d.getDate() + direction);
        app.calendarDate = d; renderShell();
        break;
      }
      case "calendar-today": app.calendarDate = new Date(); renderShell(); break;
      case "calendar-view": app.calendarView = target.dataset.view; renderShell(); break;
      case "calendar-day": app.calendarDate = parseDate(target.dataset.date); app.calendarView = "day"; renderShell(); break;
      case "view-venue": app.modal = { type: "viewVenue", id: target.dataset.id }; renderShell(); break;
      case "new-venue": app.modal = { type: "newVenue" }; renderShell(); break;
      case "edit-venue": app.modal = { type: "editVenue", id: target.dataset.id }; renderShell(); break;
      case "filter-by-venue":
        app.eventFilters = { q: "", venue: target.dataset.id, status: "", priority: "", budget: "", open: "" }; app.modal = null; navigate("events");
        break;
      case "new-user": app.modal = { type: "newUser" }; renderShell(); break;
      case "edit-user": app.modal = { type: "editUser", id: target.dataset.id }; renderShell(); break;
      case "toggle-user": {
        if (!isAdmin()) break;
        const item = userById(target.dataset.id); if (!item || item.id === currentUser().id) break;
        item.active = !item.active; addAudit(item.active ? "ACTIVATE" : "DEACTIVATE", "USER", item.id); saveData(); renderShell(); toast("Usuario actualizado", item.active ? "Cuenta activada." : "Cuenta desactivada.", "success");
        break;
      }
      case "mark-all-read": markAllRead(); break;
      case "open-notification": {
        const item = app.data.notifications.find(n => n.id === target.dataset.id && n.recipientId === currentUser().id);
        if (!item) break;
        item.readAt = item.readAt || nowIso(); saveData();
        if (item.eventId && canAccessEvent(eventById(item.eventId))) { app.selectedEventId = item.eventId; app.selectedEventTab = item.type === "BUDGET_AVAILABLE" ? "budgets" : "summary"; }
        renderShell();
        break;
      }
      case "export-csv": exportEventsCsv(); break;
      case "close-modal": app.modal = null; renderShell(); break;
      case "submit-external-form": document.getElementById(target.dataset.form)?.requestSubmit(); break;
      case "confirm-create-event":
        if (app.modal?.pendingData) createEvent(app.modal.pendingData);
        break;
      case "open-existing-duplicate":
        app.selectedEventId = target.dataset.id; app.selectedEventTab = "summary"; app.modal = null; renderShell();
        break;
      case "open-event-from-modal":
        app.selectedEventId = target.dataset.id; app.selectedEventTab = "summary"; app.modal = null; renderShell();
        break;
    }
  });

  document.addEventListener("submit", async event => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement)) return;
    event.preventDefault();
    if (form.id === "login-form") {
      const data = formObject(form);
      const user = app.data.users.find(u => u.active && u.email.toLowerCase() === String(data.email || "").trim().toLowerCase() && u.password === data.password);
      const error = document.getElementById("login-error");
      if (!user) {
        if (error) { error.style.display = "block"; error.textContent = "Email o contraseña incorrectos."; }
        return;
      }
      app.session = { userId: user.id, createdAt: nowIso() }; saveSession(user.id); app.page = "dashboard"; history.replaceState(null, "", "#dashboard"); renderShell(); toast("Sesión iniciada", `Perfil: ${ROLE_LABEL[user.role]}.`, "success");
      return;
    }
    if (form.id === "global-search-form") {
      const data = formObject(form); app.eventFilters.q = String(data.q || "").trim(); app.eventFilters.open = ""; navigate("events"); return;
    }
    if (form.id === "new-event-form") {
      const data = formObject(form);
      const duplicate = findPossibleDuplicate(data);
      if (duplicate) { app.modal = { type: "duplicateWarning", candidate: duplicate, pendingData: data }; renderShell(); }
      else createEvent(data);
      return;
    }
    if (form.id === "edit-event-form") { updateEventFromForm(formObject(form)); return; }
    if (form.id === "budget-upload-form") { await uploadBudget(form); return; }
    if (form.id === "document-upload-form") { await uploadDocument(form); return; }
    if (form.id === "comment-form") { addComment(form); return; }
    if (form.id === "note-form") { addNote(form); return; }
    if (form.id === "venue-form") { saveVenue(form); return; }
    if (form.id === "user-form") { saveUser(form); return; }
    if (form.id === "settings-form") { saveSettings(form); return; }
  });

  document.addEventListener("change", event => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.matches("[data-filter]")) {
      app.eventFilters[target.dataset.filter] = target.value;
      if (target.dataset.filter !== "q") app.eventFilters.open = "";
      renderShell();
      return;
    }
    if (target.id === "calendar-venue") { app.calendarVenue = target.value; renderShell(); return; }
    if (target.matches('[data-action-change="event-status"]')) { changeEventStatus(target.dataset.id, target.value); return; }
    if (target.matches('[data-action-change="event-priority"]')) { changeEventPriority(target.dataset.id, target.value); return; }
    if (target.id === "budget-file") {
      const label = document.getElementById("budget-file-name"); if (label) label.textContent = target.files?.[0] ? `Seleccionado: ${target.files[0].name}` : "";
    }
    if (target.id === "document-file") {
      const label = document.getElementById("document-file-name"); if (label) label.textContent = target.files?.[0] ? `Seleccionado: ${target.files[0].name}` : "";
    }
  });

  let searchTimer;
  document.addEventListener("input", event => {
    const target = event.target;
    if (target?.id !== "events-search") return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { app.eventFilters.q = target.value; app.eventFilters.open = ""; renderShell(); }, 180);
  });

  document.addEventListener("dragover", event => {
    const zone = event.target.closest(".drop-zone");
    if (!zone) return;
    event.preventDefault(); zone.classList.add("drag");
  });

  document.addEventListener("dragleave", event => {
    const zone = event.target.closest(".drop-zone");
    if (zone) zone.classList.remove("drag");
  });

  document.addEventListener("drop", event => {
    const zone = event.target.closest(".drop-zone");
    if (!zone) return;
    event.preventDefault(); zone.classList.remove("drag");
    const input = zone.querySelector('input[type="file"]');
    const files = event.dataTransfer?.files;
    if (!input || !files?.length) return;
    const transfer = new DataTransfer(); transfer.items.add(files[0]); input.files = transfer.files; input.dispatchEvent(new Event("change", { bubbles: true }));
  });

  document.addEventListener("keydown", event => {
    const target = event.target instanceof Element ? event.target.closest('.cal-event[data-action="open-event"]') : null;
    if (target && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      target.click();
      return;
    }
    if (event.key !== "Escape") return;
    if (app.modal) { app.modal = null; renderShell(); return; }
    if (app.selectedEventId) { app.selectedEventId = null; renderShell(); return; }
    closeMobileMenu();
  });

  window.addEventListener("hashchange", () => {
    if (!currentUser()) return;
    const page = location.hash.replace(/^#/, "") || "dashboard";
    app.page = safePage(page, currentUser());
    renderShell();
  });

  const initialPage = location.hash.replace(/^#/, "");
  if (currentUser() && initialPage) app.page = safePage(initialPage, currentUser());
  if (!currentUser() && app.session) { app.session = null; saveSession(null); }
  renderShell();
})();
</script>
</body>
</html>
