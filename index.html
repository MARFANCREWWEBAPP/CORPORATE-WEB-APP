function renderLogin(){document.body.innerHTML=`<div id="app"></div><div id="layer"></div><div id="toasts" class="toast-stack"></div>`;$('#app').innerHTML=`<main class="login"><section class="login-visual"><div class="logo"><div class="logo-mark">${icon()}</div><div class="logo-copy"><strong>MÄRQUEE.</strong><span>audiovisuales</span></div></div><div class="login-message"><h1>Todo el evento,<br>en un mismo lugar.</h1><p>Peticiones, comunicación, presupuestos, documentos y seguimiento comercial conectados entre cada finca y Marquee.</p></div><div class="small" style="color:#777d88">MARQUEE FLOW · V4 STAGING</div></section><section class="login-panel"><div class="login-box"><div class="muted small" style="font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">Entorno interno de revisión</div><h2>Bienvenido</h2><p class="muted">Selecciona un perfil de prueba o inicia sesión.</p><div class="profiles"><button class="profile" data-profile="admin@marquee.demo"><b>Administrador</b><span>Control total</span></button><button class="profile" data-profile="comercial@marquee.demo"><b>Comercial</b><span>Todas las fincas</span></button><button class="profile" data-profile="hacienda-sol@marquee.demo"><b>Usuario finca</b><span>Solo su espacio</span></button></div><form id="login-form" class="form-stack"><div><label class="label">Correo electrónico</label><input id="login-email" class="field" type="email" value="admin@marquee.demo" required></div><div><label class="label">Contraseña</label><input id="login-password" class="field" type="password" value="${PASSWORD}" required></div><button class="btn btn-primary" type="submit">Entrar en Marquee Flow</button><div class="small muted" style="text-align:center">Contraseña de demo: <b>${PASSWORD}</b></div></form></div></section></main>`}
const menus=()=>{const base=[['dashboard','Dashboard'],['inbox','Pendiente de mí'],['calendar','Calendario'],['events','Eventos'],['files','Archivos'],['communications','Comunicación'],['venues','Fincas']];if(session.role==='ADMIN')base.push(['backups','Copias y datos']);return base};
function renderApp(){const title={dashboard:'Dashboard',inbox:'Pendiente de mí',calendar:'Calendario',events:'Eventos',files:'Archivos',communications:'Comunicación',venues:'Fincas',backups:'Copias y datos'}[view]||'Marquee Flow';$('#app').innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="logo"><div class="logo-mark">${icon()}</div><div class="logo-copy"><strong>MÄRQUEE.</strong><span>Flow V4</span></div></div><nav class="nav">${menus().map(([k,t])=>`<button data-view="${k}" class="${view===k?'active':''}"><span class="dot"></span>${t}${k==='inbox'?`<span style="margin-left:auto" class="badge red">${pendingForMe().length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="user-mini"><div class="avatar">${initials(session)}</div><div><b>${session.name} ${session.surname}</b><span>${human(session.role)}</span></div></div><button class="btn btn-ghost btn-sm" style="width:100%;color:#bbb;border-color:#30333a;margin-top:8px" data-action="logout">Cerrar sesión</button></div></aside><section class="main"><header class="topbar"><button class="btn btn-ghost btn-sm mobile-menu" data-action="menu">☰</button><div class="search"><input class="field" id="global-search" placeholder="Buscar evento, cliente, finca o contacto…  ⌘K"></div><div class="top-actions"><button class="btn btn-secondary btn-sm" data-view="inbox">${pendingForMe().length} pendientes</button><button class="btn btn-primary btn-sm" data-action="new-event">＋ Nueva petición</button></div></header><div class="content"><div class="page-head"><div><h1>${title}</h1><p>${subtitle()}</p></div><div class="actions"><button class="btn btn-ghost btn-sm" data-action="refresh">Actualizar</button><button class="btn btn-primary btn-sm" data-action="new-event">＋ Nuevo evento</button></div></div><div id="view"></div></div></section></div>`;renderView()}
function subtitle(){if(session.role==='VENUE_USER')return `Espacio de trabajo de ${venue(session.venueId)?.name}`;return 'Visión operativa de todas las fincas y peticiones corporativas'}
function pendingForMe(){return visibleEvents().filter(e=>e.waiting===(session.role==='VENUE_USER'?'FINCA':'MARQUEE')||(['URGENTE','MUY_URGENTE'].includes(e.priority)&&!['CONFIRMADO','REALIZADO','CANCELADO'].includes(e.status)))}
function renderView(){({dashboard:dashboard,inbox:inbox,calendar:calendar,events:events,files:files,communications:communications,venues:venues,backups:backups}[view]||dashboard)()}
function statCard(label,value,caption,symbol){return `<div class="card stat"><div class="stat-top"><span class="small muted">${label}</span><div class="indicator">${symbol}</div></div><div class="value">${value}</div><div class="caption">${caption}</div></div>`}
function eventItem(e){return `<button class="work-item" data-event="${e.id}" style="width:100%;background:#fff;text-align:left"><span class="prio-bar ${e.priority}"></span><span><b>${e.name}</b><span class="meta"><span>${venue(e.venueId)?.name}</span><span>·</span><span>${formatDate(e.date)}</span><span>·</span><span>${e.people} pax</span></span></span><span style="text-align:right"><span class="badge ${e.priority==='URGENTE'?'red':e.priority==='ALTA'?'orange':'blue'}">${human(e.priority)}</span><span class="small muted" style="display:block;margin-top:6px">Espera: ${human(e.waiting)}</span></span></button>`}
function dashboard(){const ev=visibleEvents(),open=ev.filter(e=>!['REALIZADO','CANCELADO','NO_ACEPTADO'].includes(e.status)),urgent=ev.filter(e=>['URGENTE','MUY_URGENTE'].includes(e.priority)),without=ev.filter(e=>!e.budgets.length),confirmed=ev.filter(e=>e.status==='CONFIRMADO');$('#view').innerHTML=`<div class="grid stats">${statCard('Peticiones abiertas',open.length,'Expedientes activos','↗')}${statCard('Pendiente de mí',pendingForMe().length,'Acciones que requieren atención','!')}${statCard('Sin presupuesto',without.length,'Propuestas pendientes','€')}${statCard('Confirmados',confirmed.length,'Eventos cerrados','✓')}</div><div class="grid two-col"><section class="card section"><div class="section-head"><h2>Prioridad operativa</h2><span class="small muted">Ordenado por urgencia</span></div><div class="work-list">${[...ev].sort((a,b)=>({URGENTE:0,MUY_URGENTE:0,ALTA:1,NORMAL:2,BAJA:3}[a.priority]-({URGENTE:0,MUY_URGENTE:0,ALTA:1,NORMAL:2,BAJA:3}[b.priority])).slice(0,6).map(eventItem).join('')||'<div class="empty">Sin eventos</div>'}</div></section><aside class="grid"><section class="card section"><div class="section-head"><h2>Accesos rápidos</h2></div><div class="quick-grid"><button class="quick" data-action="new-event"><b>Nueva petición</b><span>Crear en menos de un minuto</span></button><button class="quick" data-view="calendar"><b>Abrir calendario</b><span>Ver todas las fechas</span></button><button class="quick" data-view="files"><b>Últimos archivos</b><span>Presupuestos y planos</span></button><button class="quick" data-view="communications"><b>Conversaciones</b><span>Mensajes por evento</span></button></div></section><section class="card section"><div class="section-head"><h2>Estado del sistema</h2></div><div class="work-list"><div class="quick"><b>Demo operativa</b><span>Guardado local activado</span></div><div class="quick"><b>Última copia</b><span>Exportación manual disponible</span></div></div></section></aside></div>`}
function inbox(){const list=pendingForMe();$('#view').innerHTML=`<section class="card section"><div class="section-head"><h2>Acciones asignadas a ${session.role==='VENUE_USER'?'mi finca':'Marquee'}</h2><span class="badge red">${list.length} pendientes</span></div><div class="work-list">${list.map(eventItem).join('')||'<div class="empty">Todo al día. No hay acciones pendientes.</div>'}</div></section>`}
function events(){const ev=visibleEvents();$('#view').innerHTML=`<div class="filters"><input id="event-search" class="field" placeholder="Buscar en eventos"><select id="status-filter" class="field"><option value="">Todos los estados</option>${[...new Set(ev.map(e=>e.status))].map(x=>`<option value="${x}">${human(x)}</option>`).join('')}</select><select id="venue-filter" class="field" ${session.role==='VENUE_USER'?'disabled':''}><option value="">Todas las fincas</option>${data.venues.map(v=>`<option value="${v.id}">${v.name}</option>`).join('')}</select></div><section class="card table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Evento</th><th>Finca</th><th>Cliente</th><th>Personas</th><th>Estado</th><th>Prioridad</th><th>Presupuesto</th><th></th></tr></thead><tbody id="event-rows">${eventRows(ev)}</tbody></table></section>`}
function eventRows(ev){return ev.map(e=>`<tr><td>${formatDate(e.date)}<br><span class="muted">${e.start}–${e.end}</span></td><td><span class="event-name">${e.name}</span><br><span class="muted">${e.contact}</span></td><td>${venue(e.venueId)?.name}</td><td>${e.client}<br><span class="muted">${e.agency}</span></td><td>${e.people}</td><td><span class="badge blue">${human(e.status)}</span></td><td><span class="badge ${e.priority==='URGENTE'?'red':e.priority==='ALTA'?'orange':''}">${human(e.priority)}</span></td><td>${e.budgets.length?`<span class="badge green">${e.budgets.find(b=>b.current)?.version||e.budgets.at(-1).version}</span>`:'<span class="badge orange">Pendiente</span>'}</td><td><button class="btn btn-ghost btn-sm" data-event="${e.id}">Abrir</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No se encontraron eventos</td></tr>'}
function calendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()+1);let days=['L','M','X','J','V','S','D'].map(d=>`<div class="cal-label">${d}</div>`).join('');for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=d.toISOString().slice(0,10),items=visibleEvents().filter(e=>e.date===key);days+=`<div class="day ${d.getMonth()!==m?'other':''}"><div class="day-num">${d.getDate()}</div>${items.map(e=>`<button class="cal-event ${e.priority==='URGENTE'?'urgent':''}" data-event="${e.id}"><b>${e.start}</b> ${e.name}<br>${e.budgets.length?'✓ Presupuesto':'• Sin presupuesto'}</button>`).join('')}</div>`}$('#view').innerHTML=`<section class="card section calendar-card"><div class="calendar-head"><button class="btn btn-ghost btn-sm" data-cal="prev">←</button><button class="btn btn-ghost btn-sm" data-cal="today">Hoy</button><button class="btn btn-ghost btn-sm" data-cal="next">→</button><b style="margin-left:8px;text-transform:capitalize">${new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(calendarDate)}</b><span class="spacer"></span></div><div class="calendar">${days}</div></section>`}
function allFiles(){return visibleEvents().flatMap(e=>[...e.budgets.map(f=>({...f,type:'Presupuesto',event:e})),...e.docs.map(f=>({...f,type:'Documento',event:e}))])}
function files(){const list=allFiles();$('#view').innerHTML=`<div class="grid file-grid">${list.map(f=>`<article class="card file-card"><div class="file-icon">${f.type==='Presupuesto'?'PDF':'DOC'}</div><h3>${f.name}</h3><p>${f.event.name}<br>${venue(f.event.venueId)?.name} · ${formatDate(f.date)}</p><div style="display:flex;gap:7px"><button class="btn btn-secondary btn-sm" data-event="${f.event.id}">Ver evento</button><button class="btn btn-primary btn-sm" data-download="${f.event.id}|${f.id}">Descargar</button></div></article>`).join('')||'<div class="card empty">Todavía no hay archivos disponibles.</div>'}</div>`}
function communications(){const ev=visibleEvents();if(!ev.some(e=>e.id===selectedThread))selectedThread=ev[0]?.id;const active=ev.find(e=>e.id===selectedThread);$('#view').innerHTML=`<section class="card conversation"><aside class="thread-list">${ev.map(e=>`<button class="thread ${e.id===selectedThread?'active':''}" data-thread="${e.id}"><b>${e.name}</b><p>${e.messages.at(-1)?.text||'Sin mensajes todavía'}</p></button>`).join('')}</aside><div class="chat">${active?`<div class="section-head"><div><h2>${active.name}</h2><span class="small muted">${venue(active.venueId)?.name}</span></div><button style="margin-left:auto" class="btn btn-ghost btn-sm" data-event="${active.id}">Abrir expediente</button></div><div class="messages">${active.messages.map(m=>`<div class="message ${m.mine?'mine':''}">${m.text}<small>${m.by} · ${m.at}</small></div>`).join('')||'<div class="empty">Inicia la conversación de este evento.</div>'}</div><form class="composer" id="composer"><input class="field" name="message" placeholder="Escribir un mensaje…" required><button class="btn btn-primary">Enviar</button></form>`:'<div class="empty">No hay conversaciones</div>'}</div></section>`}
function venues(){const allowed=session.role==='VENUE_USER'?data.venues.filter(v=>v.id===session.venueId):data.venues;$('#view').innerHTML=`<div class="grid venue-grid">${allowed.map(v=>{const ev=data.events.filter(e=>e.venueId===v.id);return `<article class="card venue"><span class="badge green">Activa</span><h3>${v.name}</h3><p class="small muted">${v.city}<br>${v.contact} · ${v.phone}<br>${v.email}</p><div class="numbers"><div><b>${ev.length}</b><span>EVENTOS</span></div><div><b>${ev.filter(e=>e.status==='CONFIRMADO').length}</b><span>CONFIRMADOS</span></div><div><b>${ev.filter(e=>!e.budgets.length).length}</b><span>SIN PPTO.</span></div></div></article>`}).join('')}</div>`}
function backups(){if(session.role!=='ADMIN'){view='dashboard';return renderApp()}$('#view').innerHTML=`<div class="grid two-col"><section class="card section"><div class="section-head"><h2>Copias y portabilidad</h2></div><p class="muted small">Esta demo guarda los datos en el navegador. Exporta una copia para trasladar pruebas entre equipos o recuperar un estado anterior.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn btn-primary" data-action="export">Descargar copia JSON</button><label class="btn btn-secondary">Restaurar copia<input id="import-file" type="file" accept="application/json" hidden></label><button class="btn btn-danger" data-action="reset">Restablecer demo</button></div></section><section class="card section"><h2 style="font-size:16px;margin-top:0">Estado de protección</h2><div class="work-list"><div class="quick"><b>Datos de prueba</b><span>${data.events.length} eventos · ${allFiles().length} archivos</span></div><div class="quick"><b>Producción pendiente</b><span>PostgreSQL + S3/R2 + backups externos</span></div></div></section></div>`}
function openEvent(id){const e=visibleEvents().find(x=>x.id===id);if(!e)return toast('No tienes acceso a este evento');const editable=session.role!=='VENUE_USER';$('#layer').innerHTML=`<div class="overlay" data-action="close-layer"><article class="drawer" onclick="event.stopPropagation()"><header class="drawer-head"><div><div class="hero-meta"><span class="badge ${e.priority==='URGENTE'?'red':e.priority==='ALTA'?'orange':''}">${human(e.priority)}</span><span class="badge blue">${human(e.status)}</span><span class="badge">Espera: ${human(e.waiting)}</span></div><h2>${e.name}</h2><span class="small muted">${venue(e.venueId)?.name} · ${formatDate(e.date)} · ${e.start}–${e.end}</span></div><button class="close" data-action="close-layer">×</button></header><div class="drawer-body"><div class="action-box"><span>Siguiente mejor acción · Responsable ${e.owner}</span><b>${e.next}</b><small>Fecha objetivo: ${formatDate(e.due)}</small></div>${editable?`<div class="detail-grid"><label class="detail"><span>Estado</span><select class="field" data-edit="status" data-id="${e.id}">${['NUEVA_PETICION','PENDIENTE_REVISION','INFORMACION_PENDIENTE','PREPARANDO_PRESUPUESTO','PRESUPUESTO_ENVIADO','PENDIENTE_RESPUESTA','EN_NEGOCIACION','CONFIRMADO','NO_ACEPTADO','CANCELADO','REALIZADO'].map(x=>`<option value="${x}" ${e.status===x?'selected':''}>${human(x)}</option>`).join('')}</select></label><label class="detail"><span>Esperando a</span><select class="field" data-edit="waiting" data-id="${e.id}">${['MARQUEE','FINCA','CLIENTE','AGENCIA','NINGUNO'].map(x=>`<option value="${x}" ${e.waiting===x?'selected':''}>${human(x)}</option>`).join('')}</select></label></div>`:''}<div class="detail-grid"><div class="detail"><span>Cliente</span><b>${e.client}</b></div><div class="detail"><span>Agencia</span><b>${e.agency}</b></div><div class="detail"><span>Contacto</span><b>${e.contact}</b><br><small>${e.phone}</small></div><div class="detail"><span>Asistentes</span><b>${e.people} personas</b></div></div><div class="subsection"><h3>Petición audiovisual</h3><p class="small" style="line-height:1.6">${e.request}</p><p class="small muted">${e.tech}</p></div><div class="subsection"><div class="section-head"><h3>Presupuestos</h3>${editable?`<label class="btn btn-primary btn-sm">＋ Subir presupuesto<input type="file" data-upload-budget="${e.id}" accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg" hidden></label>`:''}</div>${e.budgets.map(b=>`<div class="budget ${b.current?'current':''}"><div class="file-icon" style="width:34px;height:38px;margin:0">PDF</div><div><b>${b.name}</b><span>${b.version} · ${formatDate(b.date)} ${b.current?'· VIGENTE':''}</span></div><button class="btn btn-secondary btn-sm" data-download="${e.id}|${b.id}">Descargar</button></div>`).join('')||'<div class="empty" style="padding:20px">Todavía no existe presupuesto.</div>'}</div><div class="subsection"><div class="section-head"><h3>Documentos</h3><label class="btn btn-secondary btn-sm">＋ Añadir documento<input type="file" data-upload-doc="${e.id}" accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg" hidden></label></div>${e.docs.map(d=>`<div class="budget"><div class="file-icon" style="width:34px;height:38px;margin:0">DOC</div><div><b>${d.name}</b><span>${formatDate(d.date)}</span></div><button class="btn btn-secondary btn-sm" data-download="${e.id}|${d.id}">Descargar</button></div>`).join('')||'<div class="small muted">Sin documentación adicional.</div>'}</div><div class="subsection"><h3>Comunicación</h3><div class="messages" style="max-height:none">${e.messages.map(m=>`<div class="message ${m.mine?'mine':''}">${m.text}<small>${m.by} · ${m.at}</small></div>`).join('')}</div><form class="composer" data-event-message="${e.id}"><input class="field" name="message" placeholder="Añadir comentario compartido…" required><button class="btn btn-primary">Enviar</button></form></div><div class="subsection"><h3>Tareas</h3>${e.tasks.filter(t=>session.role!=='VENUE_USER'||t.shared).map(t=>`<label class="task"><input type="checkbox" data-task="${e.id}|${t.id}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:#888':''}">${t.text}</span>${!t.shared?'<span class="badge" style="margin-left:auto">Interna</span>':''}</label>`).join('')}</div><div class="subsection"><h3>Histórico</h3><div class="history">${e.history.map((h,i)=>`<div><b>${h}</b><span class="muted">${i+1} · Registro automático</span></div>`).join('')}</div></div></div></article></div>`}
function newEvent(){const venues=session.role==='VENUE_USER'?data.venues.filter(v=>v.id===session.venueId):data.venues;$('#layer').innerHTML=`<div class="modal-wrap" data-action="close-layer"><section class="modal" onclick="event.stopPropagation()"><header class="modal-head"><div><h2>Nueva petición</h2><span class="small muted">Los campos esenciales permiten crearla en menos de un minuto.</span></div><button class="close" data-action="close-layer">×</button></header><div class="modal-body"><form id="new-event-form" class="form-grid"><div class="full"><label class="label">Nombre del evento *</label><input class="field" name="name" required placeholder="Ej. Cena anual Empresa X"></div><div><label class="label">Finca *</label><select class="field" name="venueId" required>${venues.map(v=>`<option value="${v.id}">${v.name}</option>`).join('')}</select></div><div><label class="label">Fecha *</label><input class="field" type="date" name="date" required value="2026-10-15"></div><div><label class="label">Cliente final *</label><input class="field" name="client" required></div><div><label class="label">Agencia</label><input class="field" name="agency"></div><div><label class="label">Hora inicio</label><input class="field" type="time" name="start" value="18:00"></div><div><label class="label">Hora fin</label><input class="field" type="time" name="end" value="01:00"></div><div><label class="label">Número de personas</label><input class="field" type="number" name="people" min="1" value="100"></div><div><label class="label">Prioridad</label><select class="field" name="priority"><option>NORMAL</option><option>ALTA</option><option>URGENTE</option><option>BAJA</option></select></div><div><label class="label">Persona de contacto</label><input class="field" name="contact"></div><div><label class="label">Teléfono</label><input class="field" name="phone"></div><div class="full"><label class="label">Petición audiovisual *</label><textarea class="field" name="request" rows="5" required placeholder="Sonido, iluminación, pantallas, escenario, micrófonos, técnicos…"></textarea></div><div class="full" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn btn-secondary" data-action="close-layer">Cancelar</button><button class="btn btn-primary">Crear petición</button></div></form></div></section></div>`}
function downloadFile(eventId,fileId){const e=visibleEvents().find(x=>x.id===eventId);const f=e&&[...e.budgets,...e.docs].find(x=>x.id===fileId);if(!f)return toast('Archivo no disponible');const content=`MARQUEE FLOW V4\n\nDocumento de demostración\nArchivo: ${f.name}\nEvento: ${e.name}\nFinca: ${venue(e.venueId)?.name}\nFecha: ${f.date}\n\nEsta descarga es un archivo simulado del entorno de pruebas.`;const url=f.data||URL.createObjectURL(new Blob([content],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download=f.name.replace(/\.pdf$/i,'')+(f.data?'':'.txt');a.click();if(!f.data)setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Descarga iniciada')}
function upload(input,eventId,type){const file=input.files?.[0];if(!file)return;if(file.size>1500000)return toast('En la demo, el archivo debe ocupar menos de 1,5 MB');const reader=new FileReader();reader.onload=()=>{const e=data.events.find(x=>x.id===eventId),item={id:'f'+Date.now(),name:file.name,date:new Date().toISOString().slice(0,10),data:reader.result};if(type==='budget'){e.budgets.forEach(b=>b.current=false);item.current=true;item.version='V'+(e.budgets.length+1);e.budgets.push(item);e.status='PRESUPUESTO_ENVIADO';e.waiting='FINCA';e.history.unshift(`Presupuesto ${item.version} publicado por ${session.name}`)}else{e.docs.push(item);e.history.unshift(`Documento ${file.name} añadido por ${session.name}`)}save();openEvent(e.id);toast('Archivo añadido correctamente')};reader.readAsDataURL(file)}
function bindGlobal(){document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-action],[data-profile],[data-event],[data-thread],[data-download],[data-cal]');if(!b)return;if(b.dataset.profile){$('#login-email').value=b.dataset.profile;$$('.profile').forEach(x=>x.classList.toggle('active',x===b));return}if(b.dataset.view){view=b.dataset.view;$('#sidebar')?.classList.remove('open');renderApp();return}if(b.dataset.event){openEvent(b.dataset.event);return}if(b.dataset.thread){selectedThread=b.dataset.thread;communications();return}if(b.dataset.download){downloadFile(...b.dataset.download.split('|'));return}if(b.dataset.cal){if(b.dataset.cal==='prev')calendarDate.setMonth(calendarDate.getMonth()-1);if(b.dataset.cal==='next')calendarDate.setMonth(calendarDate.getMonth()+1);if(b.dataset.cal==='today')calendarDate=new Date(2026,8,1);calendar();return}const a=b.dataset.action;if(a==='logout'){session=null;renderLogin()}if(a==='menu')$('#sidebar').classList.toggle('open');if(a==='new-event')newEvent();if(a==='close-layer')$('#layer').innerHTML='';if(a==='refresh'){renderApp();toast('Información actualizada')}if(a==='export'){const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='marquee-flow-v4-backup.json';x.click();URL.revokeObjectURL(u);toast('Copia descargada')}if(a==='reset'&&confirm('¿Restablecer todos los datos de prueba?')){data=clone(SEED);save();renderApp();toast('Demo restablecida')}});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form'){const u=USERS.find(x=>x.email.toLowerCase()===$('#login-email').value.trim().toLowerCase());if(!u||$('#login-password').value!==PASSWORD)return toast('Credenciales incorrectas');session=u;view='dashboard';renderApp();return}if(e.target.id==='new-event-form'){const f=new FormData(e.target),obj=Object.fromEntries(f);const ev={id:'e'+Date.now(),name:obj.name,venueId:obj.venueId,client:obj.client,agency:obj.agency||'Sin agencia',date:obj.date,start:obj.start||'--:--',end:obj.end||'--:--',people:Number(obj.people)||0,status:'NUEVA_PETICION',priority:obj.priority,waiting:'MARQUEE',owner:'Sin asignar',next:'Revisar nueva petición y completar información',due:obj.date,contact:obj.contact||'Pendiente',email:'',phone:obj.phone||'',request:obj.request,tech:'Información técnica pendiente de revisión.',budgets:[],docs:[],messages:[],tasks:[{id:'t'+Date.now(),text:'Revisar nueva petición',done:false,shared:false}],history:[`Petición creada por ${session.name} ${session.surname}`]};data.events.unshift(ev);save();$('#layer').innerHTML='';view='events';renderApp();openEvent(ev.id);toast('Petición creada correctamente');return}if(e.target.id==='composer'||e.target.dataset.eventMessage){const id=e.target.dataset.eventMessage||selectedThread,msg=new FormData(e.target).get('message'),ev=data.events.find(x=>x.id===id);ev.messages.push({by:`${session.name} · ${session.role==='VENUE_USER'?venue(session.venueId)?.name:'Marquee'}`,text:msg,at:'Ahora',mine:session.role!=='VENUE_USER'});ev.history.unshift(`Comentario añadido por ${session.name}`);save();if(e.target.id==='composer')communications();else openEvent(id);toast('Mensaje enviado')}});document.addEventListener('change',e=>{if(e.target.dataset.edit){const ev=data.events.find(x=>x.id===e.target.dataset.id);ev[e.target.dataset.edit]=e.target.value;ev.history.unshift(`${e.target.dataset.edit==='status'?'Estado':'Esperando a'} actualizado por ${session.name}`);save();openEvent(ev.id);toast('Cambio guardado')}if(e.target.dataset.task){const [eid,tid]=e.target.dataset.task.split('|'),ev=data.events.find(x=>x.id===eid),t=ev.tasks.find(x=>x.id===tid);t.done=e.target.checked;save();openEvent(eid)}if(e.target.dataset.uploadBudget)upload(e.target,e.target.dataset.uploadBudget,'budget');if(e.target.dataset.uploadDoc)upload(e.target,e.target.dataset.uploadDoc,'doc');if(e.target.id==='import-file'){const file=e.target.files[0],r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);data=parsed.data||parsed;save();renderApp();toast('Copia restaurada')}catch{toast('La copia no es válida')}};if(file)r.readAsText(file)}});document.addEventListener('input',e=>{if(e.target.id==='event-search'||e.target.id==='status-filter'||e.target.id==='venue-filter'){const q=($('#event-search')?.value||'').toLowerCase(),s=$('#status-filter')?.value||'',v=$('#venue-filter')?.value||'';const list=visibleEvents().filter(x=>(!q||[x.name,x.client,x.contact,venue(x.venueId)?.name].join(' ').toLowerCase().includes(q))&&(!s||x.status===s)&&(!v||x.venueId===v));$('#event-rows').innerHTML=eventRows(list)}if(e.target.id==='global-search'&&e.target.value.trim().length>1){view='events';renderApp();$('#event-search').value=e.target.value;$('#event-search').dispatchEvent(new Event('input',{bubbles:true}))}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search')?.focus()}})}
renderLogin();bindGlobal();
</script>
