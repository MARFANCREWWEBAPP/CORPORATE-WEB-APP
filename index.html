  <style>:root{
  --ink:#14161a;--ink-2:#252932;--sidebar:#0d0f12;--canvas:#f4f5f7;--paper:#fff;
  --muted:#6b7280;--muted-2:#98a2b3;--line:#e6e8ec;--line-2:#d5d9df;
  --silver:#888b90;--silver-soft:#eef0f2;--success:#087a55;--warning:#b55b05;--danger:#c92a2a;
  --blue:#2658c9;--purple:#6d3dcc;--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 12px 35px rgba(16,24,40,.06)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}::selection{background:#d7d9dc}body.no-scroll{overflow:hidden}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.mono{font-variant-numeric:tabular-nums}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:10px}.row-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spacer{flex:1}.divider{height:1px;background:var(--line)}
.icon{width:18px;height:18px;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}.icon-sm{width:15px;height:15px}.icon-lg{width:22px;height:22px}
.btn{border:1px solid transparent;border-radius:11px;min-height:40px;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:760;cursor:pointer;transition:.16s ease;background:transparent;white-space:nowrap}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn-primary{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(20,22,26,.14)}.btn-primary:hover{background:#2b3038}.btn-secondary{background:#fff;border-color:var(--line-2);color:#30343b}.btn-secondary:hover{background:#f8f9fa;border-color:#bfc5cd}.btn-ghost{color:#59606b}.btn-ghost:hover{background:#eef0f3}.btn-danger{background:#fff;border-color:#f2c6c6;color:#b42318}.btn-danger:hover{background:#fff6f6}.btn-sm{min-height:34px;padding:7px 10px;border-radius:9px;font-size:12px}.btn-icon{width:40px;padding:0}.btn-icon.btn-sm{width:34px}.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.field,.select,.textarea{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:11px;color:var(--ink);outline:none;transition:.15s;padding:11px 12px;font-size:14px}.field:hover,.select:hover,.textarea:hover{border-color:#afb5be}.field:focus,.select:focus,.textarea:focus{border-color:#59616d;box-shadow:0 0 0 4px rgba(88,96,108,.09)}.textarea{min-height:118px;resize:vertical;line-height:1.55}.field[disabled],.select[disabled]{background:#f2f3f5;color:#777}.label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:#667085;margin:0 0 7px}.help{font-size:11px;color:#8a919d;margin-top:6px;line-height:1.45}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.form-grid .full{grid-column:1/-1}.check-row{display:flex;align-items:center;gap:9px;font-size:13px;color:#59606b}.check-row input{width:17px;height:17px;accent-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,24,40,.025)}.card-pad{padding:20px}.card-header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.card-title{font-size:15px;font-weight:820;letter-spacing:-.01em}.card-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.card-body{padding:20px}.surface-soft{background:#f8f9fa;border:1px solid #eceef1;border-radius:14px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:850;line-height:1.1;white-space:nowrap;letter-spacing:.01em}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.badge-neutral{background:#eef0f2;color:#59606b}.badge-new{background:#e8f0ff;color:#2453a6}.badge-review{background:#eef0ff;color:#4e46a8}.badge-info{background:#fff4dd;color:#925300}.badge-preparing{background:#f2eaff;color:#6d3dcc}.badge-sent{background:#e7f5ff;color:#12628a}.badge-waiting{background:#fff0e6;color:#a34800}.badge-negotiation{background:#f7e9ff;color:#7b279b}.badge-confirmed{background:#e8f7ef;color:#087a55}.badge-declined{background:#f1f2f4;color:#616873}.badge-cancelled{background:#ffebeb;color:#b42318}.badge-completed{background:#e9f7f7;color:#087071}.priority-low{background:#f1f2f4;color:#616873}.priority-normal{background:#edf1f7;color:#435266}.priority-high{background:#fff3d8;color:#9a6200}.priority-urgent{background:#ffe9df;color:#b84a0c}.priority-very{background:#ffdddd;color:#b42318;animation:pulse-soft 1.8s infinite}@keyframes pulse-soft{50%{box-shadow:0 0 0 4px rgba(180,35,24,.08)}}
/* Login */
.login-shell{min-height:100vh;padding:16px;background:#0b0d10;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(420px,.88fr);gap:16px}.login-brand{position:relative;overflow:hidden;border-radius:28px;padding:52px;background:radial-gradient(circle at 12% 8%,#5e6570 0,transparent 34%),radial-gradient(circle at 88% 90%,#282d35 0,transparent 42%),linear-gradient(140deg,#171a20,#07080a);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:calc(100vh - 32px)}.login-brand:before,.login-brand:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.05);border-radius:50%;right:-140px;top:-130px;width:610px;height:610px}.login-brand:after{right:-20px;top:-10px;width:360px;height:360px}.login-logo{width:min(360px,58%);position:relative;z-index:1}.login-kicker{margin-top:15px;font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.44)}.login-copy{position:relative;z-index:1;max-width:720px}.login-copy h1{font-size:clamp(45px,5.4vw,78px);line-height:.98;letter-spacing:-.062em;margin:0;font-weight:900}.login-copy p{font-size:17px;line-height:1.75;color:rgba(255,255,255,.58);max-width:610px;margin:24px 0 0}.feature-pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}.feature-pills span{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:999px;padding:9px 12px;font-size:11px;color:rgba(255,255,255,.62);font-weight:700}.login-legal{position:relative;z-index:1;font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.28)}.login-panel{display:flex;align-items:center;justify-content:center;padding:30px}.login-card{width:100%;max-width:470px;background:#fff;border-radius:26px;border:1px solid rgba(255,255,255,.35);box-shadow:0 30px 90px rgba(0,0,0,.25);padding:36px}.login-mobile-logo{display:none;width:220px;margin-bottom:28px}.login-card h2{font-size:31px;letter-spacing:-.04em;margin:0;font-weight:900}.login-card>p{color:var(--muted);line-height:1.55;margin:9px 0 0;font-size:14px}.demo-profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.demo-profile{border:1px solid var(--line);background:#f7f8f9;border-radius:12px;padding:12px 7px;text-align:center;font-size:10px;font-weight:800;cursor:pointer;transition:.15s}.demo-profile .icon{display:block;margin:0 auto 7px}.demo-profile:hover,.demo-profile.active{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateY(-1px)}.login-note{margin-top:18px;padding:12px;border-radius:12px;background:#f6f7f8;color:#6b7280;font-size:11px;line-height:1.55}.login-error{margin-top:16px;background:#fff0f0;color:#a42121;padding:11px 12px;border-radius:11px;font-size:12px;font-weight:700;display:none}
/* Shell */
.app-shell{min-height:100vh;display:grid;grid-template-columns:274px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;z-index:50}.sidebar-brand{height:108px;padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;justify-content:center}.sidebar-logo{width:195px;max-height:52px;object-fit:contain}.sidebar-subtitle{font-size:8px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.36);margin-top:9px}.nav-scroll{flex:1;overflow:auto;padding:14px 12px}.nav-label{font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.27);padding:12px 11px 7px}.nav-item{width:100%;border:0;background:transparent;color:rgba(255,255,255,.64);display:flex;align-items:center;gap:11px;border-radius:12px;padding:10px 12px;margin:2px 0;font-size:13px;font-weight:720;cursor:pointer;text-align:left;transition:.14s}.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}.nav-item.active{background:#fff;color:#111318;box-shadow:0 5px 16px rgba(0,0,0,.17)}.nav-item .nav-count{margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;min-width:20px;padding:3px 6px;text-align:center;font-size:9px}.nav-item.active .nav-count{background:#eceef1}.sidebar-footer{border-top:1px solid rgba(255,255,255,.09);padding:12px}.user-chip{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:11px;font-weight:850;flex:none}.user-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-email{font-size:10px;color:rgba(255,255,255,.37);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.side-actions{display:flex;gap:6px;margin-top:4px}.side-action{flex:1;border:0;background:transparent;color:rgba(255,255,255,.52);border-radius:9px;padding:8px;font-size:10px;font-weight:700;cursor:pointer}.side-action:hover{background:rgba(255,255,255,.07);color:#fff}.main-column{min-width:0}.topbar{position:sticky;top:0;z-index:35;height:70px;background:rgba(255,255,255,.91);backdrop-filter:blur(13px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px}.topbar-action.mobile-menu{display:none}.global-search{position:relative;max-width:600px;flex:1}.global-search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9aa1ab}.global-search input{height:42px;padding-left:40px;background:#f5f6f7;border-color:#e3e6ea}.topbar-action{position:relative;width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;cursor:pointer}.topbar-action:hover{background:#f7f8f9}.notification-dot{position:absolute;right:-3px;top:-3px;background:#d52d2d;color:#fff;min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-size:9px;font-weight:850;border:2px solid #fff}.main-content{max-width:1660px;margin:0 auto;padding:26px 28px 52px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.page-head h1{font-size:clamp(24px,2.2vw,34px);letter-spacing:-.045em;line-height:1.06;margin:0;font-weight:900}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.page-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
/* Dashboard */
.alert-strip{background:linear-gradient(90deg,#1c2026,#343943);color:#fff;border-radius:15px;padding:13px 16px;display:flex;align-items:center;gap:11px;margin-bottom:18px;box-shadow:0 10px 26px rgba(20,22,26,.11)}.alert-strip .alert-copy{font-size:12px;color:rgba(255,255,255,.68)}.alert-strip strong{color:#fff}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;transition:.16s;cursor:pointer}.metric-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d8dce2}.metric-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.metric-label{font-size:11px;color:#667085;font-weight:750;line-height:1.4}.metric-icon{width:36px;height:36px;border-radius:11px;background:#f0f1f3;color:#59606b;display:grid;place-items:center}.metric-card:hover .metric-icon{background:var(--ink);color:#fff}.metric-value{font-size:30px;font-weight:900;letter-spacing:-.05em;margin-top:15px}.metric-foot{margin-top:8px;font-size:10px;color:#98a2b3}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.8fr);gap:18px;margin-top:18px}.event-row{display:grid;grid-template-columns:95px minmax(0,1fr) auto;align-items:center;gap:15px;padding:15px 20px;border-bottom:1px solid #f0f1f3}.event-row:last-child{border-bottom:0}.event-row:hover{background:#fafbfc}.event-date{font-size:10px;color:#8a919b;text-transform:uppercase;font-weight:850;letter-spacing:.03em}.event-time{font-size:11px;color:#667085;margin-top:5px}.event-name{font-size:13px;font-weight:850}.event-meta{font-size:11px;color:#7c8490;margin-top:5px}.activity-list{display:flex;flex-direction:column;gap:17px}.activity-item{position:relative;border-left:1px solid #dde0e5;padding-left:15px}.activity-item:before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:#4d535c}.activity-title{font-size:12px;font-weight:800;line-height:1.45}.activity-meta{font-size:10px;color:#9097a2;margin-top:4px;line-height:1.5}.mini-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.mini-day{border-radius:8px;background:#f5f6f8;min-height:32px;display:grid;place-items:center;font-size:10px;color:#6d7480}.mini-day.has-event{background:#24282e;color:#fff;font-weight:800}
/* Tables and filters */

/* ========================================================================
   MARQUEE FLOW V4 · refined workspace layer
   ======================================================================== */
:root{
  --v4-black:#0a0b0e;
  --v4-black-2:#12141a;
  --v4-surface:#ffffff;
  --v4-canvas:#f3f4f6;
  --v4-soft:#f7f8fa;
  --v4-line:#e5e7eb;
  --v4-ink:#17191f;
  --v4-muted:#687080;
  --v4-accent:#5d5bd4;
  --v4-accent-soft:#eeedff;
  --v4-blue:#2767d8;
  --v4-green:#087a55;
  --v4-orange:#c26712;
  --v4-red:#c33a3a;
  --v4-radius:18px;
  --v4-shadow:0 18px 54px rgba(15,23,42,.09),0 2px 8px rgba(15,23,42,.04);
}

body{background:var(--v4-canvas)}
.v4-shell{background:var(--v4-canvas)}
.v4-main-content{padding:28px 30px 110px;max-width:1680px;width:100%;margin:0 auto}
.v4-sidebar{width:274px;background:linear-gradient(180deg,#0a0b0e 0%,#0f1116 70%,#0a0b0e 100%);border-right:1px solid rgba(255,255,255,.06)}
.v4-sidebar-brand{padding:27px 22px 18px;display:flex;align-items:flex-start;gap:13px}
.v4-sidebar-brand .sidebar-logo{width:152px;margin:1px 0 0}
.v4-sidebar-brand>div{min-width:0}
.v4-side-version{display:inline-flex;margin-top:7px;padding:3px 7px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:rgba(255,255,255,.55);font-size:8px;font-weight:900;letter-spacing:.16em}
.v4-workspace-chip{margin:0 14px 15px;padding:12px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);display:flex;align-items:center;gap:10px}
.v4-workspace-chip>div{min-width:0;flex:1}
.v4-workspace-chip strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font-size:12px}
.v4-workspace-chip small{display:block;color:rgba(255,255,255,.45);font-size:10px;margin-top:3px}
.v4-workspace-switch{width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.45);display:grid;place-items:center}
.v4-nav-scroll{padding:0 12px 14px}
.v4-nav-group+.v4-nav-group{margin-top:18px}
.v4-nav-group .nav-label{padding:0 10px 7px;color:rgba(255,255,255,.28);font-size:8px;font-weight:900;letter-spacing:.16em}
.v4-nav-group .nav-item{min-height:39px;border-radius:10px;padding:9px 10px;margin:2px 0;color:rgba(255,255,255,.58)}
.v4-nav-group .nav-item:hover{background:rgba(255,255,255,.055);color:#fff}
.v4-nav-group .nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.06));box-shadow:inset 2px 0 0 #aaa8ff}
.v4-nav-group .nav-item.active svg{color:#b8b6ff}
.v4-nav-group .nav-count.attention{background:#7a77ec;color:#fff;border:1px solid rgba(255,255,255,.15)}
.v4-sidebar-status{margin:0 14px 12px;padding:11px 12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:12px;display:grid;gap:8px}
.v4-status-line{display:flex;align-items:center;gap:7px;font-size:9px;color:rgba(255,255,255,.42)}
.v4-status-line span{display:flex;align-items:center;gap:5px;flex:1}
.v4-status-line strong{color:rgba(255,255,255,.68);font-size:9px;font-weight:700}
.v4-topbar{height:69px;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-bottom:1px solid rgba(15,23,42,.08);padding:0 30px}
.v4-command-trigger{max-width:570px;border-radius:12px;background:#f6f7f9;border-color:#e7e9ed;box-shadow:none}
.v4-command-trigger:hover{background:#fff;border-color:#d4d7dd;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.v4-top-status{display:flex;align-items:center;gap:7px;color:#6d7480;font-size:10px;font-weight:700;white-space:nowrap}
.v4-live-dot{width:7px;height:7px;border-radius:50%;background:#18a56f;box-shadow:0 0 0 4px rgba(24,165,111,.12);display:inline-block}
.v4-work-button{position:relative}
.v4-new-event{border-radius:11px;padding-inline:16px;background:#17191f}
.v4-new-event:hover{background:#2a2d35}

.v4-page-head{margin-bottom:22px;align-items:flex-end}
.v4-page-head h1{font-size:30px;letter-spacing:-.035em;margin:4px 0 5px}
.v4-page-head p{font-size:13px;max-width:720px;line-height:1.55}
.eyebrow.dark{color:#7b7f89;font-size:9px;letter-spacing:.15em;font-weight:900}
.eyebrow.light{color:rgba(255,255,255,.55);font-size:9px;letter-spacing:.16em;font-weight:900;text-transform:uppercase}

/* Login */
.v4-login-shell{background:#fff}
.v4-login-brand{position:relative;overflow:hidden;background:
  radial-gradient(circle at 74% 22%,rgba(115,112,225,.27),transparent 28%),
  radial-gradient(circle at 22% 82%,rgba(255,255,255,.08),transparent 34%),
  linear-gradient(145deg,#08090c 0%,#12141a 55%,#0b0c10 100%);padding:42px 54px 32px}
.v4-login-brand:after{content:"";position:absolute;right:-80px;bottom:-150px;width:510px;height:510px;border-radius:50%;border:1px solid rgba(255,255,255,.06);box-shadow:0 0 0 60px rgba(255,255,255,.018),0 0 0 120px rgba(255,255,255,.012)}
.v4-login-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.v4-login-top .login-logo{width:245px}
.v4-version-pill{padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:rgba(255,255,255,.68);font-size:9px;font-weight:900;letter-spacing:.14em}
.v4-login-copy{position:relative;z-index:1;max-width:760px;margin-top:110px}
.v4-login-copy h1{font-size:58px;line-height:.98;letter-spacing:-.055em;margin:15px 0 24px;color:#fff}
.v4-login-copy p{font-size:17px;line-height:1.65;max-width:670px;color:rgba(255,255,255,.61)}
.v4-login-flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:34px}
.v4-login-flow span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.8);font-size:11px;font-weight:750}
.v4-login-flow b{color:rgba(255,255,255,.25)}
.v4-login-proof{position:relative;z-index:1;display:flex;gap:30px;margin-top:auto;padding-top:70px}
.v4-login-proof div{padding-left:17px;border-left:1px solid rgba(255,255,255,.15)}
.v4-login-proof strong{display:block;color:#fff;font-size:20px}
.v4-login-proof span{display:block;color:rgba(255,255,255,.4);font-size:10px;margin-top:4px}
.v4-login-panel{background:#f6f7f9}
.v4-login-card{max-width:480px;border-radius:24px;padding:36px;box-shadow:0 25px 70px rgba(15,23,42,.12);border:1px solid #e7e9ed}
.v4-card-kicker{font-size:9px;font-weight:900;letter-spacing:.16em;color:#787f8c;text-transform:uppercase;margin-bottom:8px}
.v4-login-card h2{font-size:28px;letter-spacing:-.035em;margin-bottom:8px}
.v4-demo-profiles{grid-template-columns:repeat(3,1fr);gap:7px}
.v4-demo-profiles .demo-profile{padding:11px 8px;display:flex;flex-direction:column;text-align:center;align-items:center;gap:7px;border-radius:12px}
.v4-demo-profiles .demo-profile span{min-width:0}
.v4-demo-profiles .demo-profile strong{display:block;font-size:10px}
.v4-demo-profiles .demo-profile small{display:block;font-size:8px;margin-top:2px;color:#8a909a}
.v4-login-button{min-height:48px;border-radius:12px}
.v4-login-note{display:flex;align-items:flex-start;gap:8px;line-height:1.5}

/* Hero & dashboard */
.v4-welcome{min-height:256px;border-radius:25px;padding:34px 38px;display:flex;align-items:stretch;gap:30px;background:
  radial-gradient(circle at 78% 18%,rgba(120,117,235,.26),transparent 28%),
  linear-gradient(135deg,#0b0c10 0%,#171923 60%,#101116 100%);color:#fff;position:relative;overflow:hidden;box-shadow:0 22px 55px rgba(15,23,42,.14);margin-bottom:18px}
.v4-welcome:after{content:"";position:absolute;right:24%;top:-80px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(255,255,255,.055);box-shadow:0 0 0 44px rgba(255,255,255,.018),0 0 0 88px rgba(255,255,255,.012)}
.v4-welcome-copy,.v4-welcome>div:first-child{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center}
.v4-welcome h1{font-size:42px;line-height:1.03;letter-spacing:-.05em;margin:10px 0 13px}
.v4-welcome p{max-width:720px;color:rgba(255,255,255,.58);font-size:14px;line-height:1.65;margin:0}
.v4-welcome .hero-actions{margin-top:24px}
.v4-hero-primary{background:#fff;color:#17191f;box-shadow:none}
.v4-hero-primary:hover{background:#f3f4f6;color:#17191f}
.v4-welcome .btn-glass{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff}
.v4-welcome .btn-glass kbd{margin-left:8px}
.v4-pulse-panel{position:relative;z-index:1;width:360px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);backdrop-filter:blur(15px);padding:20px;align-self:stretch;display:flex;flex-direction:column}
.v4-pulse-head{display:flex;align-items:center;gap:9px;color:#fff;font-size:11px}
.v4-pulse-head small{margin-left:auto;color:rgba(255,255,255,.35);font-size:9px}
.v4-pulse-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.v4-pulse-grid span{padding:13px;border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07)}
.v4-pulse-grid strong{font-size:24px;display:block}
.v4-pulse-grid small{font-size:9px;color:rgba(255,255,255,.45);display:block;margin-top:3px}
.v4-pulse-panel>button{margin-top:auto;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;padding:8px 2px 0;cursor:pointer}
.v4-venue-welcome{background:radial-gradient(circle at 80% 20%,rgba(82,153,255,.25),transparent 30%),linear-gradient(135deg,#0c1017 0%,#152337 62%,#0c1119 100%)}
.v4-focus-orb{position:relative;z-index:1;width:230px;min-width:230px;border-radius:50%;align-self:center;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:0 0 0 18px rgba(255,255,255,.025),0 0 0 36px rgba(255,255,255,.015)}
.v4-focus-orb span{font-size:56px;font-weight:800;line-height:1}
.v4-focus-orb strong{text-align:center;font-size:13px;line-height:1.15;margin-top:7px}
.v4-focus-orb small{margin-top:12px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.62);font-size:9px}
.v4-metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}
.v4-metric{min-height:112px;border:1px solid var(--v4-line);background:#fff;border-radius:16px;padding:17px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.025);transition:.17s ease}
.v4-metric:hover{transform:translateY(-2px);box-shadow:var(--v4-shadow);border-color:#d9dce2}
.v4-metric>svg{margin-left:auto;color:#a6abb4}
.v4-metric-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#f0f1f3;color:#363a43}
.v4-metric>span:nth-child(2){min-width:0;display:flex;flex-direction:column}
.v4-metric small{font-size:9px;color:#757c88;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
.v4-metric strong{font-size:25px;line-height:1;margin:7px 0 5px;letter-spacing:-.04em}
.v4-metric em{font-size:9px;color:#8a9099;font-style:normal}
.v4-metric.warning .v4-metric-icon{background:#fff3e7;color:#b46112}
.v4-metric.violet .v4-metric-icon{background:#eeedff;color:#5d5bd4}
.v4-metric.blue .v4-metric-icon{background:#eaf2ff;color:#2767d8}
.v4-metric.success .v4-metric-icon{background:#e9f8f1;color:#087a55}
.v4-dashboard-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.65fr);gap:18px;align-items:start}
.v4-dashboard-aside{display:grid;gap:18px}
.v4-card{border-radius:18px;border-color:var(--v4-line);box-shadow:0 1px 3px rgba(15,23,42,.025);overflow:hidden}
.v4-card-header{border-bottom:1px solid var(--v4-line)}
.v4-section-kicker{font-size:8px;font-weight:900;letter-spacing:.15em;color:#8a909a;margin-bottom:5px}
.v4-card-body{padding:0}
.v4-mini-agenda{padding:4px 14px 14px}
.v4-agenda-item{width:100%;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid #edf0f2;background:#fff;padding:13px 3px;text-align:left;cursor:pointer}
.v4-agenda-item:last-child{border-bottom:0}
.v4-agenda-item:hover .v4-agenda-copy strong{color:var(--v4-accent)}
.v4-agenda-date{width:45px;height:45px;border-radius:11px;background:#f3f4f6;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.v4-agenda-date strong{font-size:16px;line-height:1}
.v4-agenda-date small{font-size:8px;text-transform:uppercase;color:#767d87;margin-top:3px}
.v4-agenda-copy{min-width:0;flex:1}
.v4-agenda-copy strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.v4-agenda-copy small{display:block;font-size:9px;color:#8a9099;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-agenda-end{display:flex;align-items:center;gap:6px;color:#a2a7b0}
.v4-agenda-end i{font-style:normal;color:#5d5bd4}
.v4-system-card,.v4-assistance-card{border-radius:17px;padding:18px;background:linear-gradient(135deg,#15171d,#22252e);color:#fff;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 32px rgba(15,23,42,.12)}
.v4-system-icon,.v4-assistance-card>div{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.v4-system-card>div:nth-child(2),.v4-assistance-card>span{flex:1}
.v4-system-card small,.v4-assistance-card small{display:block;font-size:8px;color:rgba(255,255,255,.42);letter-spacing:.1em;text-transform:uppercase}
.v4-system-card strong,.v4-assistance-card strong{display:block;font-size:12px;margin:5px 0}
.v4-system-card p,.v4-assistance-card p{font-size:9px;line-height:1.5;color:rgba(255,255,255,.45);margin:0}
.v4-system-card .btn,.v4-assistance-card .btn{align-self:center;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#fff}
.v4-empty{display:flex;align-items:center;justify-content:center;gap:12px;padding:32px;color:#757c87}
.v4-empty>span{width:42px;height:42px;border-radius:12px;background:#f1f2f4;display:grid;place-items:center}
.v4-empty strong{font-size:12px;color:#454b55}
.v4-empty p{font-size:10px;margin:4px 0 0}

/* Inbox / work queue */
.v4-inbox-summary{border-radius:18px;padding:20px 24px;background:linear-gradient(105deg,#111319,#222632);color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.v4-inbox-summary>div:first-child{display:flex;align-items:center;gap:16px}
.v4-inbox-orb{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:24px;font-weight:800}
.v4-inbox-summary small{font-size:8px;color:rgba(255,255,255,.4);font-weight:900;letter-spacing:.12em}
.v4-inbox-summary strong{display:block;margin-top:4px;font-size:13px}
.v4-inbox-summary p{margin:4px 0 0;color:rgba(255,255,255,.45);font-size:10px}
.v4-inbox-health{display:flex;gap:14px;flex-wrap:wrap;color:rgba(255,255,255,.57);font-size:9px}
.v4-inbox-health span{display:flex;align-items:center;gap:6px}
.v4-inbox-health i{width:6px;height:6px;border-radius:50%;background:#22b984}
.v4-filter-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.v4-filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
.v4-filter-tab{min-height:39px;padding:8px 12px;border:1px solid #e1e4e8;border-radius:11px;background:#fff;display:flex;align-items:center;gap:7px;color:#656c78;font-size:10px;font-weight:750;cursor:pointer}
.v4-filter-tab strong{display:grid;place-items:center;min-width:20px;height:20px;border-radius:7px;background:#f0f1f3;color:#525862;font-size:9px}
.v4-filter-tab.active{background:#17191f;color:#fff;border-color:#17191f}
.v4-filter-tab.active strong{background:rgba(255,255,255,.14);color:#fff}
.v4-filter-search{min-width:230px;height:39px;border:1px solid #e1e4e8;border-radius:11px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 11px;color:#8b919a}
.v4-filter-search.wide{min-width:min(620px,100%)}
.v4-filter-search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:10px;color:#343942}
.v4-inbox-card{overflow:visible}
.v4-inbox-list{padding:0 17px}
.v4-work-row{display:flex;align-items:stretch;border-bottom:1px solid #eceef1;position:relative;min-height:112px}
.v4-work-row:last-child{border-bottom:0}
.v4-work-row:before{content:"";position:absolute;left:-18px;top:17px;bottom:17px;width:3px;border-radius:3px;background:transparent}
.v4-work-row.overdue:before{background:#d04c4c}
.v4-work-row.soon:before{background:#d68122}
.v4-work-main{flex:1;min-width:0;display:flex;align-items:center;gap:13px;border:0;background:transparent;text-align:left;padding:16px 8px 16px 0;cursor:pointer}
.v4-priority-rail{width:4px;height:43px;border-radius:4px;background:#c9cbd0;flex:none}
.v4-priority-rail.priority-VERY_URGENT{background:#bb2020}
.v4-priority-rail.priority-URGENT{background:#dc5b22}
.v4-priority-rail.priority-HIGH{background:#d69a20}
.v4-priority-rail.priority-NORMAL{background:#6f79a1}
.v4-priority-rail.priority-LOW{background:#9ca3af}
.v4-work-date{width:49px;height:50px;border-radius:12px;background:#f4f5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.v4-work-date strong{font-size:18px;line-height:1}
.v4-work-date small{font-size:8px;color:#737a85;text-transform:uppercase;margin-top:3px}
.v4-work-copy{min-width:0;flex:1}
.v4-work-copy>strong{display:block;font-size:12px;margin:6px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-work-copy>small{display:block;font-size:9px;color:#8a9099;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-work-copy>p{font-size:10px;color:#555c68;margin:7px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-work-top{display:flex;align-items:center;gap:7px}
.v4-work-top em{font-size:8px;font-style:normal;color:#7a818c}
.v4-work-top em.overdue{color:#b83434;font-weight:800}
.v4-work-top em.soon{color:#aa5b0b;font-weight:800}
.v4-waiting-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;font-size:8px;font-weight:850;white-space:nowrap}
.v4-waiting-badge.wait-marquee{background:#eeedff;color:#5956c7}
.v4-waiting-badge.wait-venue{background:#eaf3ff;color:#2767b7}
.v4-waiting-badge.wait-client{background:#fff1e2;color:#a65a0b}
.v4-waiting-badge.wait-agency{background:#f4eefd;color:#794bb4}
.v4-waiting-badge.wait-none{background:#e9f7f0;color:#087a55}
.v4-work-meta{display:flex;align-items:center;gap:7px;padding:16px 0 16px 12px;flex:none}
.v4-file-chip,.v4-count-chip{min-height:29px;padding:6px 8px;border-radius:8px;border:1px solid #e2e4e8;background:#fff;display:inline-flex;align-items:center;gap:5px;font-size:8px;font-weight:800;color:#5e6570;white-space:nowrap}
button.v4-file-chip{cursor:pointer}
.v4-file-chip.unread{background:#efefff;color:#5653bd;border-color:#d8d6ff;box-shadow:0 0 0 3px rgba(93,91,212,.07)}
.v4-file-chip.empty{color:#999ea7;background:#f7f8f9}
.v4-count-chip{background:#fff4e9;color:#a75e16;border-color:#f3dfca}
.v4-work-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#7a818b;font-size:9px;padding:0 4px}
.v4-work-legend span{display:flex;align-items:center;gap:6px}

/* Wizard */
.v4-wizard-shell{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.v4-wizard-main{border-radius:20px;overflow:hidden}
.v4-wizard-header{padding:17px 20px;border-bottom:1px solid #e7e9ed;display:flex;align-items:center;justify-content:space-between;gap:15px;background:#fbfbfc}
.v4-wizard-steps{display:flex;align-items:center;gap:6px}
.v4-wizard-step{border:0;background:transparent;display:flex;align-items:center;gap:8px;color:#959aa3;font-size:10px;font-weight:750;padding:5px;cursor:pointer}
.v4-wizard-step>span{width:26px;height:26px;border-radius:8px;background:#ebecef;color:#8c929c;display:grid;place-items:center;font-size:9px}
.v4-wizard-step.active{color:#24272d}
.v4-wizard-step.active>span{background:#17191f;color:#fff;box-shadow:0 5px 12px rgba(15,23,42,.14)}
.v4-wizard-step.done{color:#4f5661}
.v4-wizard-step.done>span{background:#e9f7f0;color:#087a55}
.v4-autosave{display:flex;align-items:center;gap:6px;color:#6d7480;font-size:9px;white-space:nowrap}
.v4-wizard-form{display:flex;flex-direction:column;min-height:610px}
.v4-wizard-pane{display:none;padding:28px 30px;flex:1}
.v4-wizard-pane.active{display:block;animation:v4Fade .18s ease}
@keyframes v4Fade{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}
.v4-pane-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.v4-pane-head>div:first-child>span{display:block;font-size:8px;font-weight:900;letter-spacing:.15em;color:#858b95}
.v4-pane-head h2{font-size:23px;letter-spacing:-.035em;margin:7px 0 6px}
.v4-pane-head p{font-size:11px;color:#7b818c;margin:0;line-height:1.5}
.v4-time-badge{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:9px;background:#f3f4f6;color:#757c86;font-size:9px;white-space:nowrap}
.v4-form-grid{gap:16px}
.v4-field{min-height:45px;border-radius:11px;background:#fff}
.v4-time-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v4-template-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:22px}
.v4-template-card{min-height:113px;border:1px solid #e3e5e9;border-radius:14px;background:#fff;text-align:left;padding:14px;cursor:pointer;display:flex;flex-direction:column;transition:.15s}
.v4-template-card:hover,.v4-template-card.selected{border-color:#a9a7ef;background:#f8f8ff;box-shadow:0 8px 25px rgba(93,91,212,.08)}
.v4-template-card>span{width:32px;height:32px;border-radius:9px;background:#f0f1f4;display:grid;place-items:center;color:#555b66;margin-bottom:11px}
.v4-template-card.selected>span{background:#eae9ff;color:#5d5bd4}
.v4-template-card strong{font-size:10px}
.v4-template-card small{font-size:8px;color:#8a9099;margin-top:4px;line-height:1.35}
.v4-services{margin-bottom:18px}
.v4-service-chips{display:flex;gap:6px;flex-wrap:wrap}
.v4-service-chips button{border:1px solid #e2e4e8;background:#f9fafb;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:5px;font-size:8px;color:#59606b;cursor:pointer}
.v4-service-chips button:hover{border-color:#aaa8ee;background:#f4f3ff;color:#5956c7}
.v4-large-textarea{min-height:145px}
.v4-review-box{display:flex;gap:13px;align-items:flex-start;padding:16px;border-radius:14px;background:#f7f8fa;border:1px solid #e6e8ec;margin-top:17px}
.v4-review-icon{width:39px;height:39px;border-radius:11px;background:#fff;display:grid;place-items:center;color:#5d5bd4;border:1px solid #e5e7eb;flex:none}
.v4-review-box small{display:block;font-size:8px;color:#858b95;font-weight:900;letter-spacing:.1em}
.v4-review-box strong{display:block;font-size:11px;margin-top:5px}
.v4-review-box p{font-size:9px;color:#7b818b;line-height:1.5;margin:5px 0 0}
.v4-wizard-footer{min-height:70px;border-top:1px solid #e7e9ed;padding:14px 20px;display:flex;align-items:center;background:#fbfbfc}
.v4-wizard-footer .btn[disabled]{opacity:.35;pointer-events:none}
.v4-submit-event{padding-inline:20px}
.v4-wizard-mobile-step{display:none;font-size:9px;color:#7c828c}
.v4-wizard-aside{display:grid;gap:13px;position:sticky;top:91px}
.v4-live-summary{background:linear-gradient(145deg,#101218,#20232d);color:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px rgba(15,23,42,.13)}
.v4-summary-head{display:flex;gap:11px;align-items:center;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.09)}
.v4-summary-head>span{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.v4-summary-head small{display:block;color:rgba(255,255,255,.38);font-size:7px;letter-spacing:.13em}
.v4-summary-head strong{display:block;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:205px}
.v4-summary-data{display:grid;gap:12px;padding:17px 0}
.v4-summary-data>span{display:flex;gap:9px;align-items:center}
.v4-summary-data i{font-style:normal;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:rgba(255,255,255,.65)}
.v4-summary-data small{display:block;color:rgba(255,255,255,.35);font-size:7px}
.v4-summary-data strong{display:block;color:rgba(255,255,255,.82);font-size:9px;margin-top:2px}
.v4-summary-progress{padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
.v4-summary-progress>div:first-child{display:flex;justify-content:space-between;font-size:8px;color:rgba(255,255,255,.5)}
.v4-summary-progress strong{color:#fff}
.v4-progress-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.09);margin-top:9px;overflow:hidden}
.v4-progress-bar i{height:100%;display:block;background:linear-gradient(90deg,#706de8,#aaa8ff);border-radius:5px}
.v4-tip-card{padding:15px;border-radius:15px;border:1px solid #e1e4e8;background:#fff;display:flex;gap:10px;align-items:flex-start;color:#5d5bd4}
.v4-tip-card>div{color:#292d34}
.v4-tip-card strong{font-size:10px}
.v4-tip-card p{font-size:8px;color:#818791;line-height:1.5;margin:4px 0 0}

/* Contacts */
.v4-contacts-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:15px}
.v4-contact-count{text-align:right}
.v4-contact-count strong{display:block;font-size:18px}
.v4-contact-count span{display:block;color:#8b919a;font-size:8px;margin-top:2px}
.v4-contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.v4-contact-card{padding:17px;border-radius:16px}
.v4-contact-top{display:flex;align-items:center;gap:11px}
.v4-contact-avatar{width:42px;height:42px;border-radius:12px;background:#eef0f3;color:#41464f;display:grid;place-items:center;font-size:11px;font-weight:850;flex:none}
.v4-contact-avatar.venue{background:#17191f;color:#fff}
.v4-contact-top>div:last-child{min-width:0}
.v4-contact-top strong{font-size:11px}
.v4-contact-top p{font-size:9px;color:#8b919a;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-contact-lines{display:grid;gap:7px;margin:15px 0;padding:12px 0;border-top:1px solid #eceef1;border-bottom:1px solid #eceef1}
.v4-contact-lines a{display:flex;align-items:center;gap:8px;color:#5b626e;font-size:9px;min-width:0}
.v4-contact-lines a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-contact-events{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#747b86;font-size:8px}
.v4-contact-events button{border:0;background:transparent;color:#5d5bd4;display:flex;align-items:center;gap:4px;font-size:8px;cursor:pointer;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Venues */
.v4-venue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.v4-venue-card{border-radius:19px;overflow:hidden}
.v4-venue-cover{min-height:155px;background:radial-gradient(circle at 82% 12%,rgba(121,118,229,.28),transparent 32%),linear-gradient(145deg,#111319,#252934);color:#fff;padding:21px;position:relative;display:flex;align-items:flex-end;gap:13px}
.v4-venue-monogram{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;font-size:14px;font-weight:850;flex:none}
.v4-venue-cover-copy{min-width:0;flex:1}
.v4-venue-cover-copy>span{font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.13em}
.v4-venue-cover-copy h2{font-size:18px;margin:6px 0 4px;letter-spacing:-.025em}
.v4-venue-cover-copy p{font-size:8px;color:rgba(255,255,255,.45);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-tech-score{position:absolute;right:17px;top:17px;text-align:right}
.v4-tech-score strong{display:block;font-size:16px}
.v4-tech-score span{display:block;font-size:7px;color:rgba(255,255,255,.4);margin-top:2px}
.v4-venue-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #eceef1}
.v4-venue-stats span{padding:13px;text-align:center;border-right:1px solid #eceef1}
.v4-venue-stats span:last-child{border-right:0}
.v4-venue-stats strong{display:block;font-size:17px}
.v4-venue-stats small{display:block;font-size:7px;color:#8a9099;margin-top:3px}
.v4-venue-contact{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 17px 12px}
.v4-venue-contact>span{display:flex;align-items:center;gap:8px;min-width:0;color:#727984}
.v4-venue-contact small{display:block;font-size:7px;color:#999ea6}
.v4-venue-contact strong{display:block;font-size:9px;color:#464c55;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-tech-chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 17px 14px}
.v4-tech-chips span{display:flex;align-items:center;gap:4px;padding:5px 7px;border-radius:7px;background:#f3f4f6;color:#69707b;font-size:7px}
.v4-venue-actions{display:flex;gap:7px;padding:14px 17px;border-top:1px solid #eceef1}
.v4-venue-actions .btn-primary{flex:1}
.v4-venue-profile-hero{min-height:240px;padding:31px 35px;border-radius:23px;background:radial-gradient(circle at 78% 22%,rgba(115,112,225,.24),transparent 28%),linear-gradient(135deg,#0d0f14,#252a35);color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative;overflow:hidden}
.v4-venue-profile-hero h1{font-size:36px;letter-spacing:-.045em;margin:8px 0}
.v4-venue-profile-hero>div:first-child>span{font-size:8px;letter-spacing:.15em;color:rgba(255,255,255,.45);text-transform:uppercase}
.v4-venue-profile-hero p{color:rgba(255,255,255,.48);font-size:11px;margin:0 0 19px}
.v4-tech-ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(#aaa8ff var(--progress),rgba(255,255,255,.1) 0);display:grid;place-items:center;position:relative;margin-right:40px}
.v4-tech-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#171a21}
.v4-tech-ring>span{position:relative;text-align:center}
.v4-tech-ring strong{font-size:31px;display:block}
.v4-tech-ring small{font-size:8px;color:rgba(255,255,255,.45)}
.v4-tech-ring.small{width:88px;height:88px;margin:0;flex:none}
.v4-tech-ring.small:before{inset:6px;background:#fff}
.v4-tech-ring.small strong{font-size:17px;color:#1d2026}
.v4-tech-ring.small small{color:#8a9099}
.v4-venue-profile-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.65fr);gap:18px}
.v4-tech-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e8eaee}
.v4-tech-detail-grid article{background:#fff;padding:17px;display:flex;gap:11px;align-items:flex-start}
.v4-tech-detail-grid article>span{width:34px;height:34px;border-radius:10px;background:#f1f2f4;display:grid;place-items:center;color:#5f6670;flex:none}
.v4-tech-detail-grid small{display:block;font-size:7px;color:#959aa3;text-transform:uppercase;letter-spacing:.08em}
.v4-tech-detail-grid strong{display:block;font-size:9px;line-height:1.45;margin-top:4px;font-weight:700}
.v4-tech-note{padding:17px;border-top:1px solid #e8eaee;background:#fbfbfc}
.v4-tech-note strong{font-size:9px}
.v4-tech-note p{font-size:9px;color:#7c828c;line-height:1.55;margin:5px 0 0}

/* Event workspace */
.v4-overlay{background:rgba(7,9,13,.58);backdrop-filter:blur(5px)}
.v4-drawer{width:min(1120px,94vw);border-radius:24px 0 0 24px;box-shadow:-24px 0 80px rgba(0,0,0,.22);overflow:hidden}
.v4-drawer-head{padding:0;background:#fff;border-bottom:0;position:sticky;top:0;z-index:8}
.v4-drawer-topline{height:51px;padding:0 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eceef1;background:#fbfbfc}
.v4-drawer-location{display:flex;align-items:center;gap:7px;color:#747b86;font-size:9px;min-width:0}
.v4-drawer-location b{color:#c4c7cc}
.v4-drawer-actions{display:flex;align-items:center;gap:7px}
.v4-drawer-title-row{padding:18px 23px;display:flex;align-items:center;gap:13px}
.v4-event-symbol{width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,#17191f,#30343e);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:850;flex:none}
.v4-drawer-title-row h2{font-size:22px;margin:6px 0 4px}
.v4-command-strip{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);border-top:1px solid #eceef1;border-bottom:1px solid #e4e6ea;background:#f7f8fa}
.v4-command-primary{padding:14px 22px;display:flex;align-items:center;gap:11px;border-right:1px solid #e2e4e8}
.v4-command-primary>span{width:34px;height:34px;border-radius:10px;background:#eeedff;color:#5d5bd4;display:grid;place-items:center;flex:none}
.v4-command-primary small{display:block;font-size:7px;color:#8c929c;letter-spacing:.1em;font-weight:900}
.v4-command-primary strong{display:block;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:430px}
.v4-command-primary em{margin-left:auto;font-style:normal;font-size:8px;color:#6e7580;white-space:nowrap}
.v4-command-primary.overdue em{color:#bd3636;font-weight:850}
.v4-command-meta{display:flex;align-items:center;gap:14px;padding:10px 17px;min-width:0}
.v4-command-meta>span:not(.v4-waiting-badge){display:flex;align-items:center;gap:7px;color:#767d88;min-width:0}
.v4-command-meta>span>div{min-width:0}
.v4-command-meta small{display:block;font-size:6px;color:#9a9fa7;text-transform:uppercase;letter-spacing:.08em}
.v4-command-meta strong{display:block;font-size:8px;color:#4e545e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.v4-drawer-tabs{display:flex;align-items:center;gap:1px;padding:0 18px;overflow-x:auto;background:#fff;border-bottom:1px solid #e6e8ec;position:sticky;top:0;z-index:7}
.v4-drawer-tabs .tab-btn{display:flex;align-items:center;gap:6px;padding:13px 11px;border-bottom-width:2px;white-space:nowrap;font-size:9px}
.v4-drawer-body{background:#f4f5f7;padding:20px 22px 70px}
.v4-public-state-card,.v4-control-card{border-radius:17px;padding:19px 21px;background:linear-gradient(135deg,#13161c,#252a35);color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:18px;overflow:hidden}
.v4-public-state-card>div:first-child{min-width:230px}
.v4-public-state-card small,.v4-control-card small{display:block;color:rgba(255,255,255,.4);font-size:7px;letter-spacing:.11em;font-weight:900}
.v4-public-state-card strong,.v4-control-card strong{display:block;font-size:16px;margin-top:5px}
.v4-public-state-card p,.v4-control-card p{font-size:9px;line-height:1.5;color:rgba(255,255,255,.48);margin:5px 0 0;max-width:400px}
.v4-control-card>div{display:flex;align-items:center;gap:12px}
.v4-control-card>div>span{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.v4-public-progress{display:flex;align-items:flex-start;flex:1;justify-content:flex-end}
.v4-progress-step{position:relative;min-width:68px;display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.26)}
.v4-progress-step:not(:last-child):after{content:"";position:absolute;top:12px;left:calc(50% + 14px);right:calc(-50% + 14px);height:1px;background:rgba(255,255,255,.12)}
.v4-progress-step>span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:8px;position:relative;z-index:1}
.v4-progress-step small{font-size:6px;margin-top:7px;white-space:nowrap;color:inherit;letter-spacing:0;text-transform:none}
.v4-progress-step.done,.v4-progress-step.current{color:#fff}
.v4-progress-step.done>span{background:#087a55}
.v4-progress-step.current>span{background:#7774e2;box-shadow:0 0 0 5px rgba(119,116,226,.18)}
.v4-progress-step.done:not(:last-child):after{background:#29926f}
.v4-event-health{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.v4-event-health article{border:1px solid #e3e5e9;border-radius:14px;background:#fff;padding:15px;display:flex;align-items:center;gap:10px;min-width:0}
.v4-health-icon{width:37px;height:37px;border-radius:10px;background:#f0f1f3;color:#555c67;display:grid;place-items:center;flex:none}
.v4-event-health article.has-file .v4-health-icon{background:#eeedff;color:#5d5bd4}
.v4-event-health article>div{min-width:0;flex:1}
.v4-event-health small{display:block;font-size:7px;color:#959aa3;text-transform:uppercase;letter-spacing:.08em}
.v4-event-health strong{display:block;font-size:9px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-event-health p{font-size:7px;color:#8b919a;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-event-health button{border:0;background:transparent;color:#5d5bd4;font-size:8px;font-weight:800;cursor:pointer}
.v4-attention-section{border-color:#eadac9;background:#fffaf4}
.v4-info-preview{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 16px 16px}
.v4-info-preview span{display:flex;align-items:center;gap:7px;padding:9px 10px;border:1px solid #f0dfce;background:#fff;border-radius:9px;font-size:8px;color:#555c66}
.v4-info-preview em{font-style:normal;margin-left:auto;color:#a26220;font-size:7px}
.v4-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e6e8ec}
.v4-detail-grid article{display:flex;align-items:flex-start;gap:10px;padding:16px;background:#fff}
.v4-detail-grid article>span{width:34px;height:34px;border-radius:9px;background:#f1f2f4;color:#606772;display:grid;place-items:center;flex:none}
.v4-detail-grid small{display:block;font-size:6px;color:#969ba4;text-transform:uppercase;letter-spacing:.08em}
.v4-detail-grid strong{display:block;font-size:9px;margin-top:4px}
.v4-detail-grid p{font-size:7px;color:#868c96;margin:3px 0 0}
.v4-operational-timeline{display:flex;align-items:flex-start;padding:20px 16px 17px;overflow-x:auto}
.v4-operational-timeline>span{display:flex;flex-direction:column;align-items:center;min-width:92px;position:relative;color:#9096a0}
.v4-operational-timeline i{width:32px;height:32px;border-radius:10px;background:#f0f1f3;display:grid;place-items:center;font-style:normal;position:relative;z-index:1}
.v4-operational-timeline strong{font-size:10px;margin-top:8px;color:#414750}
.v4-operational-timeline small{font-size:7px;margin-top:3px}
.v4-operational-timeline b{position:absolute;top:16px;left:calc(50% + 16px);right:calc(-50% + 16px);height:1px;background:#dfe2e6}
.v4-operational-timeline .defined i{background:#eeedff;color:#5d5bd4}
.v4-operational-timeline .pending{opacity:.52}
.v4-venue-mini-tech{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e6e8ec}
.v4-venue-mini-tech>span{display:flex;align-items:flex-start;gap:10px;padding:15px;background:#fff;color:#626974;min-width:0}
.v4-venue-mini-tech small{display:block;font-size:6px;color:#999ea7;text-transform:uppercase;letter-spacing:.08em}
.v4-venue-mini-tech strong{display:block;font-size:8px;line-height:1.45;margin-top:4px;color:#4b515b}
.v4-inline-controls{grid-template-columns:repeat(3,1fr)}

/* Budgets */
.v4-current-budget{border-radius:18px;background:linear-gradient(145deg,#13151b,#252934);color:#fff;overflow:hidden;margin-bottom:14px;box-shadow:0 16px 36px rgba(15,23,42,.14)}
.v4-current-budget-visual{display:flex;align-items:flex-start;gap:16px;padding:22px 24px 17px}
.v4-pdf-mark{width:55px;height:68px;border-radius:10px 10px 15px 10px;background:#fff;color:#262a31;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;font-size:10px;font-weight:900;position:relative;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.v4-pdf-mark:before{content:"";position:absolute;right:0;top:0;border-left:14px solid transparent;border-bottom:14px solid #d9dce1}
.v4-current-budget-visual small{display:block;font-size:7px;letter-spacing:.12em;color:rgba(255,255,255,.4);font-weight:900}
.v4-current-budget-visual h3{font-size:20px;margin:6px 0 5px}
.v4-current-budget-visual p{font-size:9px;color:rgba(255,255,255,.48);line-height:1.5;margin:0 0 10px}
.v4-current-budget-meta{display:grid;grid-template-columns:repeat(4,1fr);padding:13px 24px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.v4-current-budget-meta span{padding-right:12px;border-right:1px solid rgba(255,255,255,.08)}
.v4-current-budget-meta span+span{padding-left:12px}
.v4-current-budget-meta span:last-child{border-right:0}
.v4-current-budget-meta small{display:block;font-size:6px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em}
.v4-current-budget-meta strong{display:block;font-size:8px;margin-top:4px;color:rgba(255,255,255,.78)}
.v4-current-budget-actions{display:flex;gap:8px;padding:15px 24px}
.v4-current-budget-actions .btn-primary{background:#fff;color:#191c22}
.v4-current-budget-actions .btn-secondary{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff}
.v4-no-budget{padding:24px;border-radius:17px;background:#fff;border:1px dashed #cdd1d8;display:flex;align-items:center;gap:15px;margin-bottom:14px}
.v4-no-budget>span{width:50px;height:50px;border-radius:13px;background:#f0f1f3;display:grid;place-items:center;color:#737a84;flex:none}
.v4-no-budget>div{flex:1}
.v4-no-budget small{font-size:7px;color:#949aa3;letter-spacing:.1em;font-weight:900}
.v4-no-budget h3{font-size:14px;margin:5px 0}
.v4-no-budget p{font-size:9px;color:#7f858f;margin:0;line-height:1.5}
.v4-upload-inline{overflow:visible}
.v4-budget-upload-form{display:grid;gap:11px}
.v4-drop-zone{min-height:110px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.v4-drop-zone span{display:flex;flex-direction:column}
.v4-drop-zone small{font-size:8px;color:#969ba4;margin-top:4px}
.v4-upload-fields{display:grid;grid-template-columns:1fr 180px 1fr auto;gap:8px}
.v4-budget-version-list{padding:0 16px 16px}
.v4-budget-version{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid #eceef1}
.v4-budget-version:last-child{border-bottom:0}
.v4-budget-version.current{background:#fafaff;border:1px solid #e1e0ff;border-radius:12px;margin:7px 0}
.v4-version-number{width:38px;height:38px;border-radius:10px;background:#f0f1f3;display:grid;place-items:center;font-size:9px;font-weight:850;flex:none}
.v4-budget-version.current .v4-version-number{background:#5d5bd4;color:#fff}
.v4-budget-version>div:nth-child(2){min-width:0;flex:1}
.v4-budget-version strong{font-size:10px}
.v4-budget-version p{font-size:8px;color:#7f858e;margin:4px 0}
.v4-budget-version small{font-size:7px;color:#999ea7}
.v4-version-actions{display:flex;gap:5px}

/* Tasks */
.v4-task-summary{border-radius:16px;background:linear-gradient(135deg,#14161d,#242833);color:#fff;padding:19px 21px;display:flex;align-items:center;gap:16px;margin-bottom:14px}
.v4-task-summary>span{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.v4-task-summary>span strong{font-size:23px;line-height:1}
.v4-task-summary>span small{font-size:7px;color:rgba(255,255,255,.4);margin-top:4px}
.v4-task-summary>div small{display:block;color:rgba(255,255,255,.35);font-size:7px;letter-spacing:.12em;font-weight:900}
.v4-task-summary>div strong{display:block;font-size:13px;margin-top:5px}
.v4-task-summary p{font-size:8px;color:rgba(255,255,255,.45);margin:4px 0 0}
.v4-checklist{padding:0 16px 13px}
.v4-check-item{display:flex;align-items:flex-start;gap:10px;padding:12px 2px;border-bottom:1px solid #eceef1}
.v4-check-item:last-child{border-bottom:0}
.v4-check-item.done{opacity:.58}
.v4-check-button{border:0;background:transparent;color:#9a9fa8;padding:0;cursor:pointer}
.v4-check-item:not(.done) .v4-check-button:hover{color:#5d5bd4}
.v4-check-item.done .v4-check-button{color:#087a55}
.v4-check-item>div{flex:1;min-width:0}
.v4-check-item strong{font-size:9px}
.v4-check-item.done strong{text-decoration:line-through}
.v4-check-item p{font-size:7px;color:#8b919a;margin:4px 0 0}
.v4-assignee{padding:3px 6px;border-radius:6px;font-size:6px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}
.v4-assignee.marquee{background:#eeedff;color:#5d5bd4}
.v4-assignee.venue{background:#e9f3ff;color:#2767b7}
.v4-assignee.client{background:#fff1e2;color:#a75b0d}
.v4-assignee.agency{background:#f3edfb;color:#7747ad}
.v4-add-row{display:grid;grid-template-columns:1fr 140px 150px auto;gap:8px;padding:13px 16px 16px;border-top:1px solid #eceef1;background:#fafbfc}
.v4-next-action-form{padding:0 16px 16px}

/* Modals */
.v4-preview-layer{background:rgba(8,10,14,.76);backdrop-filter:blur(8px)}
.v4-preview-modal{width:min(1060px,94vw);height:min(830px,92vh);border-radius:20px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.35)}
.v4-preview-modal header{min-height:70px;padding:13px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb}
.v4-preview-modal header>div:first-child{display:flex;align-items:center;gap:10px}
.v4-pdf-mini{width:34px;height:41px;border-radius:7px;background:#17191f;color:#fff;display:grid;place-items:center;font-size:7px;font-weight:900}
.v4-preview-modal header small{display:block;font-size:7px;color:#8a9099;letter-spacing:.08em}
.v4-preview-modal header strong{display:block;font-size:11px;margin-top:4px}
.v4-preview-body{flex:1;background:#33363d;padding:16px;min-height:0}
.v4-preview-body iframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff}
.v4-preview-loading{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:13px;font-size:11px}
.v4-preview-modal footer{min-height:42px;padding:9px 17px;border-top:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;color:#7b818b;font-size:8px}
.v4-preview-modal footer span{display:flex;align-items:center;gap:6px}
.v4-tech-modal{width:min(850px,92vw);max-height:90vh;overflow:auto;border-radius:21px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.v4-tech-modal>header{padding:22px;display:flex;align-items:flex-start;justify-content:space-between;background:linear-gradient(135deg,#12141a,#252934);color:#fff;border-radius:21px 21px 0 0}
.v4-tech-modal>header>div{display:flex;align-items:center;gap:12px}
.v4-tech-modal-icon{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.v4-tech-modal header small{font-size:7px;color:rgba(255,255,255,.4);letter-spacing:.12em}
.v4-tech-modal header h2{font-size:20px;margin:5px 0 3px}
.v4-tech-modal header p{font-size:8px;color:rgba(255,255,255,.45);margin:0}
.v4-tech-modal header .close-btn{color:#fff;background:rgba(255,255,255,.08)}
.v4-tech-modal-score{display:flex;align-items:center;gap:15px;padding:18px 22px;border-bottom:1px solid #e7e9ed}
.v4-tech-modal-score>div:last-child strong{font-size:11px}
.v4-tech-modal-score p{font-size:8px;color:#7c838d;line-height:1.5;margin:4px 0 0}
.v4-tech-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e7e9ed}
.v4-tech-modal-grid article{background:#fff;padding:16px 20px;display:flex;align-items:flex-start;gap:10px}
.v4-tech-modal-grid article>span{width:34px;height:34px;border-radius:10px;background:#f1f2f4;display:grid;place-items:center;color:#606772;flex:none}
.v4-tech-modal-grid small{display:block;font-size:7px;color:#969ba4;text-transform:uppercase;letter-spacing:.08em}
.v4-tech-modal-grid strong{display:block;font-size:9px;line-height:1.45;margin-top:4px}
.v4-tech-modal-note{padding:17px 22px;background:#fafbfc;border-top:1px solid #e7e9ed}
.v4-tech-modal-note strong{font-size:9px}
.v4-tech-modal-note p{font-size:8px;color:#7c838d;line-height:1.5;margin:5px 0 0}
.v4-tech-modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid #e7e9ed}
.v4-revision-modal{width:min(580px,92vw)}
.v4-revision-note{display:flex;align-items:flex-start;gap:7px;padding:10px;border-radius:10px;background:#f2f3f5;color:#6d7480;font-size:8px;line-height:1.5}

/* Responsive */
@media (max-width:1280px){
  .v4-main-content{padding-inline:22px}
  .v4-metric-grid{grid-template-columns:repeat(2,1fr)}
  .v4-contact-grid,.v4-venue-grid{grid-template-columns:repeat(2,1fr)}
  .v4-template-grid{grid-template-columns:repeat(2,1fr)}
  .v4-command-meta>span:nth-last-child(1){display:none}
}
@media (max-width:1100px){
  .v4-sidebar{width:248px}
  .v4-dashboard-layout,.v4-venue-profile-layout{grid-template-columns:1fr}
  .v4-wizard-shell{grid-template-columns:1fr}
  .v4-wizard-aside{position:static;grid-template-columns:1fr 1fr}
  .v4-detail-grid{grid-template-columns:repeat(2,1fr)}
  .v4-command-strip{grid-template-columns:1fr}
  .v4-command-primary{border-right:0;border-bottom:1px solid #e2e4e8}
  .v4-public-state-card{display:block}
  .v4-public-progress{margin-top:21px;justify-content:flex-start;overflow-x:auto;padding-bottom:5px}
  .v4-progress-step{min-width:76px}
}
@media (max-width:900px){
  .v4-main-content{padding:18px 16px 100px}
  .v4-topbar{padding:0 15px}
  .v4-top-status{display:none}
  .v4-welcome{padding:27px;min-height:230px}
  .v4-welcome h1{font-size:34px}
  .v4-pulse-panel{width:310px}
  .v4-focus-orb{width:190px;min-width:190px}
  .v4-event-health{grid-template-columns:1fr}
  .v4-current-budget-meta{grid-template-columns:1fr 1fr;gap:12px}
  .v4-current-budget-meta span{border-right:0;padding:0}
  .v4-upload-fields{grid-template-columns:1fr 1fr}
  .v4-add-row{grid-template-columns:1fr 1fr}
  .v4-login-copy h1{font-size:44px}
}
@media (max-width:760px){
  .v4-topbar{height:61px}
  .v4-command-trigger{height:39px;max-width:none;flex:1}
  .v4-command-trigger span{display:none}
  .v4-command-trigger kbd{display:none}
  .v4-work-button{display:none}
  .v4-page-head{align-items:flex-start}
  .v4-page-head h1{font-size:26px}
  .v4-welcome{display:block;padding:25px 22px;border-radius:20px}
  .v4-welcome h1{font-size:31px}
  .v4-pulse-panel{width:100%;margin-top:23px}
  .v4-focus-orb{width:150px;min-width:150px;margin:28px auto 5px}
  .v4-focus-orb span{font-size:42px}
  .v4-metric-grid{grid-template-columns:1fr 1fr;gap:8px}
  .v4-metric{min-height:104px;padding:13px;display:block;position:relative}
  .v4-metric-icon{width:34px;height:34px;margin-bottom:10px}
  .v4-metric>svg{position:absolute;right:12px;top:12px}
  .v4-filter-bar{align-items:stretch;flex-direction:column}
  .v4-filter-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}
  .v4-filter-tab{white-space:nowrap}
  .v4-filter-search{width:100%}
  .v4-inbox-summary{display:block;padding:18px}
  .v4-inbox-health{margin-top:15px}
  .v4-work-row{display:block;padding:0}
  .v4-work-main{padding-right:0}
  .v4-work-meta{padding:0 0 13px 67px;justify-content:flex-end}
  .v4-work-meta .btn{margin-left:auto}
  .v4-wizard-header{display:block}
  .v4-wizard-steps{justify-content:space-between}
  .v4-wizard-step strong{display:none}
  .v4-autosave{margin-top:11px}
  .v4-wizard-pane{padding:23px 18px}
  .v4-pane-head{display:block}
  .v4-time-badge{display:inline-flex;margin-top:12px}
  .v4-wizard-aside{grid-template-columns:1fr}
  .v4-template-grid{grid-template-columns:1fr 1fr}
  .v4-form-grid{grid-template-columns:1fr}
  .v4-time-pair{grid-template-columns:1fr 1fr}
  .v4-wizard-mobile-step{display:block}
  .v4-contact-grid,.v4-venue-grid{grid-template-columns:1fr}
  .v4-contacts-toolbar{align-items:stretch;flex-direction:column}
  .v4-contact-count{text-align:left;display:flex;align-items:baseline;gap:6px}
  .v4-drawer{width:100vw;max-width:none;border-radius:0}
  .v4-drawer-topline{padding:0 13px}
  .v4-drawer-location span:nth-of-type(2),.v4-drawer-location b{display:none}
  .v4-drawer-actions .btn{display:none}
  .v4-drawer-title-row{padding:15px}
  .v4-event-symbol{width:42px;height:42px}
  .v4-drawer-title-row h2{font-size:18px}
  .v4-command-primary{padding:12px 15px}
  .v4-command-primary strong{max-width:220px}
  .v4-command-meta{overflow-x:auto;padding:10px 13px}
  .v4-drawer-tabs{padding:0 8px}
  .v4-drawer-body{padding:13px 12px 95px}
  .v4-public-state-card,.v4-control-card{padding:17px;display:block}
  .v4-control-card .btn{margin-top:14px;width:100%}
  .v4-public-progress{margin-left:-6px}
  .v4-progress-step{min-width:67px}
  .v4-progress-step small{font-size:5px}
  .v4-detail-grid{grid-template-columns:1fr 1fr}
  .v4-info-preview{grid-template-columns:1fr}
  .v4-venue-mini-tech{grid-template-columns:1fr}
  .v4-operational-timeline>span{min-width:78px}
  .v4-current-budget-visual{padding:18px}
  .v4-current-budget-meta{padding:13px 18px}
  .v4-current-budget-actions{padding:14px 18px;flex-wrap:wrap}
  .v4-current-budget-actions .btn{flex:1}
  .v4-upload-fields{grid-template-columns:1fr}
  .v4-add-row{grid-template-columns:1fr}
  .v4-tech-detail-grid,.v4-tech-modal-grid{grid-template-columns:1fr}
  .v4-venue-profile-hero{padding:25px 21px;min-height:220px}
  .v4-venue-profile-hero h1{font-size:28px}
  .v4-tech-ring{width:105px;height:105px;margin-right:0}
  .v4-tech-ring strong{font-size:22px}
  .v4-preview-modal{width:100vw;height:100vh;max-height:none;border-radius:0}
  .v4-preview-modal header{padding:10px}
  .v4-preview-modal header .btn span{display:none}
  .v4-preview-body{padding:5px}
  .v4-preview-modal footer{display:none}
  .v4-tech-modal{width:100vw;max-height:100vh;border-radius:0}
  .v4-tech-modal>header{border-radius:0}
}
@media (max-width:520px){
  .v4-main-content{padding:14px 11px 92px}
  .v4-page-head{margin-bottom:15px}
  .v4-page-head .page-actions .btn-secondary{display:none}
  .v4-welcome{padding:23px 18px}
  .v4-welcome h1{font-size:28px}
  .v4-welcome p{font-size:12px}
  .v4-welcome .hero-actions{display:grid;grid-template-columns:1fr}
  .v4-pulse-grid{grid-template-columns:repeat(4,1fr)}
  .v4-pulse-grid span{padding:10px 4px;text-align:center}
  .v4-pulse-grid strong{font-size:18px}
  .v4-pulse-grid small{font-size:6px}
  .v4-metric-grid{grid-template-columns:1fr 1fr}
  .v4-metric{min-height:112px}
  .v4-metric strong{font-size:22px}
  .v4-work-date{width:43px;height:45px}
  .v4-work-copy>p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .v4-work-meta{padding-left:57px;overflow-x:auto;justify-content:flex-start}
  .v4-work-meta .btn{margin-left:0}
  .v4-inbox-health span:nth-child(3){display:none}

  }

  function nowIso() { return new Date().toISOString(); }

  function dateIso(date) {
    const d = new Date(date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function addDaysIso(days, base = new Date()) {
    const d = new Date(base);
    d.setDate(d.getDate() + days);
    return dateIso(d);
  }

  function parseDate(iso) { return new Date(`${iso}T12:00:00`); }

  function formatDate(iso, options = { day: "2-digit", month: "short", year: "numeric" }) {
    if (!iso) return "—";
    return new Intl.DateTimeFormat("es-ES", options).format(parseDate(iso)).replaceAll(".", "");
  }

  function formatDateLong(iso) {
    return formatDate(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  function formatDateTime(iso) {
    if (!iso) return "—";
    return new Intl.DateTimeFormat("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })
      .format(new Date(iso)).replaceAll(".", "");
  }

  function relativeTime(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const minutes = Math.max(0, Math.round(diff / 60000));
    if (minutes < 1) return "ahora";
    if (minutes < 60) return `hace ${minutes} min`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `hace ${hours} h`;
    const days = Math.round(hours / 24);
    return `hace ${days} día${days === 1 ? "" : "s"}`;
  }

  function initials(user) {
    return `${user?.firstName?.[0] || ""}${user?.lastName?.[0] || ""}`.toUpperCase();
  }

  function statusBadge(value) {
    const item = STATUS[value] || { label: value, className: "badge-neutral" };
    return `<span class="badge ${item.className}"><span class="dot"></span>${escapeHtml(item.label)}</span>`;
  }

  function priorityBadge(value) {
    const item = PRIORITY[value] || PRIORITY.NORMAL;
    return `<span class="badge ${item.className}"><span class="dot"></span>${escapeHtml(item.label)}</span>`;
  }

  function budgetBadge(value) {
    const map = { DRAFT: "badge-neutral", SENT: "badge-sent", FINAL: "badge-confirmed", ARCHIVED: "badge-declined" };
    return `<span class="badge ${map[value] || "badge-neutral"}">${escapeHtml(BUDGET_STATUS[value] || value)}</span>`;
  }

  function optionList(object, selected = "", includeAll = false, allLabel = "Todos") {
    const start = includeAll ? `<option value="">${escapeHtml(allLabel)}</option>` : "";
    return start + Object.entries(object).map(([key, item]) => {
      const label = typeof item === "string" ? item : item.label;
      return `<option value="${key}" ${key === selected ? "selected" : ""}>${escapeHtml(label)}</option>`;
    }).join("");
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function base64ToBlob(base64, type) {
    const raw = atob(base64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return new Blob([bytes], { type });
  }

  function openFileDb() {
    return new Promise((resolve) => {
      try {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(FILE_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch {
        resolve(null);
      }
    });
  }

  async function saveFileBlob(id, blob) {
    const db = await openFileDb();
    if (!db) return;
    await new Promise((resolve, reject) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").put(blob, id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }

  async function getFileBlob(id) {
    const db = await openFileDb();
    if (!db) return null;
    const result = await new Promise((resolve, reject) => {
      const tx = db.transaction("files", "readonly");
      const req = tx.objectStore("files").get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return result;
  }

  async function clearFileDb() {
    try {
      if (!window.indexedDB) return;
      await new Promise(resolve => {
        const req = indexedDB.deleteDatabase(FILE_DB);
        req.onsuccess = req.onerror = req.onblocked = () => resolve();
      });
    } catch {
      // La demo sigue funcionando aunque el navegador bloquee IndexedDB.
    }
  }
